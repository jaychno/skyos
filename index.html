<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyOS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,200..800&family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #07090d;
  --border: rgba(255, 255, 255, 0.11);
  --accent: #b7f36b;
  --text: #f5f7fa;
  --muted: rgba(226, 232, 240, 0.56);
  --spring: cubic-bezier(0.32, 0.72, 0, 1);
  --wallpaper:
    radial-gradient(circle at 18% 18%, rgba(88, 138, 194, 0.42), transparent 52%),
    radial-gradient(circle at 86% 74%, rgba(56, 189, 248, 0.2), transparent 50%),
    linear-gradient(160deg, #1b2736 0%, #101620 55%, #090c11 100%);
  --brightness: 1;
  --font-ui: "Google Sans", "Google Sans Flex", system-ui, -apple-system, sans-serif;
  --font-display: "Google Sans Flex", "Google Sans", system-ui, -apple-system, sans-serif;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: radial-gradient(circle at 50% 0%, #1a212e 0%, #07090d 65%);
  font-family: var(--font-ui);
  color: var(--text);
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 16px;
  -webkit-font-smoothing: antialiased;
}

/* Hardware Frame */
.phone-wrap { position: relative; }

.vol-btn {
  position: absolute;
  left: -5px;
  width: 4px;
  height: 42px;
  background: linear-gradient(180deg, #525b6b, #2f3540);
  border-radius: 4px 0 0 4px;
  pointer-events: none;
}
.vol-up { top: 146px; }
.vol-down { top: 200px; }

.power-btn {
  position: absolute;
  right: -6px;
  top: 174px;
  width: 5px;
  height: 66px;
  background: linear-gradient(180deg, #596273, #313742);
  border-radius: 0 4px 4px 0;
  border: 0;
  cursor: pointer;
  transition: transform 0.12s var(--spring);
}
.power-btn:active { transform: translateX(-1.5px); }

.phone {
  width: min(392px, 95vw);
  height: min(826px, 93vh);
  min-height: 620px;
  background: #050609;
  border: 7px solid #292f3a;
  border-radius: 48px;
  padding: 9px;
  box-shadow:
    0 36px 90px rgba(0, 0, 0, 0.76),
    0 0 0 1px rgba(255, 255, 255, 0.08),
    inset 0 0 0 1.5px rgba(255, 255, 255, 0.05);
  overflow: hidden;
}

.screen {
  height: 100%;
  border-radius: 35px;
  background: var(--wallpaper);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  filter: brightness(var(--brightness));
  transition: background 0.55s ease;
  user-select: none;
}

/* Status Bar & Dynamic Island */
.status {
  height: 42px;
  padding: 12px 22px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  z-index: 30;
  cursor: pointer;
}

.island {
  position: absolute;
  top: 11px;
  left: 50%;
  transform: translateX(-50%);
  width: 98px;
  height: 25px;
  background: #040507;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 9px;
  box-shadow:
    0 2px 12px rgba(0, 0, 0, 0.55),
    inset 0 0 0 0.5px rgba(255, 255, 255, 0.08);
  z-index: 31;
  cursor: pointer;
  transition: width 0.35s var(--spring);
}

.island.expanded { width: 136px; }

.island-wave {
  display: none;
  align-items: center;
  gap: 2px;
  height: 12px;
}
.island.playing .island-wave { display: flex; }
.island-wave span {
  width: 2.2px;
  height: 4px;
  background: var(--accent);
  border-radius: 2px;
  animation: eq 0.9s ease-in-out infinite alternate;
}
.island-wave span:nth-child(2) { animation-delay: 0.2s; }
.island-wave span:nth-child(3) { animation-delay: 0.45s; }
@keyframes eq {
  from { height: 3px; opacity: 0.6; }
  to   { height: 11px; opacity: 1; }
}

.island-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: none;
  background: #34d399;
  box-shadow: 0 0 8px #34d399;
}
.island.calling .island-dot { display: block; }
.island.calling .island-wave { display: none; }

.island-lens {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-left: auto;
  background: radial-gradient(circle at 35% 35%, #3b6ea5 0%, #101b2a 55%, #06090f 100%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}

/* Home Layer (zooms smoothly when app opens) */
.home-layer {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  will-change: transform, opacity;
  transition: transform 0.36s var(--spring), opacity 0.28s ease;
}
.screen.app-open .home-layer {
  transform: scale(0.93);
  opacity: 0.35;
}

.content {
  flex: 1;
  padding: 12px 20px 6px;
  overflow-y: auto;
  scrollbar-width: none;
}
.content::-webkit-scrollbar { display: none; }

.date {
  font-size: 12.5px;
  font-weight: 500;
  color: rgba(235, 241, 248, 0.72);
  margin-top: 4px;
}

.clock {
  font-family: var(--font-display);
  font-size: 54px;
  font-weight: 280;
  letter-spacing: -2px;
  line-height: 1.04;
  margin: 2px 0 16px;
  font-variant-numeric: tabular-nums;
}

.widget {
  background: rgba(255, 255, 255, 0.075);
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid var(--border);
  box-shadow:
    0 10px 26px rgba(0, 0, 0, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.14);
  border-radius: 22px;
  padding: 13px 16px;
  margin-bottom: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: transform 0.2s var(--spring), background 0.2s;
}
.widget:active { transform: scale(0.97); }

.widget strong {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.widget-meta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.widget-pill {
  background: rgba(255, 255, 255, 0.09);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 15px;
  padding: 7px 12px;
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px 10px;
}

.app {
  border: 0;
  background: none;
  color: var(--text);
  font-family: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.01em;
  cursor: pointer;
  padding: 0;
  transition: transform 0.2s var(--spring);
}
.app:hover .icon { transform: translateY(-2px); }
.app:active { transform: scale(0.86); }

.icon {
  width: 53px;
  height: 53px;
  border-radius: 17px;
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
  box-shadow:
    0 8px 18px rgba(0, 0, 0, 0.28),
    inset 0 1px 0 rgba(255, 255, 255, 0.26),
    inset 0 0 0 1px rgba(255, 255, 255, 0.11);
  transition: transform 0.22s var(--spring);
}

/* Custom App Icon Themes */
.ico-notes     { background: linear-gradient(145deg, #fcd34d, #d97706); color: #1f1605; }
.ico-calc      { background: linear-gradient(145deg, #334155, #0f172a); color: #f8fafc; }
.ico-gallery   { background: linear-gradient(145deg, #38bdf8, #6366f1); }
.ico-browser   { background: linear-gradient(145deg, #22d3ee, #2563eb); }
.ico-weather   { background: linear-gradient(145deg, #60a5fa, #1d4ed8); }
.ico-clock     { background: linear-gradient(145deg, #818cf8, #4338ca); }
.ico-music     { background: linear-gradient(145deg, #fb7185, #be123c); }
.ico-focus     { background: linear-gradient(145deg, #2dd4bf, #0f766e); }
.ico-sketch    { background: linear-gradient(145deg, #c084fc, #7e22ce); }
.ico-tasks     { background: linear-gradient(145deg, #4ade80, #15803d); }
.ico-settings  { background: linear-gradient(145deg, #64748b, #1e293b); }
.ico-about     { background: linear-gradient(145deg, #38bdf8, #0369a1); }
.ico-phone     { background: linear-gradient(145deg, #34d399, #059669); }
.ico-messages  { background: linear-gradient(145deg, #38bdf8, #0284c7); }

.dock {
  margin: 4px 14px 6px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.095);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, 0.13);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
  border-radius: 26px;
  display: flex;
  justify-content: space-around;
}
.dock .icon {
  width: 48px;
  height: 48px;
  border-radius: 15px;
}

.nav {
  height: 20px;
  display: grid;
  place-items: center;
  cursor: pointer;
  z-index: 25;
}
.nav span {
  width: 112px;
  height: 4px;
  background: rgba(255, 255, 255, 0.8);
  border-radius: 8px;
  transition: width 0.2s var(--spring), opacity 0.2s;
}
.nav:active span { width: 88px; opacity: 0.6; }

/* App Panel */
.panel {
  position: absolute;
  inset: 42px 0 20px;
  background: rgba(12, 16, 22, 0.92);
  backdrop-filter: blur(28px) saturate(155%);
  -webkit-backdrop-filter: blur(28px) saturate(155%);
  z-index: 15;
  padding: 10px 18px 12px;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  will-change: transform, opacity;
  transform: translateY(28px) scale(0.94);
  transition: opacity 0.22s ease, transform 0.34s var(--spring);
  user-select: text;
}
.panel.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  flex-shrink: 0;
}
.panel h2 {
  margin: 0;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.icon-btn {
  width: 32px;
  height: 32px;
  border: 1px solid rgba(255, 255, 255, 0.09);
  background: rgba(255, 255, 255, 0.07);
  color: var(--text);
  border-radius: 10px;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: background 0.15s, transform 0.15s var(--spring);
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.14); }
.icon-btn:active { transform: scale(0.9); }

#appBody {
  flex: 1;
  overflow-y: auto;
  padding-right: 2px;
  scrollbar-width: none;
}
#appBody::-webkit-scrollbar { display: none; }

/* Lock Screen */
.lockscreen {
  position: absolute;
  inset: 0;
  background: var(--wallpaper);
  z-index: 28;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 78px 24px 30px;
  will-change: transform, opacity;
  transition: transform 0.44s var(--spring), opacity 0.3s ease;
  cursor: pointer;
}
.lockscreen::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.34) 100%);
  pointer-events: none;
}
.lockscreen.unlocked {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}
.lock-top {
  text-align: center;
  position: relative;
  z-index: 1;
}
.lock-badge {
  width: 34px;
  height: 34px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(12px);
  display: grid;
  place-items: center;
}
.lock-clock {
  font-family: var(--font-display);
  font-size: 76px;
  font-weight: 230;
  letter-spacing: -2.8px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.lock-date {
  font-size: 14px;
  font-weight: 500;
  color: rgba(241, 245, 249, 0.8);
  margin-top: 8px;
}
.lock-cue {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  opacity: 0.72;
  animation: floatCue 2.4s ease-in-out infinite;
}
@keyframes floatCue {
  0%, 100% { transform: translateY(0); opacity: 0.55; }
  50% { transform: translateY(-5px); opacity: 0.9; }
}

/* Control Center */
.control-center {
  position: absolute;
  inset: 0;
  background: rgba(10, 13, 19, 0.84);
  backdrop-filter: blur(30px) saturate(160%);
  -webkit-backdrop-filter: blur(30px) saturate(160%);
  z-index: 27;
  padding: 58px 20px 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  will-change: transform;
  transform: translateY(-100%);
  transition: transform 0.36s var(--spring);
}
.control-center.open { transform: translateY(0); }

.cc-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.cc-tile {
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 15px;
  color: var(--text);
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 11px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: background 0.2s, color 0.2s, transform 0.16s var(--spring);
}
.cc-tile:active { transform: scale(0.95); }
.cc-tile.active {
  background: var(--accent);
  color: #0b0e12;
  border-color: transparent;
  font-weight: 600;
}

.bright-wrap {
  position: relative;
  margin-top: 10px;
  height: 40px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.pill-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 100%;
  margin: 0;
  background: transparent;
  cursor: pointer;
  position: relative;
  z-index: 2;
}
.pill-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 6px;
  height: 24px;
  border-radius: 4px;
  background: #0e131b;
}
.bright-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--accent);
  pointer-events: none;
  border-radius: 14px;
  transition: width 0.05s linear;
}

/* Toast */
.toast {
  position: absolute;
  top: 48px;
  left: 50%;
  transform: translateX(-50%) translateY(-14px) scale(0.96);
  background: rgba(20, 25, 34, 0.94);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 15px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: all 0.24s var(--spring);
  white-space: nowrap;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0) scale(1);
}

/* Shared Components */
.card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  border-radius: 20px;
  padding: 14px;
  margin-bottom: 10px;
}

input[type="text"], input:not([type]), textarea {
  width: 100%;
  background: rgba(15, 19, 26, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.11);
  border-radius: 14px;
  padding: 11px 13px;
  color: var(--text);
  font-family: inherit;
  font-size: 13.5px;
  outline: none;
  transition: border-color 0.2s;
}
input:focus, textarea:focus { border-color: var(--accent); }
textarea { min-height: 92px; resize: vertical; line-height: 1.45; }

.action {
  background: var(--accent);
  color: #0b0e12;
  border: 0;
  border-radius: 13px;
  padding: 10px 15px;
  font-family: inherit;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: transform 0.15s var(--spring), filter 0.15s;
}
.action:active { transform: scale(0.95); }
.action.secondary {
  background: rgba(255, 255, 255, 0.085);
  color: var(--text);
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.action.danger { background: #ef4444; color: #fff; }

.row { display: flex; gap: 8px; align-items: center; }

/* Segmented Tabs */
.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 14px;
  padding: 3px;
  margin-bottom: 12px;
}
.seg button {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 8px;
  border-radius: 11px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.seg button.active {
  background: rgba(255, 255, 255, 0.12);
  color: var(--text);
}

/* Calculator */
.calc-expr {
  font-size: 13px;
  color: var(--muted);
  text-align: right;
  min-height: 18px;
  padding: 0 8px;
  font-variant-numeric: tabular-nums;
}
.calc-display {
  font-family: var(--font-display);
  font-size: 40px;
  font-weight: 300;
  text-align: right;
  padding: 4px 8px 14px;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}
.calc-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
}
.calc-grid button {
  height: 54px;
  border: 0;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.08);
  color: var(--text);
  font-family: inherit;
  font-size: 18px;
  font-weight: 500;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: background 0.12s, transform 0.14s var(--spring);
}
.calc-grid button:active { transform: scale(0.91); background: rgba(255, 255, 255, 0.17); }
.calc-grid button.op { background: rgba(255, 255, 255, 0.13); color: var(--accent); font-weight: 600; }
.calc-grid button.eq { background: var(--accent); color: #0b0e12; font-weight: 700; }

/* Phone */
.dial-num {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 400;
  text-align: center;
  min-height: 38px;
  letter-spacing: 1px;
  margin-bottom: 14px;
  font-variant-numeric: tabular-nums;
}
.dial-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.dial-grid button {
  padding: 13px;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(255, 255, 255, 0.075);
  color: var(--text);
  font-family: inherit;
  font-size: 20px;
  font-weight: 500;
  cursor: pointer;
  transition: transform 0.14s var(--spring), background 0.12s;
}
.dial-grid button:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.16); }

/* Messages */
.chat-box {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 350px;
  overflow-y: auto;
  margin-bottom: 10px;
}
.bubble {
  max-width: 82%;
  padding: 10px 13px;
  border-radius: 17px;
  font-size: 13px;
  line-height: 1.42;
}
.bubble.me {
  align-self: flex-end;
  background: var(--accent);
  color: #0b0e12;
  font-weight: 500;
  border-bottom-right-radius: 4px;
}
.bubble.them {
  align-self: flex-start;
  background: rgba(255, 255, 255, 0.1);
  border-bottom-left-radius: 4px;
}

/* Gallery */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.photo-tile {
  height: 118px;
  border-radius: 16px;
  padding: 11px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid rgba(255, 255, 255, 0.15);
  position: relative;
  overflow: hidden;
  transition: transform 0.18s var(--spring);
}
.photo-tile:active { transform: scale(0.95); }

/* Weather */
.chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.chip {
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.06);
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s;
}
.chip.active {
  background: var(--accent);
  color: #0b0e12;
  border-color: transparent;
  font-weight: 600;
}
.hourly-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  text-align: center;
}
.hourly-item {
  background: rgba(255, 255, 255, 0.045);
  border-radius: 14px;
  padding: 10px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}

/* Tasks */
.task-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 13px;
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.07);
  margin-bottom: 8px;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.15s var(--spring);
}
.task-item:active { transform: scale(0.98); }
.task-check {
  width: 20px;
  height: 20px;
  border-radius: 7px;
  border: 1.8px solid rgba(255, 255, 255, 0.32);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.task-item.done .task-check {
  background: var(--accent);
  border-color: var(--accent);
  color: #0b0e12;
}
.task-item.done .task-label {
  text-decoration: line-through;
  color: var(--muted);
}

/* Focus Breathing Halo */
.breath-stage {
  display: grid;
  place-items: center;
  height: 230px;
  position: relative;
}
.breath-ring {
  width: 126px;
  height: 126px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.12), transparent 72%);
  border: 2px solid var(--accent);
  box-shadow: 0 0 36px rgba(183, 243, 107, 0.18);
  display: grid;
  place-items: center;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.02em;
  transition: transform 4s ease-in-out, box-shadow 4s ease-in-out;
}
.breath-ring.inhale { transform: scale(1.42); }
.breath-ring.hold   { transform: scale(1.42); }
.breath-ring.exhale { transform: scale(0.92); }

/* Sketch Canvas */
.sketch-canvas {
  width: 100%;
  height: 310px;
  background: #0b0e14;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  touch-action: none;
  display: block;
  cursor: crosshair;
}

/* Music Player */
.track-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid rgba(255, 255, 255, 0.06);
  margin-bottom: 8px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
.track-row.active {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--accent);
}

/* Swatches */
.swatches { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.swatch {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.25);
  cursor: pointer;
  transition: transform 0.15s var(--spring);
}
.swatch:active { transform: scale(0.88); }
</style>
</head>

<body>
<div class="phone-wrap">
  <div class="vol-btn vol-up"></div>
  <div class="vol-btn vol-down"></div>
  <button class="power-btn" title="Lock / Wake" onclick="toggleLock()"></button>

  <div class="phone">
    <main class="screen" id="screen">

      <div class="island" id="island" onclick="handleIslandTap()">
        <span class="island-dot"></span>
        <span class="island-wave"><span></span><span></span><span></span></span>
        <span class="island-lens"></span>
      </div>
      <div class="toast" id="toast"></div>

      <!-- Status Bar -->
      <div class="status" onclick="toggleControlCenter()">
        <span id="statusTime">09:41</span>
        <span class="status-icons">
          <span id="wifiIcon" style="display:inline-flex;"></span>
          <span id="signalIcon" style="display:inline-flex;"></span>
          <span id="battIcon" style="display:inline-flex;"></span>
        </span>
      </div>

      <!-- Lock Screen -->
      <div class="lockscreen" id="lockscreen" onclick="unlockPhone()">
        <div class="lock-top">
          <div class="lock-badge" id="lockGlyph"></div>
          <div class="lock-clock" id="lockClock">09:41</div>
          <div class="lock-date" id="lockDate">Fri, Nov 20</div>
        </div>
        <div class="lock-cue" id="lockCue"></div>
      </div>

      <!-- Control Center -->
      <div class="control-center" id="controlCenter">
        <div class="panel-head" style="margin-bottom: 2px;">
          <h2>Control</h2>
          <button class="icon-btn" onclick="toggleControlCenter()" id="ccCloseBtn"></button>
        </div>

        <div class="cc-grid">
          <button class="cc-tile active" id="ccWifi" onclick="toggleCC(this, 'Wi-Fi')"></button>
          <button class="cc-tile active" id="ccBt" onclick="toggleCC(this, 'Bluetooth')"></button>
          <button class="cc-tile" id="ccPlane" onclick="toggleCC(this, 'Airplane')"></button>
          <button class="cc-tile" id="ccMute" onclick="toggleSound(this)"></button>
        </div>

        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px;">
            <span style="display:inline-flex; align-items:center; gap:7px; font-weight:600;" id="brightLabel"></span>
            <span id="brightVal" style="color:var(--muted); font-variant-numeric:tabular-nums;">100%</span>
          </div>
          <div class="bright-wrap">
            <div class="bright-fill" id="brightFill" style="width: 78%;"></div>
            <input type="range" min="45" max="115" value="100" id="brightRange" class="pill-slider"
              oninput="setBrightness(this.value)">
          </div>
        </div>

        <button class="action secondary" style="width:100%;" id="ccLockBtn" onclick="toggleControlCenter(); lockPhone();"></button>
      </div>

      <!-- Home Layer -->
      <div class="home-layer">
        <section class="content">
          <div class="date" id="date"></div>
          <div class="clock" id="clock">09:41</div>

          <div class="widget" onclick="openApp('weather')">
            <div>
              <strong id="greeting">Evening</strong>
              <div class="widget-meta" id="widgetSub">Berlin · Clear</div>
            </div>
            <div class="widget-pill">
              <span id="widgetWeatherIcon" style="display:inline-flex;"></span>
              <span id="widgetTemp">18°</span>
            </div>
          </div>

          <div class="grid" id="homeGrid"></div>
        </section>

        <div class="dock" id="dockGrid"></div>
      </div>

      <div class="nav" onclick="goHome()"><span></span></div>

      <!-- App Window -->
      <section class="panel" id="panel">
        <div class="panel-head">
          <h2 id="appTitle">App</h2>
          <button class="icon-btn" id="panelCloseBtn" onclick="closeApp()"></button>
        </div>
        <div id="appBody"></div>
      </section>

    </main>
  </div>
</div>

function updateClock() {
  const d = new Date();
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const dateStr = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  const hr = d.getHours();

  let greet = 'Evening';
  if (hr < 5) greet = 'Night';
  else if (hr < 12) greet = 'Morning';
  else if (hr < 18) greet = 'Afternoon';

  document.getElementById('clock').textContent = time;
  document.getElementById('statusTime').textContent = time;
  document.getElementById('lockClock').textContent = time;
  document.getElementById('date').textContent = dateStr;
  document.getElementById('lockDate').textContent = dateStr;
  document.getElementById('greeting').textContent = greet;
}

/* --- Feedback & Audio --- */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

let audioCtx = null;
function getAudio() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq = 520, duration = 0.045) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.04, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch {}
}

/* --- 3. Calculator --- */
let calcExpr = '', calcPrev = '';

function renderCalculator(body) {
  const keys = ['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','⌫','0','.','='];
  body.innerHTML = `
    <div class="card">
      <div class="calc-expr" id="calcPrev">${calcPrev}</div>
      <div class="calc-display" id="calcDisplay">${calcExpr || '0'}</div>
      <div class="calc-grid">
        ${keys.map(k => {
          const isOp = ['÷','×','−','+','C','(',')'].includes(k);
          const cls = k === '=' ? 'eq' : (isOp ? 'op' : '');
          return `<button class="${cls}" onclick="calcPress('${k}')">${k === '⌫' ? SVG.backspace : k}</button>`;
        }).join('')}
      </div>
    </div>
  `;
}

function calcPress(val) {
  playTone(620, 0.03);
  const disp = document.getElementById('calcDisplay');
  const prev = document.getElementById('calcPrev');
  if (!disp) return;

  if (val === 'C') { calcExpr = ''; calcPrev = ''; prev.textContent = ''; disp.textContent = '0'; return; }
  if (val === '⌫') { calcExpr = calcExpr.slice(0, -1); disp.textContent = calcExpr || '0'; return; }
  if (val === '=') {
    if (!calcExpr) return;
    try {
      const safe = calcExpr.replaceAll('÷','/').replaceAll('×','*').replaceAll('−','-');
      if (!/^[0-9+\-*/.() ]+$/.test(safe)) throw 0;
      const res = Function('"use strict"; return (' + safe + ')')();
      if (!Number.isFinite(res)) throw 0;
      calcPrev = calcExpr;
      calcExpr = String(Number(res.toFixed(8)));
      prev.textContent = calcPrev;
      disp.textContent = calcExpr;
    } catch {
      calcExpr = ''; prev.textContent = ''; disp.textContent = 'Error';
    }
    return;
  }
  const ops = ['÷','×','−','+'];
  if (ops.includes(val) && ops.includes(calcExpr.slice(-1))) calcExpr = calcExpr.slice(0, -1) + val;
  else calcExpr += val;
  disp.textContent = calcExpr;
}

/* --- 4. Clock App (Stopwatch + Circular Timer) --- */
let clockTab = 'stopwatch';
let swMs = 0, swInt = null, swLaps = [];
let tmTotal = 300, tmLeft = 300, tmInt = null;

function renderClockApp(body) {
  body.innerHTML = `
    <div class="seg">
      <button class="${clockTab === 'stopwatch' ? 'active' : ''}" onclick="clockTab='stopwatch'; renderClockApp(document.getElementById('appBody'))">Stopwatch</button>
      <button class="${clockTab === 'timer' ? 'active' : ''}" onclick="clockTab='timer'; renderClockApp(document.getElementById('appBody'))">Timer</button>
    </div>
    <div id="clockView"></div>
  `;
  const view = document.getElementById('clockView');
  if (clockTab === 'stopwatch') renderStopwatch(view);
  else renderCountdown(view);
}

const fmtSw = ms => {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const d = Math.floor((ms % 1000) / 100);
  return `${String(m).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}.${d}`;
};

function renderStopwatch(view) {
  view.innerHTML = `
    <div class="card" style="text-align:center; padding:26px 16px;">
      <div id="swDisp" style="font-family:var(--font-display); font-size:48px; font-weight:280; font-variant-numeric:tabular-nums; margin-bottom:18px;">${fmtSw(swMs)}</div>
      <div class="row" style="justify-content:center;">
        <button class="action" onclick="toggleSw()">${swInt ? 'Pause' : 'Start'}</button>
        <button class="action secondary" onclick="lapSw()">Lap</button>
        <button class="action secondary" onclick="resetSw()">Reset</button>
      </div>
    </div>
    <div id="lapsBox">
      ${swLaps.map((l, i) => `
        <div class="card" style="display:flex; justify-content:space-between; padding:10px 14px; font-size:13px; font-variant-numeric:tabular-nums;">
          <span style="color:var(--muted);">Lap ${swLaps.length - i}</span><strong>${l}</strong>
        </div>
      `).join('')}
    </div>
  `;
}

function toggleSw() {
  if (swInt) { clearInterval(swInt); swInt = null; }
  else {
    const start = Date.now() - swMs;
    swInt = setInterval(() => {
      swMs = Date.now() - start;
      const d = document.getElementById('swDisp');
      if (d) d.textContent = fmtSw(swMs);
    }, 100);
  }
  if (activeApp === 'clock' && clockTab === 'stopwatch') renderStopwatch(document.getElementById('clockView'));
}
function lapSw() {
  if (!swMs) return;
  swLaps.unshift(fmtSw(swMs));
  renderStopwatch(document.getElementById('clockView'));
}
function resetSw() {
  clearInterval(swInt); swInt = null; swMs = 0; swLaps = [];
  renderStopwatch(document.getElementById('clockView'));
}

function renderCountdown(view) {
  const r = 64, c = 2 * Math.PI * r;
  const off = c * (1 - tmLeft / Math.max(1, tmTotal));
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;

  view.innerHTML = `
    <div class="card" style="text-align:center; padding:20px 16px;">
      <div style="position:relative; width:152px; height:152px; margin:0 auto 14px; display:grid; place-items:center;">
        <svg width="152" height="152" style="transform:rotate(-90deg); position:absolute;">
          <circle cx="76" cy="76" r="${r}" stroke="rgba(255,255,255,0.08)" stroke-width="6" fill="none"/>
          <circle id="tmRing" cx="76" cy="76" r="${r}" stroke="var(--accent)" stroke-width="6" fill="none"
            stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 0.35s linear;"/>
        </svg>
        <div id="tmDisp" style="font-family:var(--font-display); font-size:34px; font-weight:300; font-variant-numeric:tabular-nums;">${fmt(tmLeft)}</div>
      </div>
      <div class="chips" style="justify-content:center; margin-bottom:14px;">
        ${[60, 180, 300, 600].map(sec => `
          <button class="chip ${tmTotal === sec ? 'active' : ''}" onclick="setTimerPreset(${sec})">${sec/60}m</button>
        `).join('')}
      </div>
      <div class="row" style="justify-content:center;">
        <button class="action" onclick="toggleTimer()">${tmInt ? 'Pause' : 'Start'}</button>
        <button class="action secondary" onclick="setTimerPreset(${tmTotal})">Reset</button>
      </div>
    </div>
  `;
}

function setTimerPreset(sec) {
  clearInterval(tmInt); tmInt = null;
  tmTotal = sec; tmLeft = sec;
  renderCountdown(document.getElementById('clockView'));
}

function toggleTimer() {
  if (tmInt) { clearInterval(tmInt); tmInt = null; }
  else {
    if (tmLeft <= 0) tmLeft = tmTotal;
    tmInt = setInterval(() => {
      tmLeft--;
      const d = document.getElementById('tmDisp');
      const ring = document.getElementById('tmRing');
      if (d) d.textContent = `${String(Math.floor(tmLeft/60)).padStart(2,'0')}:${String(tmLeft%60).padStart(2,'0')}`;
      if (ring) {
        const c = 2 * Math.PI * 64;
        ring.style.strokeDashoffset = c * (1 - tmLeft / tmTotal);
      }
      if (tmLeft <= 0) {
        clearInterval(tmInt); tmInt = null;
        playTone(880, 0.25);
        showToast('Timer complete');
        if (activeApp === 'clock' && clockTab === 'timer') renderCountdown(document.getElementById('clockView'));
      }
    }, 1000);
  }
  if (activeApp === 'clock' && clockTab === 'timer') renderCountdown(document.getElementById('clockView'));
}

    </div>
    <div class="card">
      <div class="hourly-grid">
        ${['Now','+1h','+2h','+3h'].map((lbl, i) => `
          <div class="hourly-item">
            <span style="color:var(--muted)">${lbl}</span>
            ${getIco(c.ico, 20)}

    <div class="card" style="font-size:13px;">

      <div style="display:flex; justify-content:space-between; padding:4px 0;"><span style="color:var(--muted)">Wind</span><strong>${c.wind}</strong></div>
      <div style="display:flex; justify-content:space-between; padding:4px 0;"><span style="color:var(--muted)">UV</span><strong>${c.uv}</strong></div>

}

/* --- 6. Music (Procedural Web Audio Ambient Player) --- */
const TRACKS = [
  { name: 'Stillness',  sub: 'Warm Pad · Fmaj7',  freqs: [174.61, 220.00, 261.63, 329.63] },
  { name: 'Night Rain', sub: 'Soft Filter · Drift', freqs: [130.81, 196.00, 246.94, 293.66] },
  { name: 'Deep Focus', sub: 'Fifth Drone · C',    freqs: [130.81, 196.00, 261.63] }
];
let musicState = { idx: 0, playing: false, nodes: [], master: null };

function toggleMusicPlay(forceIdx = null) {
  if (forceIdx !== null && forceIdx !== musicState.idx) {
    stopMusicEngine();
    musicState.idx = forceIdx;
    musicState.playing = false;
  }

  if (musicState.playing) {
    stopMusicEngine();
    musicState.playing = false;
  } else {
    startMusicEngine(TRACKS[musicState.idx].freqs);
    musicState.playing = true;
  }

  const isl = document.getElementById('island');
  isl.classList.toggle('playing', musicState.playing);
  isl.classList.toggle('expanded', musicState.playing || inCall);

  if (activeApp === 'music') renderMusic(document.getElementById('appBody'));
}

function startMusicEngine(freqs) {
  try {
    const ctx = getAudio();
    const master = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 620;
    master.gain.setValueAtTime(0.0001, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 1.2);
    filter.connect(master);
    master.connect(ctx.destination);

    const oscs = freqs.map((f, i) => {
      const o = ctx.createOscillator();
      o.type = i % 2 === 0 ? 'sine' : 'triangle';
      o.frequency.value = f;
      o.detune.value = (i - 1) * 4;
      o.connect(filter);
      o.start();
      return o;
    });

    musicState.master = master;
    musicState.nodes = oscs;
  } catch {}
}

function stopMusicEngine() {
  try {
    const ctx = getAudio();
    if (musicState.master) {
      musicState.master.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    }
    const oldNodes = musicState.nodes;
    setTimeout(() => oldNodes.forEach(o => { try { o.stop(); } catch {} }), 380);
  } catch {}
  musicState.nodes = [];
}

function renderMusic(body) {
  const tr = TRACKS[musicState.idx];
  body.innerHTML = `
    <div class="card" style="text-align:center; padding:24px 16px;">
      <div class="icon ico-music" style="margin:0 auto 14px; width:64px; height:64px; border-radius:20px;">
        ${SVG.appMusic}
      </div>
      <div style="font-size:18px; font-weight:600;">${tr.name}</div>
      <div style="font-size:12px; color:var(--muted); margin:4px 0 18px;">${tr.sub}</div>
      <button class="action" style="width:52px; height:52px; border-radius:50%; padding:0;" onclick="toggleMusicPlay()">
        ${musicState.playing ? SVG.pause : SVG.play}
      </button>
    </div>
    ${TRACKS.map((t, i) => `
      <div class="track-row ${musicState.idx === i ? 'active' : ''}" onclick="toggleMusicPlay(${i})">
        <div>
          <div style="font-size:13.5px; font-weight:600;">${t.name}</div>
          <div style="font-size:11.5px; color:var(--muted);">${t.sub}</div>
        </div>
        <span style="color:var(--accent);">${musicState.idx === i && musicState.playing ? SVG.volumeOn : SVG.play}</span>
      </div>
    `).join('')}
  `;
}

/* --- 7. Focus (Breathing Halo) --- */
let breathTimer = null, breathActive = false;

function renderFocus(body) {
  body.innerHTML = `
    <div class="card" style="text-align:center; padding:18px;">
      <div class="breath-stage">
        <div class="breath-ring" id="breathRing">Ready</div>
      </div>
      <button class="action" onclick="toggleBreathing()">${breathActive ? 'Stop' : 'Begin'}</button>
    </div>
  `;
}

function toggleBreathing() {
  if (breathActive) {
    stopBreathing();
    renderFocus(document.getElementById('appBody'));
    return;
  }
  breathActive = true;
  renderFocus(document.getElementById('appBody'));

  const cycle = () => {
    const ring = document.getElementById('breathRing');
    if (!ring || !breathActive) return;
    ring.textContent = 'Inhale';
    ring.className = 'breath-ring inhale';
    breathTimer = setTimeout(() => {
      if (!breathActive) return;
      ring.textContent = 'Hold';
      ring.className = 'breath-ring hold';
      breathTimer = setTimeout(() => {
        if (!breathActive) return;
        ring.textContent = 'Exhale';
        ring.className = 'breath-ring exhale';
        breathTimer = setTimeout(cycle, 4000);
      }, 2000);
    }, 4000);
  };
  setTimeout(cycle, 60);
}

function stopBreathing() {
  breathActive = false;
  clearTimeout(breathTimer);
}

/* --- 8. Sketch (Drawing Canvas + Save to Gallery) --- */
let sketchColor = '#f5f7fa';

function renderSketch(body) {
  const colors = ['#f5f7fa', '#b7f36b', '#38bdf8', '#fb7185'];
  body.innerHTML = `
    <div class="card" style="padding:10px;">
      <canvas id="sketchCanvas" class="sketch-canvas"></canvas>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
        <div class="row">
          ${colors.map(c => `
            <button class="swatch" style="width:24px; height:24px; background:${c}; border-color:${sketchColor===c ? '#fff' : 'rgba(255,255,255,0.2)'}" onclick="sketchColor='${c}'; renderSketchColorRing(this)"></button>
          `).join('')}
        </div>
        <div class="row">
          <button class="action secondary" style="padding:7px 11px; font-size:12px;" onclick="clearSketch()">Clear</button>
          <button class="action" style="padding:7px 11px; font-size:12px;" onclick="saveSketch()">${SVG.save}<span>Save</span></button>
        </div>
      </div>
    </div>
  `;

  const canvas = document.getElementById('sketchCanvas');
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(300, rect.width) * dpr;
  canvas.height = 310 * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;

  let drawing = false;
  const pos = e => {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };

  canvas.onpointerdown = e => {
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    const p = pos(e);
    ctx.strokeStyle = sketchColor;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  };
  canvas.onpointermove = e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  };
  canvas.onpointerup = () => { drawing = false; };
}

function renderSketchColorRing(btn) {
  btn.parentElement.querySelectorAll('.swatch').forEach(s => s.style.borderColor = 'rgba(255,255,255,0.2)');
  btn.style.borderColor = '#fff';
}

function clearSketch() {
  const c = document.getElementById('sketchCanvas');
  if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
}

function saveSketch() {
  const c = document.getElementById('sketchCanvas');
  if (!c) return;
  const list = JSON.parse(localStorage.getItem('skyos-sketches') || '[]');
  list.unshift({ id: Date.now(), img: c.toDataURL('image/png') });
  localStorage.setItem('skyos-sketches', JSON.stringify(list.slice(0, 8)));
  showToast('Saved to Gallery');
}

/* --- 9. Gallery --- */
function renderGallery(body) {
  const sketches = JSON.parse(localStorage.getItem('skyos-sketches') || '[]');
  body.innerHTML = `
    <div class="gallery-grid">
      ${WALLPAPERS.map((w, i) => `
        <div class="photo-tile" style="background:${w.bg}" onclick="applyWallpaper(${i}); renderGallery(document.getElementById('appBody'));">
          <span>${w.name}</span>
          <span>${currentWallIdx === i ? SVG.check : ''}</span>
        </div>
      `).join('')}
      ${sketches.map(s => `
        <div class="photo-tile" style="background:#0b0e14 url(${s.img}) center/cover no-repeat;">
          <span style="color:var(--muted);">Sketch</span>
          <button class="icon-btn" style="width:26px; height:26px;" onclick="deleteSketch(${s.id})">${SVG.trash}</button>
        </div>
      `).join('')}
    </div>
  `;
}

function deleteSketch(id) {
  const next = JSON.parse(localStorage.getItem('skyos-sketches') || '[]').filter(s => s.id !== id);
  localStorage.setItem('skyos-sketches', JSON.stringify(next));
  renderGallery(document.getElementById('appBody'));
}

function applyWallpaper(index) {
  currentWallIdx = index;
  localStorage.setItem('skyos-wallpaper', index);
  document.documentElement.style.setProperty('--wallpaper', WALLPAPERS[index].bg);
  showToast(WALLPAPERS[index].name);
}

/* --- 10. Browser --- */
function renderBrowser(body) {
  body.innerHTML = `
    <div class="card">
      <div class="row">
        <input id="webAddress" placeholder="example.com">
        <button class="action" onclick="loadWeb(true)">Go</button>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="action secondary" style="padding:6px 11px; font-size:12px;" onclick="quickSite('https://en.m.wikipedia.org')">Wiki</button>
        <button class="action secondary" style="padding:6px 11px; font-size:12px;" onclick="quickSite('https://example.com')">Example</button>
        <button class="action secondary" style="padding:6px 11px; font-size:12px;" onclick="loadWeb(false)">${SVG.external}</button>
      </div>
    </div>
    <div class="card" style="padding:0; overflow:hidden; height:360px;">
      <iframe id="webFrame" title="Browser" style="border:0; width:100%; height:100%; background:#fff;" src="https://example.com"></iframe>
    </div>
  `;
}

function quickSite(url) {
  document.getElementById('webAddress').value = url;
  document.getElementById('webFrame').src = url;
}

function loadWeb(inFrame) {
  let url = document.getElementById('webAddress').value.trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  if (inFrame) document.getElementById('webFrame').src = url;
  else window.open(url, '_blank', 'noopener');
}

/* --- 11. Phone --- */
let dialDigits = '', inCall = false, callMuted = false;
const DTMF = { '1':697,'2':730,'3':770,'4':800,'5':852,'6':890,'7':941,'8':980,'9':1020,'*':580,'0':640,'#':710 };

function renderPhone(body) {
  endCallState();
  const keys = ['1','2','3','4','5','6','7','8','9','*','0','#'];
  body.innerHTML = `
    <div class="card">
      <div class="dial-num" id="dialNum">${dialDigits || '—'}</div>
      <div class="dial-grid">
        ${keys.map(k => `<button onclick="dialPress('${k}')">${k}</button>`).join('')}
      </div>
      <div class="row" style="margin-top:14px;">
        <button class="action" style="flex:1;" onclick="startCall()">${SVG.phoneCall}<span>Call</span></button>
        <button class="action secondary" style="padding:10px 14px;" onclick="dialBack()">${SVG.backspace}</button>
      </div>
    </div>
  `;
}

function dialPress(k) {
  playTone(DTMF[k] || 600, 0.07);
  if (dialDigits.length < 14) dialDigits += k;
  document.getElementById('dialNum').textContent = dialDigits;
}

function dialBack() {
  dialDigits = dialDigits.slice(0, -1);
  document.getElementById('dialNum').textContent = dialDigits || '—';
}

function startCall() {
  if (!dialDigits) return;
  inCall = true; callMuted = false;
  const isl = document.getElementById('island');
  isl.classList.add('calling', 'expanded');
  renderCallScreen();
}

function renderCallScreen() {
  document.getElementById('appBody').innerHTML = `
    <div class="card" style="text-align:center; padding:38px 16px;">
      <div style="width:72px; height:72px; margin:0 auto 14px; border-radius:50%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14); display:grid; place-items:center;">
        ${SVG.user}
      </div>
      <div style="font-size:21px; font-weight:600; margin-bottom:4px;">${dialDigits}</div>
      <div style="color:var(--accent); font-size:12.5px; margin-bottom:28px;">Calling</div>
      <div class="row" style="justify-content:center;">
        <button class="action secondary" onclick="callMuted=!callMuted; renderCallScreen();" style="${callMuted ? 'background:var(--accent); color:#0b0e12;' : ''}">${SVG.micOff}</button>
        <button class="action danger" onclick="renderPhone(document.getElementById('appBody'))">End</button>
      </div>
    </div>
  `;
}

function endCallState() {
  inCall = false;
  const isl = document.getElementById('island');
  isl.classList.remove('calling');
  isl.classList.toggle('expanded', musicState.playing);
}

/* --- 12. Messages --- */
function getMessages() {
  try {
    return JSON.parse(localStorage.getItem('skyos-msgs')) || [
      { from: 'them', text: 'SkyOS is ready.' }
    ];
  } catch { return []; }
}

function renderMessages(body) {
  const msgs = getMessages();
  body.innerHTML = `
    <div class="card">
      <div style="font-size:12px; font-weight:600; color:var(--muted); margin-bottom:10px;">Sky</div>
      <div class="chat-box" id="chatBox"></div>
      <div class="row">
        <input id="chatInput" placeholder="Message..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button class="action" onclick="sendMsg()" aria-label="Send">${SVG.send}</button>
      </div>
    </div>
  `;

  const box = document.getElementById('chatBox');
  msgs.forEach(m => {
    const b = document.createElement('div');
    b.className = `bubble ${m.from}`;
    b.textContent = m.text;
    box.appendChild(b);
  });
  box.scrollTop = box.scrollHeight;
}

function sendMsg() {
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim();
  if (!text) return;

  const msgs = getMessages();
  msgs.push({ from: 'me', text });
  const replies = ['Noted.', 'Sounds good.', 'Done.', 'Got it.'];
  const reply = text.toLowerCase().includes('time')
    ? new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : replies[msgs.length % replies.length];
  msgs.push({ from: 'them', text: reply });
  localStorage.setItem('skyos-msgs', JSON.stringify(msgs));
  renderMessages(document.getElementById('appBody'));
}

/* --- 13. Settings & About --- */
function renderSettings(body) {
  const currentAccent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const colors = ['#b7f36b', '#6bc5f3', '#f39c6b', '#d18aff', '#ff6b8b', '#ffd86b'];

  body.innerHTML = `
    <div class="card">
      <strong style="font-size:13.5px;">Accent</strong>
      <div class="swatches">
        ${colors.map(c => `<button class="swatch" style="background:${c}" onclick="setAccent('${c}')"></button>`).join('')}
        <input type="color" value="${currentAccent}" onchange="setAccent(this.value)" style="width:34px; height:34px; border:0; background:none; padding:0; cursor:pointer;">
      </div>
    </div>

    <div class="card">
      <strong style="font-size:13.5px;">Wallpaper</strong>
      <div class="swatches">
        ${WALLPAPERS.map((w, i) => `<button class="swatch" title="${w.name}" style="background:${w.bg}" onclick="applyWallpaper(${i})"></button>`).join('')}
      </div>
    </div>

    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <strong style="font-size:13.5px;">Reset</strong>
      <button class="action danger" style="padding:8px 13px; font-size:12px;" onclick="localStorage.clear(); location.reload();">Reset</button>
    </div>
  `;
}

function setAccent(color) {
  document.documentElement.style.setProperty('--accent', color);
  localStorage.setItem('skyos-accent', color);
  showToast('Accent updated');
}

function renderAbout(body) {
  body.innerHTML = `
    <div class="card" style="text-align:center; padding:26px 16px;">
      <div class="icon ico-about" style="margin:0 auto 12px; width:60px; height:60px; border-radius:20px;">
        ${SVG.appAbout}
      </div>
      <div style="font-size:19px; font-weight:600;">SkyOS 2.0</div>
      <div style="font-size:12px; color:var(--muted); margin-top:2px;">Minimal Web OS</div>
    </div>
    <div class="card" style="font-size:13px;">
      <div style="display:flex; justify-content:space-between; padding:6px 0;"><span style="color:var(--muted)">Font</span><span>Google Sans</span></div>
      <div style="display:flex; justify-content:space-between; padding:6px 0;"><span style="color:var(--muted)">Display</span><span>${window.innerWidth} × ${window.innerHeight}</span></div>
      <div style="display:flex; justify-content:space-between; padding:6px 0;"><span style="color:var(--muted)">Apps</span><span>${HOME_APPS.length + 2}</span></div>
    </div>
  `;
}

document.addEventListener('keydown', e => {
  if (activeApp !== 'calculator') return;
  const map = { '/':'÷', '*':'×', '-':'−', '+':'+', 'Enter':'=', 'Backspace':'⌫', 'Escape':'C' };
  if (/^[0-9.()]$/.test(e.key)) calcPress(e.key);
  else if (map[e.key]) { e.preventDefault(); calcPress(map[e.key]); }
});

initSkyOS();
</script>
