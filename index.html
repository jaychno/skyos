<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SkyOS 26</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,200..800&family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --accent: #7dd3fc;
  --text: #f8fafc;
  --muted: rgba(241, 245, 249, 0.62);
  --spring: cubic-bezier(0.32, 0.72, 0, 1);
  --brightness: 1;
  --glass-blur: 26px;
  --glass-a1: 0.22;
  --glass-a2: 0.06;
  --font-ui: "Google Sans", "Google Sans Flex", system-ui, -apple-system, sans-serif;
  --font-display: "Google Sans Flex", "Google Sans", system-ui, -apple-system, sans-serif;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
  background: radial-gradient(circle at 50% 0%, #151b26 0%, #05070b 72%);
  font-family: var(--font-ui);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after {
  transition-duration: 0.01ms !important;
  animation-duration: 0.01ms !important;
}

/* Hardware Frame */
.phone-wrap { position: relative; }

.side-btn {
  position: absolute;
  background: linear-gradient(180deg, #5f6775, #2b303a);
  pointer-events: none;
}
.vol-up { left: -4px; top: 148px; width: 3px; height: 42px; border-radius: 3px 0 0 3px; }
.vol-dn { left: -4px; top: 200px; width: 3px; height: 42px; border-radius: 3px 0 0 3px; }

.pwr-btn {
  position: absolute;
  right: -5px;
  top: 172px;
  width: 4px;
  height: 68px;
  border-radius: 0 4px 4px 0;
  border: 0;
  background: linear-gradient(180deg, #677080, #303642);
  cursor: pointer;
}

.phone {
  width: min(390px, 95vw);
  height: min(828px, 93vh);
  min-height: 630px;
  border-radius: 52px;
  padding: 7px;
  background: #0a0c10;
  border: 2.5px solid #424956;
  box-shadow:
    0 40px 100px rgba(0, 0, 0, 0.82),
    0 0 0 1px rgba(255, 255, 255, 0.14),
    inset 0 0 0 2px #020305;
  overflow: hidden;
}

.screen {
  height: 100%;
  border-radius: 44px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: #0b1220;
  filter: brightness(var(--brightness));
  user-select: none;
  contain: layout style paint;
}

@media (max-width: 480px) {
  body { padding: 0; background: #070a10; }
  .phone-wrap { width: 100%; height: 100dvh; }
  .side-btn, .pwr-btn { display: none; }
  .phone { width: 100%; height: 100dvh; min-height: 0; border: 0; border-radius: 0; padding: 0; box-shadow: none; }
  .screen { border-radius: 0; }
}

.wallpaper-layer {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.wallpaper-layer svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* iOS 26 Liquid Glass Material */
.lg {
  position: relative;
  background: linear-gradient(145deg, rgba(255, 255, 255, var(--glass-a1)) 0%, rgba(255, 255, 255, var(--glass-a2)) 52%, rgba(255, 255, 255, 0.14) 100%);
  backdrop-filter: blur(var(--glass-blur)) saturate(195%) brightness(1.06);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(195%) brightness(1.06);
  box-shadow:
    0 12px 32px rgba(0, 0, 0, 0.22),
    inset 0 1px 0 rgba(255, 255, 255, 0.44),
    inset 0 -1px 0 rgba(255, 255, 255, 0.1);
}
.lg::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.72) 0%,
    rgba(255, 255, 255, 0.1) 36%,
    rgba(255, 255, 255, 0.04) 64%,
    rgba(255, 255, 255, 0.4) 100%
  );
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.lg-dark {
  background: linear-gradient(145deg, rgba(22, 28, 40, 0.62) 0%, rgba(10, 14, 22, 0.48) 55%, rgba(26, 32, 46, 0.52) 100%);
}

/* Status Bar & Dynamic Island */
.status {
  position: relative;
  z-index: 35;
  height: 44px;
  padding: 14px 26px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}

.island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 98px;
  height: 26px;
  background: #030406;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 9px;
  z-index: 36;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.55), inset 0 0 0 0.5px rgba(255, 255, 255, 0.12);
  transition: width 0.34s var(--spring);
}
.island.expanded { width: 152px; }

.island-wave {
  display: none;
  align-items: center;
  gap: 2px;
  height: 12px;
}
.island.playing .island-wave { display: flex; }
.island-wave span {
  width: 2px;
  height: 4px;
  border-radius: 2px;
  background: var(--accent);
  animation: eq 0.85s ease-in-out infinite alternate;
}
.island-wave span:nth-child(2) { animation-delay: 0.2s; }
.island-wave span:nth-child(3) { animation-delay: 0.45s; }
@keyframes eq {
  from { height: 3px; opacity: 0.6; }
  to { height: 11px; opacity: 1; }
}

.island-dot {
  display: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #34d399;
  box-shadow: 0 0 8px #34d399;
}
.island.calling .island-dot { display: block; }
.island.calling .island-wave { display: none; }

.island-timer {
  display: none;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.island.timer-on .island-timer { display: block; }
.island.calling .island-timer { display: none; }

.island-lens {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-left: auto;
  background: radial-gradient(circle at 35% 35%, #3b82f6 0%, #0f172a 55%, #030712 100%);
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}
.low-power #battIco { color: #fbbf24; }

/* Home Layer & 2-Page Swipeable Grid */
.home-layer {
  position: relative;
  z-index: 5;
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  transform: scale(1.06);
  pointer-events: none;
  will-change: transform, opacity;
  transition: transform 0.42s var(--spring), opacity 0.28s ease;
}
.screen.unlocked .home-layer {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}
.screen.unlocked.app-open .home-layer,
.screen.unlocked.recents-open .home-layer {
  transform: scale(0.92);
  opacity: 0;
  pointer-events: none;
}

.pages {
  flex: 1;
  display: flex;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
}
.pages::-webkit-scrollbar { display: none; }

.page {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  scroll-snap-align: start;
  padding: 14px 18px 6px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
  scrollbar-width: none;
}
.page::-webkit-scrollbar { display: none; }

.widgets-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.hide-widgets .widgets-row { display: none; }

.widget-sq {
  border-radius: 24px;
  padding: 14px;
  height: 122px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  transition: transform 0.2s var(--spring);
}
.widget-sq:active { transform: scale(0.96); }

.w-temp {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 300;
  letter-spacing: -1.5px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.w-city {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.w-sub {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.74);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px 10px;
}

.app {
  border: 0;
  background: none;
  color: var(--text);
  font-family: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  padding: 0;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
  transition: transform 0.18s var(--spring);
}
.app:active { transform: scale(0.86); }
.app:hover .icon { transform: translateY(-2px); }
.hide-labels .app > span:last-child { display: none; }
.hide-labels .dock .app > span:last-child { display: none; }

.icon {
  width: 55px;
  height: 55px;
  border-radius: 17px;
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s var(--spring);
}

/* iOS 26 Icon Modes: Clear / Tinted / Color */
.mode-clear .icon {
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.08) 52%, rgba(255, 255, 255, 0.18) 100%);
  backdrop-filter: blur(22px) saturate(185%);
  -webkit-backdrop-filter: blur(22px) saturate(185%);
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.48);
  color: #ffffff;
}
.mode-clear .icon::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.1) 40%, rgba(255, 255, 255, 0.4) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.mode-tinted .icon {
  background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 34%, rgba(255, 255, 255, 0.18)), rgba(15, 23, 42, 0.28));
  backdrop-filter: blur(22px) saturate(185%);
  -webkit-backdrop-filter: blur(22px) saturate(185%);
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  color: var(--accent);
}
.mode-tinted .icon::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0.08) 45%, var(--accent));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.mode-color .icon {
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.34);
  color: #ffffff;
}
.mode-color .ico-notes    { background: linear-gradient(145deg, #fbbf24, #d97706); }
.mode-color .ico-tasks    { background: linear-gradient(145deg, #4ade80, #16a34a); }
.mode-color .ico-calc     { background: linear-gradient(145deg, #475569, #1e293b); }
.mode-color .ico-clock    { background: linear-gradient(145deg, #818cf8, #4f46e5); }
.mode-color .ico-weather  { background: linear-gradient(145deg, #38bdf8, #2563eb); }
.mode-color .ico-music    { background: linear-gradient(145deg, #fb7185, #e11d48); }
.mode-color .ico-focus    { background: linear-gradient(145deg, #2dd4bf, #0d9488); }
.mode-color .ico-sketch   { background: linear-gradient(145deg, #c084fc, #9333ea); }
.mode-color .ico-gallery  { background: linear-gradient(145deg, #60a5fa, #6366f1); }
.mode-color .ico-calendar { background: linear-gradient(145deg, #f87171, #dc2626); }
.mode-color .ico-files    { background: linear-gradient(145deg, #38bdf8, #0369a1); }
.mode-color .ico-convert  { background: linear-gradient(145deg, #f59e0b, #b45309); }
.mode-color .ico-browser  { background: linear-gradient(145deg, #22d3ee, #0284c7); }
.mode-color .ico-terminal { background: linear-gradient(145deg, #334155, #090d16); }
.mode-color .ico-camera   { background: linear-gradient(145deg, #64748b, #0f172a); }
.mode-color .ico-voice    { background: linear-gradient(145deg, #f43f5e, #9f1239); }
.mode-color .ico-compass  { background: linear-gradient(145deg, #fb923c, #c2410c); }
.mode-color .ico-g2048    { background: linear-gradient(145deg, #eab308, #a16207); }
.mode-color .ico-synth    { background: linear-gradient(145deg, #ec4899, #831843); }
.mode-color .ico-palette  { background: linear-gradient(145deg, #a855f7, #4c1d95); }
.mode-color .ico-monitor  { background: linear-gradient(145deg, #10b981, #065f46); }
.mode-color .ico-maps     { background: linear-gradient(145deg, #34d399, #0284c7); }
.mode-color .ico-settings { background: linear-gradient(145deg, #64748b, #334155); }
.mode-color .ico-about    { background: linear-gradient(145deg, #38bdf8, #0369a1); }
.mode-color .ico-phone    { background: linear-gradient(145deg, #34d399, #059669); }
.mode-color .ico-messages { background: linear-gradient(145deg, #38bdf8, #0284c7); }

/* Home Bottom Controls (Page Dots + Search Pill + Dock) */
.home-footer-controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding-bottom: 7px;
}

.page-dots {
  display: flex;
  gap: 6px;
}
.page-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  border: 0;
  padding: 0;
  background: rgba(255, 255, 255, 0.34);
  cursor: pointer;
  transition: width 0.22s var(--spring), background 0.2s;
}
.page-dot.active {
  width: 16px;
  border-radius: 4px;
  background: #ffffff;
}

.search-pill {
  padding: 5px 13px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.92);
  border: 0;
  cursor: pointer;
  transition: transform 0.16s var(--spring);
}
.search-pill:active { transform: scale(0.94); }

.dock {
  margin: 0 14px 6px;
  padding: 10px 14px;
  border-radius: 28px;
  display: flex;
  justify-content: space-around;
}
.dock .icon {
  width: 50px;
  height: 50px;
  border-radius: 15px;
}

.nav {
  position: relative;
  z-index: 32;
  height: 20px;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.nav span {
  width: 118px;
  height: 4.5px;
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.86);
  transition: width 0.2s var(--spring);
}
.nav:active span { width: 92px; }

/* Lock Screen & PIN Overlay */
.lockscreen {
  position: absolute;
  inset: 0;
  z-index: 30;
  touch-action: none;
  background: linear-gradient(180deg, rgba(6, 10, 18, 0.12) 0%, rgba(6, 10, 18, 0.34) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 66px 24px 32px;
  cursor: pointer;
  will-change: transform, opacity;
  transition: transform 0.44s var(--spring), opacity 0.28s ease;
}
.lockscreen.unlocked {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}
.lock-top { text-align: center; }
.lock-badge {
  width: 30px;
  height: 30px;
  margin: 0 auto 10px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: rgba(255, 255, 255, 0.9);
}
.lock-date {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: rgba(255, 255, 255, 0.88);
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
}
.lock-clock {
  font-family: var(--font-display);
  font-size: 84px;
  font-weight: 260;
  letter-spacing: -3.5px;
  line-height: 0.96;
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(255, 255, 255, 0.56) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.22));
}

.lock-media {
  width: 100%;
  max-width: 300px;
  border-radius: 22px;
  padding: 10px 14px;
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.lock-media.show { display: flex; }

.lock-bottom {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 10px 6px;
}
.lock-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 0;
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform 0.16s var(--spring);
}
.lock-btn:active { transform: scale(0.9); }

.pin-screen {
  position: absolute;
  inset: 0;
  z-index: 31;
  background: rgba(8, 12, 20, 0.56);
  backdrop-filter: blur(36px) saturate(180%);
  -webkit-backdrop-filter: blur(36px) saturate(180%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.24s ease;
}
.pin-screen.open { opacity: 1; pointer-events: auto; }
.pin-dots { display: flex; gap: 14px; }
.pin-dot { width: 12px; height: 12px; border-radius: 50%; border: 1.8px solid rgba(255, 255, 255, 0.7); transition: background 0.15s; }
.pin-dot.fill { background: #fff; border-color: #fff; }

/* Torch Overlay */
.torch-overlay {
  position: absolute;
  inset: 0;
  z-index: 45;
  background: radial-gradient(circle at 50% 40%, #ffffff 0%, #fef3c7 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding-bottom: 44px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  cursor: pointer;
}
.torch-overlay.on { opacity: 1; pointer-events: auto; }

/* Control Center */
.cc {
  position: absolute;
  inset: 0;
  z-index: 28;
  padding: 58px 20px 26px;
  background: rgba(8, 12, 20, 0.48);
  backdrop-filter: blur(36px) saturate(180%);
  -webkit-backdrop-filter: blur(36px) saturate(180%);
  display: flex;
  flex-direction: column;
  gap: 12px;
  will-change: transform, opacity;
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.36s var(--spring), opacity 0.24s ease;
}
.cc.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
.cc-top { display: flex; justify-content: space-between; align-items: center; }
.cc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cc-pebbles {
  border-radius: 26px;
  padding: 12px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.pebble {
  height: 50px;
  width: 50px;
  border-radius: 50%;
  margin: auto;
  border: 0;
  color: #fff;
  background: rgba(255, 255, 255, 0.14);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.2s var(--spring);
}
.pebble:active { transform: scale(0.9); }
.pebble.active {
  background: var(--accent);
  color: #06121f;
  box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 45%, transparent);
}
.cc-media {
  border-radius: 26px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.cc-actions-bar {
  border-radius: 24px;
  padding: 10px 14px;
  display: flex;
  justify-content: space-around;
}
.cc-sliders {
  border-radius: 24px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.bright-track {
  position: relative;
  height: 38px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
  margin-top: 6px;
}
.bright-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: rgba(255, 255, 255, 0.88);
  border-radius: 14px;
  pointer-events: none;
}
.bright-input {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  margin: 0;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  cursor: pointer;
}
.bright-input::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 4px;
  height: 24px;
  background: transparent;
}

/* App Switcher (Recents) */
.recents {
  position: absolute;
  inset: 0;
  z-index: 27;
  background: rgba(6, 10, 17, 0.56);
  backdrop-filter: blur(34px) saturate(180%);
  -webkit-backdrop-filter: blur(34px) saturate(180%);
  padding: 62px 20px 32px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  opacity: 0;
  pointer-events: none;
  transform: scale(1.06);
  transition: opacity 0.24s ease, transform 0.3s var(--spring);
}
.recents.open { opacity: 1; pointer-events: auto; transform: scale(1); }
.recents-deck {
  flex: 1;
  display: flex;
  gap: 14px;
  overflow-x: auto;
  align-items: center;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
}
.recents-deck::-webkit-scrollbar { display: none; }
.recent-card {
  flex: 0 0 210px;
  height: 330px;
  border-radius: 28px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  scroll-snap-align: center;
  cursor: pointer;
}

/* Search Overlay */
.search-overlay {
  position: absolute;
  inset: 0;
  z-index: 26;
  background: rgba(8, 12, 20, 0.52);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  padding: 64px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  opacity: 0;
  pointer-events: none;
  transform: scale(1.04);
  transition: opacity 0.22s ease, transform 0.28s var(--spring);
}
.search-overlay.open {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
}

/* App Window */
.panel {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: rgba(7, 10, 17, 0.78);
  backdrop-filter: blur(38px) saturate(160%);
  -webkit-backdrop-filter: blur(38px) saturate(160%);
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  will-change: transform, opacity;
  transform: translateY(28px) scale(0.93);
  transition: opacity 0.2s ease, transform 0.34s var(--spring);
  user-select: text;
}
.panel.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

.app-header {
  position: absolute;
  top: 46px;
  left: 16px;
  right: 16px;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}
.app-header > * { pointer-events: auto; }

.glass-pill {
  border: 0;
  border-radius: 999px;
  padding: 7px 15px;
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.glass-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 0;
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform 0.16s var(--spring);
}
.glass-circle:active { transform: scale(0.9); }

.app-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 96px 18px 88px;
  scrollbar-width: none;
}
.app-scroll::-webkit-scrollbar { display: none; }

.floating-bar {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 26px;
  z-index: 5;
  border-radius: 999px;
  padding: 5px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.spotify-mount {
  position: fixed;
  left: -9999px;
  top: 0;
  width: 336px;
  height: 410px;
  opacity: 0;
  pointer-events: none;
}
.spotify-mount.visible {
  position: absolute;
  left: 18px;
  right: 18px;
  top: 96px;
  bottom: 90px;
  width: auto;
  height: auto;
  z-index: 22;
  opacity: 1;
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Toast */
.toast {
  position: absolute;
  top: 48px;
  left: 50%;
  transform: translateX(-50%) translateY(-12px);
  padding: 7px 15px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: all 0.24s var(--spring);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Shared App Controls */
.field {
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  padding: 11px 14px;
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}
.field:focus { border-color: var(--accent); }

.btn {
  border: 0;
  border-radius: 999px;
  padding: 10px 16px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.15s var(--spring), background 0.2s;
}
.btn:active { transform: scale(0.94); }
.btn-acc {
  background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 44%, rgba(255, 255, 255, 0.18)), color-mix(in srgb, var(--accent) 26%, rgba(15, 23, 42, 0.45)));
  color: #ffffff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42), 0 8px 20px rgba(0, 0, 0, 0.25);
  border: 1px solid color-mix(in srgb, var(--accent) 55%, rgba(255, 255, 255, 0.2));
}
.btn-soft { background: rgba(255, 255, 255, 0.1); color: #fff; }
.btn-red { background: rgba(239, 68, 68, 0.85); color: #fff; }

.list-group {
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 22px;
  overflow: hidden;
  margin-bottom: 14px;
}
.list-row {
  padding: 13px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.list-row:last-child { border-bottom: 0; }

.sec-lbl {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin: 6px 0 8px 6px;
}

.toggle {
  width: 46px;
  height: 27px;
  border-radius: 999px;
  border: 0;
  padding: 3px;
  background: rgba(255, 255, 255, 0.16);
  cursor: pointer;
  display: flex;
  align-items: center;
  transition: background 0.2s;
  flex-shrink: 0;
}
.toggle span {
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.22s var(--spring);
}
.toggle.on { background: color-mix(in srgb, var(--accent) 70%, #22c55e); }
.toggle.on span { transform: translateX(19px); }

.seek-bar {
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
  height: 5px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
  outline: none;
  cursor: pointer;
}
.seek-bar::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px rgba(0, 0, 0, 0.4);
}

/* Calculator & Phone */
.calc-wrap { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 10px; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.calc-btn {
  height: 62px; border-radius: 50%; border: 0; font-family: inherit; font-size: 22px; font-weight: 500;
  color: #fff; background: rgba(255, 255, 255, 0.11); display: grid; place-items: center; cursor: pointer;
  transition: transform 0.14s var(--spring), filter 0.12s;
}
.calc-btn:active { transform: scale(0.9); filter: brightness(1.25); }
.calc-btn.fn { background: rgba(255, 255, 255, 0.22); }
.calc-btn.op { background: color-mix(in srgb, var(--accent) 40%, rgba(255, 255, 255, 0.12)); color: #fff; font-weight: 600; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }

.dial-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 260px; margin: 0 auto; }
.dial-btn {
  height: 64px; border-radius: 50%; border: 0; color: #fff; background: rgba(255, 255, 255, 0.1);
  display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
  transition: transform 0.14s var(--spring);
}
.dial-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.2); }
.dial-btn b { font-size: 23px; font-weight: 400; line-height: 1; }
.dial-btn span { font-size: 9px; letter-spacing: 1.4px; color: var(--muted); margin-top: 2px; }

/* Messages */
.bubble { max-width: 80%; padding: 10px 14px; border-radius: 20px; font-size: 13.5px; line-height: 1.4; margin-bottom: 7px; }
.bubble.me {
  margin-left: auto;
  background: color-mix(in srgb, var(--accent) 36%, rgba(255, 255, 255, 0.14));
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  color: #fff; font-weight: 500; border-bottom-right-radius: 6px;
}
.bubble.them { margin-right: auto; background: rgba(255, 255, 255, 0.12); border-bottom-left-radius: 6px; }

/* Calendar */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-day {
  aspect-ratio: 1; border-radius: 50%; border: 0; background: transparent; color: #fff;
  font-family: inherit; font-size: 13px; cursor: pointer; position: relative; display: grid; place-items: center;
}
.cal-day.today { background: color-mix(in srgb, var(--accent) 45%, rgba(255, 255, 255, 0.12)); font-weight: 700; }
.cal-day.sel { box-shadow: inset 0 0 0 1.5px var(--accent); }
.cal-dot { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

/* 2048 Board */
.g2048-board {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px;
  border-radius: 22px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1);
  touch-action: none;
}
.g2048-cell {
  aspect-ratio: 1; border-radius: 14px; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 22px; font-weight: 700;
  background: rgba(255, 255, 255, 0.05); transition: transform 0.12s var(--spring);
}

/* Synth Pads */
.synth-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.synth-pad {
  aspect-ratio: 1; border-radius: 22px; border: 0; color: #fff; font-family: inherit;
  font-size: 13px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px; transition: transform 0.1s, filter 0.1s;
}
.synth-pad:active, .synth-pad.hit { transform: scale(0.92); filter: brightness(1.4); }

/* Compass & Level */
.compass-dial {
  width: 210px; height: 210px; border-radius: 50%; margin: 12px auto 18px;
  position: relative; display: grid; place-items: center;
}
.compass-rose {
  position: absolute; inset: 14px; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, 0.25);
  transition: transform 0.15s ease-out;
}
.level-bubble {
  width: 24px; height: 24px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 14px var(--accent); transition: transform 0.12s ease-out;
}

/* Terminal */
.term-box {
  background: rgba(5, 7, 11, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px; padding: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px; line-height: 1.55; min-height: 360px; white-space: pre-wrap; color: #d1d5db;
}

/* Focus Orb */
.breath-orb {
  width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center;
  font-size: 15px; font-weight: 600; border: 2px solid var(--accent);
  box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 32%, transparent);
  transition: transform 4s ease-in-out;
}
.breath-orb.inhale, .breath-orb.hold { transform: scale(1.45); }
.breath-orb.exhale { transform: scale(0.92); }

.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3); cursor: pointer; }
</style>
</head>

function parseAudioMeta(file, customUrl = null) {
  const base = file.replace(AUDIO_EXT, '');
  const idx = base.lastIndexOf(' - ');
  let title = idx > 0 ? base.slice(0, idx) : base;
  const artist = idx > 0 ? base.slice(idx + 3).trim() : 'Local Audio';
  title = title.replace(/\s+,/g, ',').replace(/\s+\./g, '').trim();
  let hash = 0;
  for (let i = 0; i < file.length; i++) hash = (hash * 31 + file.charCodeAt(i)) >>> 0;
  return { file, url: customUrl || ('music/' + encodeURIComponent(file)), title, artist, glow: GLOW_PALETTE[hash % GLOW_PALETTE.length] };
}

let LIBRARY = SEED_FILES.map(f => parseAudioMeta(f));

function detectRepo() {
  if (location.hostname.endsWith('.github.io')) {
    const owner = location.hostname.split('.')[0];
    const repo = location.pathname.split('/').filter(Boolean)[0];
    if (owner && repo) return `${owner}/${repo}`;
  }
  return null;
}

function tickClock() {
  const d = new Date();
  const opts = { hour: '2-digit', minute: '2-digit', hour12: !prefs.hour24 };
  if (prefs.seconds) opts.second = '2-digit';
  const tFull = d.toLocaleTimeString([], opts);
  const tShort = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: !prefs.hour24 });
  const dt = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  EL.statusTime.textContent = tShort;
  EL.lockClock.textContent = tFull;
  EL.lockDate.textContent = dt;
}

let toastTimer;
function showToast(msg) {

  EL.toast.classList.add('show');

}

let actx = null;
function getAudio() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

function tone(freq = 540, dur = 0.04) {
  if (!prefs.sound || prefs.volume === 0) return;
  try {
    const c = getAudio(), o = c.createOscillator(), g = c.createGain();
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.04 * (prefs.volume / 100), c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  } catch {}
}

/* --- Lock, PIN, Idle Auto-Lock & Torch --- */
function resetIdleTimer() {
  clearTimeout(idleTimer);
  if (prefs.autoLock > 0 && EL.screen && EL.screen.classList.contains('unlocked')) {
    idleTimer = setTimeout(() => lockPhone(), prefs.autoLock * 1000);
  }
}

function attemptUnlock(nextApp = null) {
  if (EL.screen.classList.contains('unlocked')) return;
  if (prefs.pin && prefs.pin.length === 4) {
    pendingUnlockApp = nextApp;
    openPinPrompt();
  } else {
    unlockPhone();
    if (nextApp) openApp(nextApp);
  }
}

function unlockPhone() {
  if (EL.screen.classList.contains('unlocked')) return;
  tone(660, 0.05);
  EL.pinScreen.classList.remove('open');
  EL.screen.classList.add('unlocked');
  EL.lockscreen.classList.add('unlocked');
  resetIdleTimer();
}

function lockPhone() {
  tone(420, 0.05);
  clearTimeout(idleTimer);
  closeApp();
  closeRecents();
  EL.cc.classList.remove('open');
  EL.searchOverlay.classList.remove('open');
  EL.pinScreen.classList.remove('open');
  EL.screen.classList.remove('unlocked');
  EL.lockscreen.classList.remove('unlocked');
}

function toggleLock() {
  if (EL.screen.classList.contains('unlocked')) lockPhone();
  else attemptUnlock();
}

  if (k === '⌫') { pinEntry = pinEntry.slice(0, -1); renderPinUI(); return; }
  if (pinEntry.length < 4) pinEntry += k;
  renderPinUI();
  if (pinEntry.length === 4) {
    if (pinEntry === prefs.pin) {
      unlockPhone();
      if (pendingUnlockApp) { openApp(pendingUnlockApp); pendingUnlockApp = null; }
    } else {
      tone(220, 0.16);
      EL.pinPrompt.textContent = 'Try Again';
      pinEntry = '';
      setTimeout(renderPinUI, 240);
    }
  }
}

/* --- Auto-Scan Music Folder --- */
function mergeMusicFiles(files) {
  const existing = new Set(LIBRARY.map(t => t.file));
  let added = 0;
  files.forEach(f => {
    const clean = decodeURIComponent(String(f)).split('/').pop();
    if (AUDIO_EXT.test(clean) && !existing.has(clean)) {
      existing.add(clean);
      LIBRARY.push(parseAudioMeta(clean));
      added++;
    }
  });
  return added;
}

async function syncMusicLibrary(silent = false) {
  let found = [];
  if (prefs.repo && prefs.repo.includes('/')) {
    try {
      const res = await fetch(`https://api.github.com/repos/${prefs.repo}/contents/music`, { headers: { Accept: 'application/vnd.github+json' } });
      if (res.ok) {
        const items = await res.json();
        if (Array.isArray(items)) items.forEach(it => { if (it.type === 'file' && AUDIO_EXT.test(it.name)) found.push(it.name); });
      }
    } catch {}
  }
  if (!found.length) {
    try {
      const m = await fetch('music/manifest.json');
      if (m.ok) { const arr = await m.json(); if (Array.isArray(arr)) found = arr.filter(x => AUDIO_EXT.test(x)); }
    } catch {}
  }
  if (!found.length) {
    try {
      const idx = await fetch('music/');
      if (idx.ok) {
        const doc = new DOMParser().parseFromString(await idx.text(), 'text/html');
        doc.querySelectorAll('a[href]').forEach(a => { const href = a.getAttribute('href') || ''; if (AUDIO_EXT.test(href)) found.push(href); });
      }
    } catch {}
  }

  if (found.length) {
    LS.set('sky26-music-cache', JSON.stringify(found));
    const added = mergeMusicFiles(found);
    if (!silent) showToast(added ? `Added ${added} new track${added > 1 ? 's' : ''}` : `Synced (${LIBRARY.length} tracks)`);
    if (activeApp === 'music' && musicTab === 'library') rMusic(EL.appBody);
    if (activeApp === 'files') rFiles(EL.appBody);
  } else if (!silent) {
    showToast(`${LIBRARY.length} tracks ready`);
  }
}

function importLocalAudio(fileList) {
  if (!fileList || !fileList.length) return;
  let count = 0;
  Array.from(fileList).forEach(f => {
    if (!AUDIO_EXT.test(f.name) && !f.type.startsWith('audio/')) return;
    LIBRARY.unshift(parseAudioMeta(f.name, URL.createObjectURL(f)));
    count++;
  });
  if (count) {
    loadTrack(0, true);
    showToast(`Imported ${count} track${count > 1 ? 's' : ''}`);
    if (activeApp === 'files') rFiles(EL.appBody);
  }
}

/* --- Music App --- */
let music = { i: 0, playing: false, shuffle: false };
let musicTab = 'library';
let spotifyLoaded = false;

function fmtSec(s) {
  if (!Number.isFinite(s) || s < 0) return '0:00';
  return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
}

function setupAudioEngine() {
  const audio = EL.skyAudio;
  audio.src = LIBRARY[0].url;
  audio.volume = prefs.volume / 100;

  audio.addEventListener('timeupdate', () => {
    const seek = document.getElementById('seekBar'), cur = document.getElementById('curTime'), dur = document.getElementById('durTime');
    if (seek && audio.duration) seek.value = (audio.currentTime / audio.duration) * 100;
    if (cur) cur.textContent = fmtSec(audio.currentTime);
    if (dur && audio.duration) dur.textContent = fmtSec(audio.duration);
  });
  audio.addEventListener('loadedmetadata', () => {
    const dur = document.getElementById('durTime');
    if (dur && audio.duration) dur.textContent = fmtSec(audio.duration);
  });
  audio.addEventListener('ended', () => { if (prefs.autoPlayNext) nextTrack(); else { music.playing = false; syncMusicChrome(); } });
  audio.addEventListener('error', () => { music.playing = false; syncMusicChrome(); });

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', () => toggleMusicPlay());
      navigator.mediaSession.setActionHandler('pause', () => toggleMusicPlay());
      navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
      navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
    } catch {}
  }
}

function syncMusicChrome() {
  const t = LIBRARY[music.i];
  EL.mwTitle.textContent = t.title; EL.mwSub.textContent = t.artist;
  EL.mwIcon.innerHTML = music.playing ? SVG.pause : SVG.play;
  EL.ccTrackName.textContent = t.title; EL.ccTrackSub.textContent = t.artist;
  EL.ccPlayIco.innerHTML = music.playing ? SVG.pause : SVG.play;
  EL.lmTitle.textContent = t.title; EL.lmSub.textContent = t.artist;
  EL.lmPlay.innerHTML = music.playing ? SVG.pause : SVG.play;
  EL.lockMedia.classList.toggle('show', music.playing);

  EL.island.classList.toggle('playing', music.playing);
  EL.island.classList.toggle('expanded', music.playing || inCall || Boolean(tmInt));

  if ('mediaSession' in navigator) {
    try { navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: 'SkyOS Music' }); } catch {}
  }
}

function loadTrack(idx, autoPlay = true) {
  const audio = EL.skyAudio;
  music.i = (idx + LIBRARY.length) % LIBRARY.length;
  audio.src = LIBRARY[music.i].url;
  if (autoPlay) {
    audio.play().then(() => {
      music.playing = true; syncMusicChrome();
      if (activeApp === 'music' && musicTab === 'library') rMusic(EL.appBody);
    }).catch(() => { music.playing = false; syncMusicChrome(); showToast('Audio unavailable locally'); });
  } else syncMusicChrome();
  if (activeApp === 'music' && musicTab === 'library') rMusic(EL.appBody);
}

function toggleMusicPlay(fi = null) {
  const audio = EL.skyAudio;
  if (fi !== null && fi !== music.i) { loadTrack(fi, true); return; }
  if (music.playing) {
    audio.pause(); music.playing = false; syncMusicChrome();
    if (activeApp === 'music' && musicTab === 'library') rMusic(EL.appBody);
  } else {
    if (!audio.src) audio.src = LIBRARY[music.i].url;
    audio.play().then(() => {
      music.playing = true; syncMusicChrome();
      if (activeApp === 'music' && musicTab === 'library') rMusic(EL.appBody);
    }).catch(() => showToast('Place music/ folder next to index.html or import audio'));
  }
}

function nextTrack() {
  if (music.shuffle && LIBRARY.length > 1) {
    let r = music.i;
    while (r === music.i) r = Math.floor(Math.random() * LIBRARY.length);
    loadTrack(r, true);
  } else loadTrack(music.i + 1, true);
}
function prevTrack() { if (EL.skyAudio.currentTime > 3) EL.skyAudio.currentTime = 0; else loadTrack(music.i - 1, true); }
function seekTrack(val) { if (EL.skyAudio.duration) EL.skyAudio.currentTime = (val / 100) * EL.skyAudio.duration; }

function ensureSpotifyPlayer(playlistId = DEFAULT_SPOTIFY_ID) {
  if (!spotifyLoaded) {
    EL.spotifyMount.innerHTML = `
      <iframe id="spotifyFrame" style="border-radius:22px; border:1px solid rgba(255,255,255,0.14); width:100%; flex:1; background:#121212;"

        <button class="btn btn-acc" style="padding:6px 12px; font-size:11.5px;" onclick="loadCustomSpotify()">Load</button>

  const val = document.getElementById('spCustomUrl').value.trim();

/* --- Notes (Inline Edit + Add + Delete) --- */
let editNoteId = null;
function getNotes() { try { return JSON.parse(LS.get('sky26-notes', '[]')); } catch { return []; } }
function rNotes(body) {
  const notes = getNotes();
  EL.appRightSlot.innerHTML = `<button class="glass-circle lg" onclick="editNoteId=null; rNotes(EL.appBody); document.getElementById('noteIn').focus();">${SVG.plus}</button>`;
  const editing = notes.find(x => x.id === editNoteId);
  body.innerHTML = `
    <div style="margin-bottom:14px;">
      <textarea class="field" id="noteIn" placeholder="New note..." style="min-height:84px;"></textarea>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn btn-acc" style="flex:1;" onclick="saveNote()">${editing ? 'Update' : 'Save'}</button>
        ${editing ? `<button class="btn btn-soft" onclick="editNoteId=null; rNotes(EL.appBody);">Cancel</button>` : ''}
      </div>
    </div>
    <div class="list-group" id="notesList"></div>`;
  if (editing) document.getElementById('noteIn').value = editing.text;

  const list = document.getElementById('notesList');
  if (!notes.length) { list.style.display = 'none'; return; }
  notes.forEach(n => {
    const row = document.createElement('div');
    row.className = 'list-row';
    row.style.cursor = 'pointer';
    row.onclick = () => { editNoteId = n.id; rNotes(body); };
    const txt = document.createElement('div');
    txt.style.cssText = 'font-size:13.5px; white-space:pre-wrap; flex:1;';
    txt.textContent = n.text;
    const del = document.createElement('button');
    del.className = 'glass-circle';
    del.style.cssText = 'width:28px; height:28px; background:rgba(255,255,255,0.08); flex-shrink:0;';
    del.innerHTML = SVG.trash;
    del.onclick = e => { e.stopPropagation(); if (editNoteId === n.id) editNoteId = null; LS.set('sky26-notes', JSON.stringify(getNotes().filter(x => x.id !== n.id))); rNotes(body); };
    row.append(txt, del);
    list.appendChild(row);
  });
}
function saveNote() {
  const t = document.getElementById('noteIn').value.trim();
  if (!t) return;
  let n = getNotes();
  if (editNoteId !== null) {

/* --- Calculator --- */
let cExp = '', cPrev = '';
function evalMath(str) {
  const tokens = str.replace(/\s+/g, '').match(/(\d*\.?\d+|[+\-*/()])/g);
  if (!tokens) throw 0;
  let pos = 0;
  const peek = () => tokens[pos], next = () => tokens[pos++];
  function parseExpr() { let val = parseTerm(); while (peek() === '+' || peek() === '-') val = next() === '+' ? val + parseTerm() : val - parseTerm(); return val; }
  function parseTerm() { let val = parseFactor(); while (peek() === '*' || peek() === '/') { const op = next(), rhs = parseFactor(); if (op === '/' && rhs === 0) throw 0; val = op === '*' ? val * rhs : val / rhs; } return val; }
  function parseFactor() {
    if (peek() === '-') { next(); return -parseFactor(); }
    if (peek() === '+') { next(); return parseFactor(); }
    if (peek() === '(') { next(); const val = parseExpr(); if (next() !== ')') throw 0; return val; }
    const num = parseFloat(next()); if (!Number.isFinite(num)) throw 0; return num;
  }
  const res = parseExpr(); if (pos !== tokens.length || !Number.isFinite(res)) throw 0; return res;
}
function rCalc(body) {
  const keys = [['AC','fn'],['(','fn'],[')','fn'],['÷','op'],['7',''],['8',''],['9',''],['×','op'],['4',''],['5',''],['6',''],['−','op'],['1',''],['2',''],['3',''],['+','op'],['⌫',''],['0',''],['.',''],['=','op']];
  body.innerHTML = `
    <div class="calc-wrap">
      <div id="cPrev" style="text-align:right; font-size:14px; color:var(--muted); min-height:20px; padding:0 8px; font-variant-numeric:tabular-nums;">${cPrev}</div>
      <div id="cDisp" style="font-family:var(--font-display); font-size:52px; font-weight:280; text-align:right; padding:4px 8px 18px; overflow-wrap:anywhere; font-variant-numeric:tabular-nums;">${cExp || '0'}</div>
      <div class="calc-grid">${keys.map(k => `<button class="calc-btn ${k[1]}" onclick="cKey('${k[0]}')">${k[0] === '⌫' ? SVG.backsp : k[0]}</button>`).join('')}</div>
    </div>`;
}
function cKey(k) {
  tone(620, 0.03);
  const d = document.getElementById('cDisp'), p = document.getElementById('cPrev');
  if (!d) return;
  if (k === 'AC') { cExp = ''; cPrev = ''; p.textContent = ''; d.textContent = '0'; return; }
  if (k === '⌫') { cExp = cExp.slice(0, -1); d.textContent = cExp || '0'; return; }
  if (k === '=') {
    if (!cExp) return;
    try { const r = evalMath(cExp.replaceAll('÷','/').replaceAll('×','*').replaceAll('−','-')); cPrev = cExp; cExp = String(Number(r.toFixed(8))); p.textContent = cPrev; d.textContent = cExp; }
    catch { cExp = ''; p.textContent = ''; d.textContent = 'Error'; }
    return;
  }
  const ops = ['÷', '×', '−', '+'];
  if (ops.includes(k) && ops.includes(cExp.slice(-1))) cExp = cExp.slice(0, -1) + k; else cExp += k;
  d.textContent = cExp;
}

/* --- Clock (Stopwatch + Timer + World) --- */
let clkTab = 'sw', swMs = 0, swInt = null, swLaps = [], tmTot = 300, tmLeft = 300, tmInt = null;
const fSw = ms => { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}.${Math.floor((ms % 1000) / 100)}`; };
const WORLD_ZONES = [

  if (clkTab === 'sw') {

        <div style="display:flex; justify-content:center; gap:12px; margin-top:22px;">

    body.innerHTML = `
      <div style="text-align:center; padding:24px 0;">
        <div style="position:relative; width:168px; height:168px; margin:0 auto 20px; display:grid; place-items:center;">

            <circle id="tmRing" cx="84" cy="84" r="${r}" stroke="var(--accent)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
          </svg>
          <div id="tmTxt" style="font-family:var(--font-display); font-size:38px; font-weight:300; font-variant-numeric:tabular-nums;">${fmt(tmLeft)}</div>
        </div>
        <div style="display:flex; justify-content:center; gap:8px; margin-bottom:18px;">
          ${[60, 180, 300, 600].map(s => `<button class="btn ${tmTot === s ? 'btn-acc' : 'btn-soft'}" style="padding:7px 13px; font-size:12px;" onclick="setTm(${s})">${s / 60}m</button>`).join('')}
        </div>
        <div style="display:flex; justify-content:center; gap:12px;">
          <button class="btn btn-acc" onclick="toggleTm()">${tmInt ? 'Pause' : 'Start'}</button>
          <button class="btn btn-soft" onclick="setTm(${tmTot})">Reset</button>
        </div>
      </div>`;
  } else {
    const now = new Date();
    body.innerHTML = `<div class="list-group">${WORLD_ZONES.map(z => {
      const t = now.toLocaleTimeString([], { timeZone: z.tz, hour: '2-digit', minute: '2-digit', hour12: !prefs.hour24 });

function toggleSw() {

/* --- Weather (Live Open-Meteo API + Cached Fallback) --- */
const CITIES = {
  Berlin:    { lat: 52.52, lon: 13.40, t: 18, c: 'Clear',  h: '52%', w: '11 km/h', u: '3', hrs: [18,16,15,14], i: 'p', hi: 20, lo: 12 },
  Munich:    { lat: 48.14, lon: 11.58, t: 15, c: 'Cloudy', h: '64%', w: '14 km/h', u: '2', hrs: [15,14,12,11], i: 'c', hi: 17, lo: 9 },
  Tokyo:     { lat: 35.68, lon: 139.69,t: 22, c: 'Sunny',  h: '44%', w: '8 km/h',  u: '6', hrs: [22,21,19,18], i: 's', hi: 24, lo: 15 },
  Reykjavik: { lat: 64.15, lon: -21.94,t: 6,  c: 'Breezy', h: '74%', w: '24 km/h', u: '1', hrs: [6,5,4,4],     i: 'c', hi: 7,  lo: 2 }
};
let city = 'Berlin';

async function fetchLiveWeather(name, silent = false) {
  const c = CITIES[name];
  if (!c) return;
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&hourly=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`);
    if (!r.ok) return;
    const d = await r.json();
    if (d.current) {
      c.t = Math.round(d.current.temperature_2m);
      c.h = `${Math.round(d.current.relative_humidity_2m)}%`;
      c.w = `${Math.round(d.current.wind_speed_10m)} km/h`;
      const wc = d.current.weather_code;
      c.c = wc === 0 ? 'Clear' : (wc <= 3 ? 'Partly Cloudy' : (wc >= 51 ? 'Rain' : 'Cloudy'));
      c.i = wc === 0 ? 's' : (wc <= 2 ? 'p' : 'c');
    }
    if (d.hourly && d.hourly.temperature_2m) {
      const hr = new Date().getHours();
      c.hrs = [0,1,2,3].map(o => Math.round(d.hourly.temperature_2m[Math.min(23, hr + o)] ?? c.t));
    }
    if (d.daily) {
      c.hi = Math.round(d.daily.temperature_2m_max[0] ?? c.t + 2);
      c.lo = Math.round(d.daily.temperature_2m_min[0] ?? c.t - 4);
    }
    updateWeatherWidget();
    if (activeApp === 'weather' && city === name) rWeather(EL.appBody, false);
    if (!silent) showToast(`${name} updated`);
  } catch {}
}

function updateWeatherWidget() {
  const c = CITIES[city];
  const gi = (k, s) => k === 's' ? SVG.wSun(s) : (k === 'c' ? SVG.wCloud(s) : SVG.wPartly(s));
  EL.hwCity.textContent = city; EL.hwTemp.textContent = `${c.t}°`; EL.hwCond.textContent = c.c;
  EL.hwRange.textContent = `H:${c.hi}° L:${c.lo}°`; EL.hwIcon.innerHTML = gi(c.i, 24);
}

function rWeather(body, doFetch = true) {

/* --- NEW App: 2048 Puzzle --- */
let gBoard = [], gScore = 0, gBest = Number(LS.get('sky26-2048', 0));
function init2048() {
  gBoard = Array(16).fill(0); gScore = 0;
  spawn2048(); spawn2048();
}
function spawn2048() {
  const emp = gBoard.map((v, i) => v === 0 ? i : -1).filter(i => i >= 0);
  if (emp.length) gBoard[emp[Math.floor(Math.random() * emp.length)]] = Math.random() < 0.9 ? 2 : 4;
}
function slide2048(dir) {
  const prev = gBoard.join(',');
  const get = (r, c) => gBoard[r * 4 + c], set = (r, c, v) => { gBoard[r * 4 + c] = v; };
  for (let i = 0; i < 4; i++) {
    let line = [];
    for (let j = 0; j < 4; j++) line.push(dir === 'L' ? get(i,j) : dir === 'R' ? get(i,3-j) : dir === 'U' ? get(j,i) : get(3-j,i));
    line = line.filter(Boolean);
    for (let k = 0; k < line.length - 1; k++) {
      if (line[k] === line[k + 1]) { line[k] *= 2; gScore += line[k]; line.splice(k + 1, 1); }
    }
    while (line.length < 4) line.push(0);
    for (let j = 0; j < 4; j++) {
      if (dir === 'L') set(i, j, line[j]);
      else if (dir === 'R') set(i, 3 - j, line[j]);
      else if (dir === 'U') set(j, i, line[j]);
      else set(3 - j, i, line[j]);
    }
  }
  if (gBoard.join(',') !== prev) {
    if (gScore > gBest) { gBest = gScore; LS.set('sky26-2048', gBest); }
    spawn2048();
    if (activeApp === 'g2048') r2048(EL.appBody);
  }
}
function r2048(body) {
  if (!gBoard.length) init2048();
  const colors = { 0:'rgba(255,255,255,0.05)', 2:'rgba(255,255,255,0.14)', 4:'rgba(125,211,252,0.22)', 8:'rgba(56,189,248,0.34)', 16:'rgba(99,102,241,0.4)', 32:'rgba(168,85,247,0.45)', 64:'rgba(236,72,153,0.48)', 128:'rgba(251,146,60,0.52)', 256:'rgba(250,204,21,0.55)' };
  EL.appRightSlot.innerHTML = `<button class="glass-circle lg" onclick="init2048(); r2048(EL.appBody)">${SVG.refresh}</button>`;
  body.innerHTML = `
    <div style="display:flex; justify-content:space-between; margin-bottom:14px; font-size:13px;">
      <div class="glass-pill lg lg-dark">Score: ${gScore}</div>
      <div class="glass-pill lg lg-dark">Best: ${gBest}</div>
    </div>
    <div class="g2048-board" id="b2048">
      ${gBoard.map(v => `<div class="g2048-cell" style="background:${colors[v] || 'rgba(244,63,94,0.6)'}; font-size:${v>99?18:22}px;">${v || ''}</div>`).join('')}
    </div>`;
  const bd = document.getElementById('b2048');
  let sx = 0, sy = 0;
  bd.onpointerdown = e => { sx = e.clientX; sy = e.clientY; };
  bd.onpointerup = e => {
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    slide2048(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
  };
}

function rPalette(body) {

  body.innerHTML = `

    </div>`;
}
function hexToHsl(hex) {
  let r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b); let h = 0, s = 0, l = (max+min)/2;
  if (max !== min) { const d = max - min; s = l > 0.5 ? d / (2 - max - min) : d / (max + min); h = max === r ? (g-b)/d + (g<b?6:0) : max === g ? (b-r)/d + 2 : (r-g)/d + 4; h /= 6; }
  return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
}
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; const c = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1); return Math.round(255 * c).toString(16).padStart(2, '0'); };
  return `#${f(0)}${f(8)}${f(4)}`;
}

let cvCat = 'temp', cvVal = '20', cvSwap = false;

function rConvert(body) {

    <div class="list-group" style="padding:16px;">

      <div style="display:flex; justify-content:center; margin:12px 0;"><button class="glass-circle lg" onclick="cvSwap=!cvSwap; rConvert(EL.appBody)">${SVG.swap}</button></div>

    </div>`;
}
function updateConvOut() { const c = CONV[cvCat], num = parseFloat(cvVal), el = document.getElementById('convOut'); if (el) el.textContent = Number.isFinite(num) ? Number(c.fn(num, cvSwap).toFixed(2)) : '—'; }

let termLogs = ['SkySH 26 — type "help"'];
function rTerminal(body) {
  body.innerHTML = `<div class="term-box" id="termOut"></div>`;
  document.getElementById('termOut').textContent = termLogs.join('\n');
  EL.appBottomSlot.innerHTML = `<div class="floating-bar lg lg-dark"><input id="termIn" placeholder="command..." style="flex:1; background:transparent; border:0; color:#fff; padding:8px 14px; font-family:ui-monospace,monospace; font-size:13px; outline:none;" onkeydown="if(event.key==='Enter') runTerm()"><button class="glass-circle btn-acc" onclick="runTerm()">${SVG.send}</button></div>`;
}
function runTerm() {
  const inp = document.getElementById('termIn'), raw = inp.value.trim(); if (!raw) return;
  termLogs.push('$ ' + raw);
  const [cmd, ...rest] = raw.split(/\s+/), arg = rest.join(' '), c = cmd.toLowerCase();
  if (c === 'help') termLogs.push('cmds: help, ls, play <q>, open <app>, sync, time, theme <hex>, clear');
  else if (c === 'clear') termLogs = [];
  else if (c === 'time') termLogs.push(new Date().toLocaleString());
  else if (c === 'ls') termLogs.push(LIBRARY.map((t, i) => `[${i}] ${t.file}`).join('\n'));
  else if (c === 'sync') { syncMusicLibrary(false); termLogs.push('syncing music/...'); }
  else if (c === 'theme' && arg) { setAccent(arg); termLogs.push(`accent -> ${arg}`); }
  else if (c === 'open' && arg) { openApp(arg.toLowerCase()); return; }
  else if (c === 'play') { const idx = LIBRARY.findIndex(t => t.title.toLowerCase().includes(arg.toLowerCase())); if (idx >= 0) { loadTrack(idx, true); termLogs.push(`playing: ${LIBRARY[idx].title}`); } else termLogs.push('not found'); }
  else termLogs.push(`unknown: ${cmd}`);
  rTerminal(EL.appBody);
  const box = document.getElementById('termOut'); if (box) box.scrollTop = box.scrollHeight;
}

let dial = '', callMuted = false, callSec = 0, callTimer = null;
const DTMF = { '1':697,'2':730,'3':770,'4':800,'5':852,'6':890,'7':941,'8':980,'9':1020,'*':580,'0':640,'#':710 };
function rPhone(body) {
  endCall();
  const pad = [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
  body.innerHTML = `<div style="padding-top:16px;"><div id="dTxt" style="font-family:var(--font-display); font-size:32px; font-weight:300; text-align:center; min-height:44px; margin-bottom:22px; font-variant-numeric:tabular-nums;">${dial || ' '}</div><div class="dial-grid">${pad.map(k => `<button class="dial-btn" onclick="dPress('${k[0]}')"><b>${k[0]}</b><span>${k[1]}</span></button>`).join('')}</div><div style="display:flex; justify-content:center; align-items:center; gap:22px; margin-top:20px;"><div style="width:44px;"></div><button class="glass-circle" style="width:66px; height:66px; background:#22c55e; color:#fff;" onclick="doCall()">${SVG.call}</button><button class="glass-circle" style="width:44px; height:44px; background:transparent;" onclick="dBack()">${SVG.backsp}</button></div></div>`;
}
function dPress(k) { tone(DTMF[k] || 600, 0.06); if (dial.length < 14) dial += k; document.getElementById('dTxt').textContent = dial; }
function dBack() { dial = dial.slice(0, -1); document.getElementById('dTxt').textContent = dial || ' '; }
function doCall() {
  if (!dial) return;
  inCall = true; callMuted = false; callSec = 0; EL.island.classList.add('calling', 'expanded');
  clearInterval(callTimer);
  callTimer = setInterval(() => { callSec++; const ct = document.getElementById('callTimer'); if (ct) ct.textContent = `${String(Math.floor(callSec/60)).padStart(2,'0')}:${String(callSec%60).padStart(2,'0')}`; }, 1000);
  rCallScreen();
}
function rCallScreen() {
  EL.appBody.innerHTML = `<div style="text-align:center; padding:54px 0;"><div id="callDialTxt" style="font-size:28px; font-weight:500;"></div><div id="callTimer" style="font-size:13px; color:var(--accent); margin-top:6px; font-variant-numeric:tabular-nums;">00:00</div><div style="display:flex; justify-content:center; gap:22px; margin-top:140px;"><button class="glass-circle lg" style="width:60px; height:60px; ${callMuted ? 'background:#fff; color:#000;' : ''}" onclick="callMuted=!callMuted; rCallScreen();">${SVG.volOff}</button><button class="glass-circle btn-red" style="width:60px; height:60px;" onclick="rPhone(EL.appBody)">${SVG.close}</button></div></div>`;
  document.getElementById('callDialTxt').textContent = dial;
}
function endCall() { inCall = false; clearInterval(callTimer); EL.island.classList.remove('calling'); EL.island.classList.toggle('expanded', music.playing || Boolean(tmInt)); }
