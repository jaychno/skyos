<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyOS 26</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,200..800&family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --accent: #7dd3fc;
  --text: #f8fafc;
  --muted: rgba(241, 245, 249, 0.62);
  --spring: cubic-bezier(0.32, 0.72, 0, 1);
  --brightness: 1;
  --font-ui: "Google Sans", "Google Sans Flex", system-ui, -apple-system, sans-serif;
  --font-display: "Google Sans Flex", "Google Sans", system-ui, -apple-system, sans-serif;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
  background: radial-gradient(circle at 50% 0%, #151b26 0%, #05070b 72%);
  font-family: var(--font-ui);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* Hardware Frame */
.phone-wrap { position: relative; }

.side-btn {
  position: absolute;
  background: linear-gradient(180deg, #5f6775, #2b303a);
  pointer-events: none;
}
.vol-up { left: -4px; top: 148px; width: 3px; height: 42px; border-radius: 3px 0 0 3px; }
.vol-dn { left: -4px; top: 200px; width: 3px; height: 42px; border-radius: 3px 0 0 3px; }

.pwr-btn {
  position: absolute;
  right: -5px;
  top: 172px;
  width: 4px;
  height: 68px;
  border-radius: 0 4px 4px 0;
  border: 0;
  background: linear-gradient(180deg, #677080, #303642);
  cursor: pointer;
}

.phone {
  width: min(388px, 95vw);
  height: min(822px, 93vh);
  min-height: 630px;
  border-radius: 52px;
  padding: 7px;
  background: #0a0c10;
  border: 2.5px solid #424956;
  box-shadow:
    0 40px 100px rgba(0, 0, 0, 0.82),
    0 0 0 1px rgba(255, 255, 255, 0.14),
    inset 0 0 0 2px #020305;
  overflow: hidden;
}

.screen {
  height: 100%;
  border-radius: 44px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: #0b1220;
  filter: brightness(var(--brightness));
  user-select: none;
}

.wallpaper-layer {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.wallpaper-layer svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* iOS 26 Liquid Glass Material */
.lg {
  position: relative;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.06) 52%, rgba(255, 255, 255, 0.14) 100%);
  backdrop-filter: blur(26px) saturate(195%) brightness(1.06);
  -webkit-backdrop-filter: blur(26px) saturate(195%) brightness(1.06);
  box-shadow:
    0 12px 32px rgba(0, 0, 0, 0.22),
    inset 0 1px 0 rgba(255, 255, 255, 0.42),
    inset 0 -1px 0 rgba(255, 255, 255, 0.1);
}
.lg::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.68) 0%,
    rgba(255, 255, 255, 0.1) 36%,
    rgba(255, 255, 255, 0.04) 64%,
    rgba(255, 255, 255, 0.38) 100%
  );
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.lg-dark {
  background: linear-gradient(145deg, rgba(24, 30, 42, 0.54) 0%, rgba(12, 16, 24, 0.4) 55%, rgba(28, 34, 48, 0.46) 100%);
}

/* Status Bar & Dynamic Island */
.status {
  position: relative;
  z-index: 35;
  height: 44px;
  padding: 14px 26px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}

.island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 98px;
  height: 26px;
  background: #030406;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 9px;
  z-index: 36;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.55), inset 0 0 0 0.5px rgba(255, 255, 255, 0.1);
  transition: width 0.36s var(--spring);
}
.island.expanded { width: 142px; }

.island-wave {
  display: none;
  align-items: center;
  gap: 2px;
  height: 12px;
}
.island.playing .island-wave { display: flex; }
.island-wave span {
  width: 2px;
  height: 4px;
  border-radius: 2px;
  background: var(--accent);
  animation: eq 0.85s ease-in-out infinite alternate;
}
.island-wave span:nth-child(2) { animation-delay: 0.2s; }
.island-wave span:nth-child(3) { animation-delay: 0.45s; }
@keyframes eq {
  from { height: 3px; opacity: 0.6; }
  to { height: 11px; opacity: 1; }
}

.island-dot {
  display: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #34d399;
  box-shadow: 0 0 8px #34d399;
}
.island.calling .island-dot { display: block; }
.island.calling .island-wave { display: none; }

.island-lens {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-left: auto;
  background: radial-gradient(circle at 35% 35%, #3b82f6 0%, #0f172a 55%, #030712 100%);
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}

/* Home Layer (Hidden cleanly while locked to prevent startup overlap) */
.home-layer {
  position: relative;
  z-index: 5;
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  transform: scale(1.06);
  pointer-events: none;
  will-change: transform, opacity;
  transition: transform 0.44s var(--spring), opacity 0.32s ease;
}
.screen.unlocked .home-layer {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}
.screen.unlocked.app-open .home-layer {
  transform: scale(0.92);
  opacity: 0.25;
}

.home-main {
  flex: 1;
  padding: 18px 20px 6px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  overflow-y: auto;
  scrollbar-width: none;
}
.home-main::-webkit-scrollbar { display: none; }

.widgets-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.widget-sq {
  border-radius: 26px;
  padding: 15px;
  height: 132px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  transition: transform 0.22s var(--spring);
}
.widget-sq:active { transform: scale(0.96); }

.w-temp {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 300;
  letter-spacing: -1.5px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.w-city { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.w-sub { font-size: 11px; color: rgba(255, 255, 255, 0.74); }

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px 12px;
}

.app {
  border: 0;
  background: none;
  color: var(--text);
  font-family: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  padding: 0;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
  transition: transform 0.2s var(--spring);
}
.app:active { transform: scale(0.86); }
.app:hover .icon { transform: translateY(-2px); }

.icon {
  width: 56px;
  height: 56px;
  border-radius: 17px;
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
  transition: transform 0.22s var(--spring);
}

/* iOS 26 Icon Modes: Clear / Tinted / Color */
.mode-clear .icon {
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.08) 52%, rgba(255, 255, 255, 0.18) 100%);
  backdrop-filter: blur(22px) saturate(185%);
  -webkit-backdrop-filter: blur(22px) saturate(185%);
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.48);
  color: #ffffff;
}
.mode-clear .icon::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.1) 40%, rgba(255, 255, 255, 0.4) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.mode-tinted .icon {
  background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 34%, rgba(255, 255, 255, 0.18)), rgba(15, 23, 42, 0.28));
  backdrop-filter: blur(22px) saturate(185%);
  -webkit-backdrop-filter: blur(22px) saturate(185%);
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  color: var(--accent);
}
.mode-tinted .icon::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0.08) 45%, var(--accent));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.mode-color .icon {
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.34);
  color: #ffffff;
}
.mode-color .ico-notes    { background: linear-gradient(145deg, #fbbf24, #d97706); }
.mode-color .ico-tasks    { background: linear-gradient(145deg, #4ade80, #16a34a); }
.mode-color .ico-calc     { background: linear-gradient(145deg, #475569, #1e293b); }
.mode-color .ico-clock    { background: linear-gradient(145deg, #818cf8, #4f46e5); }
.mode-color .ico-weather  { background: linear-gradient(145deg, #38bdf8, #2563eb); }
.mode-color .ico-music    { background: linear-gradient(145deg, #fb7185, #e11d48); }
.mode-color .ico-focus    { background: linear-gradient(145deg, #2dd4bf, #0d9488); }
.mode-color .ico-sketch   { background: linear-gradient(145deg, #c084fc, #9333ea); }
.mode-color .ico-gallery  { background: linear-gradient(145deg, #60a5fa, #6366f1); }
.mode-color .ico-browser  { background: linear-gradient(145deg, #22d3ee, #0284c7); }
.mode-color .ico-settings { background: linear-gradient(145deg, #64748b, #334155); }
.mode-color .ico-about    { background: linear-gradient(145deg, #38bdf8, #0369a1); }
.mode-color .ico-phone    { background: linear-gradient(145deg, #34d399, #059669); }
.mode-color .ico-messages { background: linear-gradient(145deg, #38bdf8, #0284c7); }

.search-pill {
  align-self: center;
  margin: 2px 0 8px;
  padding: 6px 14px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.92);
  border: 0;
  cursor: pointer;
  transition: transform 0.16s var(--spring);
}
.search-pill:active { transform: scale(0.94); }

.dock {
  margin: 0 14px 8px;
  padding: 11px 14px;
  border-radius: 30px;
  display: flex;
  justify-content: space-around;
}
.dock .icon {
  width: 52px;
  height: 52px;
  border-radius: 16px;
}

.nav {
  position: relative;
  z-index: 32;
  height: 20px;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.nav span {
  width: 118px;
  height: 4.5px;
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.86);
  transition: width 0.2s var(--spring);
}
.nav:active span { width: 92px; }

/* Lock Screen */
.lockscreen {
  position: absolute;
  inset: 0;
  z-index: 30;
  background: linear-gradient(180deg, rgba(6, 10, 18, 0.12) 0%, rgba(6, 10, 18, 0.34) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 68px 24px 32px;
  cursor: pointer;
  will-change: transform, opacity;
  transition: transform 0.45s var(--spring), opacity 0.3s ease;
}
.lockscreen.unlocked {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}
.lock-top { text-align: center; }
.lock-badge {
  width: 30px;
  height: 30px;
  margin: 0 auto 10px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: rgba(255, 255, 255, 0.9);
}
.lock-date {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: rgba(255, 255, 255, 0.88);
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
}
.lock-clock {
  font-family: var(--font-display);
  font-size: 92px;
  font-weight: 260;
  letter-spacing: -3.5px;
  line-height: 0.96;
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(255, 255, 255, 0.56) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.22));
}
.lock-bottom {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 10px 6px;
}
.lock-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 0;
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform 0.16s var(--spring);
}
.lock-btn:active { transform: scale(0.9); }

/* Control Center */
.cc {
  position: absolute;
  inset: 0;
  z-index: 28;
  padding: 60px 20px 28px;
  background: rgba(8, 12, 20, 0.42);
  backdrop-filter: blur(36px) saturate(180%);
  -webkit-backdrop-filter: blur(36px) saturate(180%);
  display: flex;
  flex-direction: column;
  gap: 14px;
  will-change: transform, opacity;
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.38s var(--spring), opacity 0.26s ease;
}
.cc.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
.cc-top { display: flex; justify-content: space-between; align-items: center; }
.cc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cc-pebbles {
  border-radius: 26px;
  padding: 12px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.pebble {
  height: 52px;
  width: 52px;
  border-radius: 50%;
  margin: auto;
  border: 0;
  color: #fff;
  background: rgba(255, 255, 255, 0.14);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.2s var(--spring);
}
.pebble:active { transform: scale(0.9); }
.pebble.active {
  background: var(--accent);
  color: #06121f;
  box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 45%, transparent);
}
.cc-media {
  border-radius: 26px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
}
.cc-slider-card { border-radius: 24px; padding: 14px 16px; }
.bright-track {
  position: relative;
  height: 44px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
  margin-top: 10px;
}
.bright-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: rgba(255, 255, 255, 0.88);
  border-radius: 16px;
  pointer-events: none;
}
.bright-input {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  margin: 0;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  cursor: pointer;
}
.bright-input::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 4px;
  height: 24px;
  background: transparent;
}

/* Search Overlay */
.search-overlay {
  position: absolute;
  inset: 0;
  z-index: 26;
  background: rgba(8, 12, 20, 0.48);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  padding: 64px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  opacity: 0;
  pointer-events: none;
  transform: scale(1.04);
  transition: opacity 0.22s ease, transform 0.3s var(--spring);
}
.search-overlay.open {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
}

/* App Window & Floating Glass Chrome */
.panel {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: rgba(9, 13, 20, 0.92);
  backdrop-filter: blur(30px) saturate(160%);
  -webkit-backdrop-filter: blur(30px) saturate(160%);
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  will-change: transform, opacity;
  transform: translateY(30px) scale(0.92);
  transition: opacity 0.22s ease, transform 0.36s var(--spring);
  user-select: text;
}
.panel.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

.app-header {
  position: absolute;
  top: 46px;
  left: 16px;
  right: 16px;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}
.app-header > * { pointer-events: auto; }

.glass-pill {
  border: 0;
  border-radius: 999px;
  padding: 7px 15px;
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.glass-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 0;
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform 0.16s var(--spring);
}
.glass-circle:active { transform: scale(0.9); }

.app-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 96px 18px 86px;
  scrollbar-width: none;
}
.app-scroll::-webkit-scrollbar { display: none; }

.floating-bar {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 26px;
  z-index: 5;
  border-radius: 999px;
  padding: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Persistent Spotify Mount (keeps audio alive across app switches) */
.spotify-mount {
  position: fixed;
  left: -9999px;
  top: 0;
  width: 336px;
  height: 410px;
  opacity: 0;
  pointer-events: none;
}
.spotify-mount.visible {
  position: absolute;
  left: 18px;
  right: 18px;
  top: 96px;
  bottom: 88px;
  width: auto;
  height: auto;
  z-index: 22;
  opacity: 1;
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Toast */
.toast {
  position: absolute;
  top: 48px;
  left: 50%;
  transform: translateX(-50%) translateY(-12px);
  padding: 7px 15px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: all 0.24s var(--spring);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Shared App Controls */
.field {
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  padding: 11px 14px;
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}
.field:focus { border-color: var(--accent); }

.btn {
  border: 0;
  border-radius: 999px;
  padding: 10px 16px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.15s var(--spring);
}
.btn:active { transform: scale(0.94); }
.btn-acc { background: var(--accent); color: #06121f; }
.btn-soft { background: rgba(255, 255, 255, 0.1); color: #fff; }
.btn-red { background: #ef4444; color: #fff; }

.list-group {
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 22px;
  overflow: hidden;
  margin-bottom: 14px;
}
.list-row {
  padding: 13px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.list-row:last-child { border-bottom: 0; }

/* Calculator */
.calc-wrap {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding-bottom: 10px;
}
.calc-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.calc-btn {
  height: 64px;
  border-radius: 50%;
  border: 0;
  font-family: inherit;
  font-size: 22px;
  font-weight: 500;
  color: #fff;
  background: rgba(255, 255, 255, 0.11);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform 0.14s var(--spring), filter 0.12s;
}
.calc-btn:active { transform: scale(0.9); filter: brightness(1.25); }
.calc-btn.fn { background: rgba(255, 255, 255, 0.22); }
.calc-btn.op { background: var(--accent); color: #06121f; font-weight: 600; }

/* Phone */
.dial-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  max-width: 270px;
  margin: 0 auto;
}
.dial-btn {
  height: 68px;
  border-radius: 50%;
  border: 0;
  color: #fff;
  background: rgba(255, 255, 255, 0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.14s var(--spring);
}
.dial-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.2); }
.dial-btn b { font-size: 24px; font-weight: 400; line-height: 1; }
.dial-btn span { font-size: 9px; letter-spacing: 1.4px; color: var(--muted); margin-top: 2px; }

/* Messages */
.bubble {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 20px;
  font-size: 13.5px;
  line-height: 1.4;
  margin-bottom: 7px;
}
.bubble.me {
  margin-left: auto;
  background: var(--accent);
  color: #06121f;
  font-weight: 500;
  border-bottom-right-radius: 6px;
}
.bubble.them {
  margin-right: auto;
  background: rgba(255, 255, 255, 0.12);
  border-bottom-left-radius: 6px;
}

/* Focus Orb */
.breath-orb {
  width: 132px;
  height: 132px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 15px;
  font-weight: 600;
  border: 2px solid var(--accent);
  box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 32%, transparent);
  transition: transform 4s ease-in-out;
}
.breath-orb.inhale, .breath-orb.hold { transform: scale(1.45); }
.breath-orb.exhale { transform: scale(0.92); }

.swatch {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.3);
  cursor: pointer;
}
</style>
</head>

<div class="phone-wrap">
  <div class="side-btn vol-up"></div>
  <div class="side-btn vol-dn"></div>

  <div class="phone">

      <div class="wallpaper-layer" id="wallLayer"></div>

      <div class="island" id="island" onclick="handleIslandTap()">

        <span class="island-lens"></span>

          <span id="wifiIco"></span>

      </div>

      <!-- Control Center -->
      <div class="cc" id="cc">
        <div class="cc-top">
          <span style="font-size:17px; font-weight:600;">Control Center</span>
          <button class="glass-circle lg" id="ccClose" onclick="toggleCC()"></button>
        </div>

        <div class="cc-row">
          <div class="cc-pebbles lg lg-dark">
            <button class="pebble active" id="ccWifi" onclick="toggleNet(this, 'Wi-Fi')"></button>
            <button class="pebble active" id="ccBt" onclick="toggleNet(this, 'Bluetooth')"></button>
            <button class="pebble" id="ccPlane" onclick="toggleNet(this, 'Airplane')"></button>
            <button class="pebble" id="ccMute" onclick="toggleMute(this)"></button>
          </div>
          <div class="cc-media lg lg-dark" onclick="toggleMusicPlay()">
            <div style="font-size:11px; color:var(--muted);" id="ccTrackSub">Fmaj7 Pad</div>
            <div>
              <div style="font-size:14px; font-weight:600;" id="ccTrackName">Stillness</div>
              <div style="margin-top:8px;" id="ccPlayIco"></div>
            </div>
          </div>
        </div>

        <div class="cc-slider-card lg lg-dark">
          <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:600;">
            <span id="ccSunLbl" style="display:inline-flex; align-items:center; gap:6px;"></span>
            <span id="brightPct">100%</span>
          </div>
          <div class="bright-track">
            <div class="bright-fill" id="brightFill" style="width:78%"></div>
            <input type="range" min="45" max="115" value="100" id="brightRange" class="bright-input" oninput="setBrightness(this.value)">
          </div>
        </div>

        <button class="btn btn-soft" style="margin-top:auto;" onclick="toggleCC(); lockPhone();" id="ccLockBtn"></button>
      </div>

      <!-- Search Overlay -->
      <div class="search-overlay" id="searchOverlay" onclick="if(event.target === this) toggleSearch()">
        <input class="field" id="searchInp" placeholder="Search apps..." oninput="filterSearch(this.value)">
        <div class="grid" id="searchResults"></div>
      </div>

      <!-- Home Screen -->
      <div class="home-layer">
        <section class="home-main">
          <div class="widgets-row">
            <div class="widget-sq lg" onclick="openApp('weather')">
              <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                  <div class="w-city" id="hwCity">Berlin</div>
                  <div class="w-temp" id="hwTemp">18°</div>
                </div>
                <span id="hwIcon"></span>
              </div>
              <div>
                <div class="w-sub" id="hwCond">Clear</div>
                <div class="w-sub">H:20° L:12°</div>
              </div>
            </div>

            <div class="widget-sq lg" onclick="openApp('music')">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:11px; font-weight:600; color:var(--accent);">MUSIC</span>

              </div>
              <div>
                <div class="w-city" id="mwTitle">Stillness</div>

              </div>
            </div>
          </div>

        </section>

        <button class="search-pill lg" id="searchPill" onclick="toggleSearch()"></button>
        <div class="dock lg" id="dockGrid"></div>
      </div>

      <div class="nav" onclick="goHome()"><span></span></div>

      <div class="spotify-mount" id="spotifyMount"></div>

      <!-- App Panel -->
      <section class="panel" id="panel">
        <div class="app-header">

          <div class="glass-pill lg" id="appTitle">App</div>
          <div style="width:36px;" id="appRightSlot"></div>
        </div>
        <div class="app-scroll" id="appBody"></div>
        <div id="appBottomSlot"></div>
      </section>
    </main>
  </div>
</div>

let actx = null;
function getAudio() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

function tone(freq = 540, dur = 0.04) {
  if (!soundOn) return;
  try {
    const c = getAudio();
    const o = c.createOscillator();
    const g = c.createGain();
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.035, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g);
    g.connect(c.destination);
    o.start();
    o.stop(c.currentTime + dur);
  } catch {}
}

/* --- 3. Calculator --- */
let cExp = '', cPrev = '';
function rCalc(body) {
  const keys = [
    ['AC','fn'],['(','fn'],[')','fn'],['÷','op'],
    ['7',''],['8',''],['9',''],['×','op'],
    ['4',''],['5',''],['6',''],['−','op'],
    ['1',''],['2',''],['3',''],['+','op'],
    ['⌫',''],['0',''],['.',''],['=','op']
  ];
  body.innerHTML = `
    <div class="calc-wrap">
      <div id="cPrev" style="text-align:right; font-size:14px; color:var(--muted); min-height:20px; padding:0 8px; font-variant-numeric:tabular-nums;">${cPrev}</div>
      <div id="cDisp" style="font-family:var(--font-display); font-size:52px; font-weight:280; text-align:right; padding:4px 8px 18px; overflow-wrap:anywhere; font-variant-numeric:tabular-nums;">${cExp || '0'}</div>
      <div class="calc-grid">
        ${keys.map(k => `<button class="calc-btn ${k[1]}" onclick="cKey('${k[0]}')">${k[0] === '⌫' ? SVG.backsp : k[0]}</button>`).join('')}
      </div>
    </div>
  `;
}

function cKey(k) {
  tone(620, 0.03);
  const d = document.getElementById('cDisp'), p = document.getElementById('cPrev');
  if (!d) return;
  if (k === 'AC') { cExp = ''; cPrev = ''; p.textContent = ''; d.textContent = '0'; return; }
  if (k === '⌫') { cExp = cExp.slice(0, -1); d.textContent = cExp || '0'; return; }
  if (k === '=') {
    if (!cExp) return;
    try {
      const s = cExp.replaceAll('÷', '/').replaceAll('×', '*').replaceAll('−', '-');
      if (![...s].every(ch => '0123456789+-*/.() '.includes(ch))) throw 0;
      const r = Function('"use strict"; return (' + s + ')')();
      if (!Number.isFinite(r)) throw 0;
      cPrev = cExp;
      cExp = String(Number(r.toFixed(8)));
      p.textContent = cPrev;
      d.textContent = cExp;
    } catch {
      cExp = ''; p.textContent = ''; d.textContent = 'Error';
    }
    return;
  }
  const ops = ['÷', '×', '−', '+'];
  if (ops.includes(k) && ops.includes(cExp.slice(-1))) cExp = cExp.slice(0, -1) + k;
  else cExp += k;
  d.textContent = cExp;
}

/* --- 4. Clock --- */
let clkTab = 'sw', swMs = 0, swInt = null, swLaps = [], tmTot = 300, tmLeft = 300, tmInt = null;
const fSw = ms => {
  const s = Math.floor(ms / 1000);
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}.${Math.floor((ms % 1000) / 100)}`;
};

function rClock(body) {
  document.getElementById('appBottomSlot').innerHTML = `
    <div class="floating-bar lg lg-dark" style="justify-content:space-around;">
      <button class="btn ${clkTab === 'sw' ? 'btn-acc' : 'btn-soft'}" style="flex:1; background:${clkTab === 'sw' ? 'var(--accent)' : 'transparent'}" onclick="clkTab='sw'; rClock(document.getElementById('appBody'))">Stopwatch</button>
      <button class="btn ${clkTab === 'tm' ? 'btn-acc' : 'btn-soft'}" style="flex:1; background:${clkTab === 'tm' ? 'var(--accent)' : 'transparent'}" onclick="clkTab='tm'; rClock(document.getElementById('appBody'))">Timer</button>
    </div>
  `;

  if (clkTab === 'sw') {
    body.innerHTML = `
      <div style="text-align:center; padding:34px 0 24px;">
        <div id="swTxt" style="font-family:var(--font-display); font-size:56px; font-weight:260; font-variant-numeric:tabular-nums;">${fSw(swMs)}</div>
        <div style="display:flex; justify-content:center; gap:12px; margin-top:22px;">
          <button class="btn btn-acc" onclick="toggleSw()">${swInt ? 'Pause' : 'Start'}</button>
          <button class="btn btn-soft" onclick="lapSw()">Lap</button>
          <button class="btn btn-soft" onclick="resetSw()">Reset</button>
        </div>
      </div>
      <div class="list-group" style="${swLaps.length ? '' : 'display:none'}">
        ${swLaps.map((l, i) => `
          <div class="list-row">
            <span style="color:var(--muted); font-size:13px;">Lap ${swLaps.length - i}</span>
            <strong style="font-variant-numeric:tabular-nums;">${l}</strong>
          </div>
        `).join('')}
      </div>
    `;
  } else {
    const r = 72, c = 2 * Math.PI * r, off = c * (1 - tmLeft / Math.max(1, tmTot));
    const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    body.innerHTML = `
      <div style="text-align:center; padding:24px 0;">
        <div style="position:relative; width:168px; height:168px; margin:0 auto 20px; display:grid; place-items:center;">
          <svg width="168" height="168" style="position:absolute; transform:rotate(-90deg);">
            <circle cx="84" cy="84" r="${r}" stroke="rgba(255,255,255,0.1)" stroke-width="6" fill="none"/>
            <circle id="tmRing" cx="84" cy="84" r="${r}" stroke="var(--accent)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
          </svg>
          <div id="tmTxt" style="font-family:var(--font-display); font-size:38px; font-weight:300; font-variant-numeric:tabular-nums;">${fmt(tmLeft)}</div>
        </div>
        <div style="display:flex; justify-content:center; gap:8px; margin-bottom:18px;">
          ${[60, 180, 300, 600].map(s => `<button class="btn ${tmTot === s ? 'btn-acc' : 'btn-soft'}" style="padding:7px 13px; font-size:12px;" onclick="setTm(${s})">${s / 60}m</button>`).join('')}
        </div>
        <div style="display:flex; justify-content:center; gap:12px;">
          <button class="btn btn-acc" onclick="toggleTm()">${tmInt ? 'Pause' : 'Start'}</button>
          <button class="btn btn-soft" onclick="setTm(${tmTot})">Reset</button>
        </div>
      </div>
    `;
  }
}

function toggleSw() {
  if (swInt) { clearInterval(swInt); swInt = null; }
  else {
    const st = Date.now() - swMs;
    swInt = setInterval(() => {
      swMs = Date.now() - st;
      const e = document.getElementById('swTxt');
      if (e) e.textContent = fSw(swMs);
    }, 100);
  }
  if (activeApp === 'clock') rClock(document.getElementById('appBody'));
}
function lapSw() { if (!swMs) return; swLaps.unshift(fSw(swMs)); rClock(document.getElementById('appBody')); }
function resetSw() { clearInterval(swInt); swInt = null; swMs = 0; swLaps = []; rClock(document.getElementById('appBody')); }
function setTm(s) { clearInterval(tmInt); tmInt = null; tmTot = s; tmLeft = s; rClock(document.getElementById('appBody')); }
function toggleTm() {
  if (tmInt) { clearInterval(tmInt); tmInt = null; }
  else {
    if (tmLeft <= 0) tmLeft = tmTot;
    tmInt = setInterval(() => {
      tmLeft--;
      const e = document.getElementById('tmTxt'), rg = document.getElementById('tmRing');
      if (e) e.textContent = `${String(Math.floor(tmLeft / 60)).padStart(2, '0')}:${String(tmLeft % 60).padStart(2, '0')}`;
      if (rg) rg.style.strokeDashoffset = (2 * Math.PI * 72) * (1 - tmLeft / tmTot);
      if (tmLeft <= 0) {
        clearInterval(tmInt); tmInt = null;
        tone(880, 0.22);
        showToast('Timer done');
        if (activeApp === 'clock') rClock(document.getElementById('appBody'));
      }
    }, 1000);
  }
  if (activeApp === 'clock') rClock(document.getElementById('appBody'));
}

function switchMusicTab(tab) {
  musicTab = tab;
  if (tab === 'spotify' && music.playing) {
    stopMusic();
    music.playing = false;
  }
  rMusic(document.getElementById('appBody'));
}

function toggleMusicPlay(fi = null) {
  if (fi !== null && fi !== music.i) {
    stopMusic();
    music.i = fi;
    music.playing = false;
  }
  if (music.playing) {
    stopMusic();
    music.playing = false;
  } else {
    startMusic(TRACKS[music.i].f);
    music.playing = true;
  }
  const t = TRACKS[music.i];
  document.getElementById('mwTitle').textContent = t.n;
  document.getElementById('mwSub').textContent = music.playing ? 'Playing' : 'Ambient · Spotify';
  document.getElementById('mwIcon').innerHTML = music.playing ? SVG.pause : SVG.play;
  document.getElementById('ccTrackName').textContent = t.n;
  document.getElementById('ccTrackSub').textContent = t.s;
  document.getElementById('ccPlayIco').innerHTML = music.playing ? SVG.pause : SVG.play;
  const isl = document.getElementById('island');
  isl.classList.toggle('playing', music.playing);
  isl.classList.toggle('expanded', music.playing || inCall);
  if (activeApp === 'music' && musicTab === 'ambient') rMusic(document.getElementById('appBody'));
}

function startMusic(fs) {
  try {
    const c = getAudio(), m = c.createGain(), fl = c.createBiquadFilter();
    fl.type = 'lowpass';
    fl.frequency.value = 600;
    m.gain.setValueAtTime(0.0001, c.currentTime);
    m.gain.linearRampToValueAtTime(0.08, c.currentTime + 1);
    fl.connect(m);
    m.connect(c.destination);
    music.nodes = fs.map((f, idx) => {
      const o = c.createOscillator();
      o.type = idx % 2 === 0 ? 'sine' : 'triangle';
      o.frequency.value = f;
      o.detune.value = (idx - 1) * 4;
      o.connect(fl);
      o.start();
      return o;
    });
    music.m = m;
  } catch {}
}

function stopMusic() {
  try {
    const c = getAudio();
    if (music.m) music.m.gain.linearRampToValueAtTime(0.0001, c.currentTime + 0.3);
    const old = music.nodes;
    setTimeout(() => old.forEach(o => { try { o.stop(); } catch {} }), 340);
  } catch {}
  music.nodes = [];
}

function rMusic(body) {

  mount.classList.remove('visible');
  const t = TRACKS[music.i];
  body.innerHTML = `

      <div class="lg" style="width:124px; height:124px; border-radius:28px; margin:0 auto 14px; display:grid; place-items:center; background:linear-gradient(145deg, rgba(251,113,133,0.45), rgba(190,18,60,0.35));">

      ${TRACKS.map((x, idx) => `
        <div class="list-row" style="cursor:pointer; ${music.i === idx ? 'background:rgba(255,255,255,0.08);' : ''}" onclick="toggleMusicPlay(${idx})">
          <div>
            <div style="font-size:14px; font-weight:600;">${x.n}</div>
            <div style="font-size:11.5px; color:var(--muted);">${x.s}</div>

let skCol = '#f8fafc';
function rSketch(body) {
  const cols = ['#f8fafc', '#7dd3fc', '#b7f36b', '#fb7185'];
  body.innerHTML = `<canvas id="skC" style="width:100%; height:390px; background:#070a10; border-radius:24px; border:1px solid rgba(255,255,255,0.1); touch-action:none; display:block; cursor:crosshair;"></canvas>`;
  document.getElementById('appBottomSlot').innerHTML = `
    <div class="floating-bar lg lg-dark" style="justify-content:space-between; padding:8px 12px;">
      <div style="display:flex; gap:8px;">
        ${cols.map(c => `<button class="swatch" style="width:26px; height:26px; background:${c}" onclick="skCol='${c}'"></button>`).join('')}
      </div>
      <div style="display:flex; gap:6px;">
        <button class="btn btn-soft" style="padding:7px 12px; font-size:12px;" onclick="clrSk()">Clear</button>
        <button class="btn btn-acc" style="padding:7px 12px; font-size:12px;" onclick="savSk()">Save</button>
      </div>
    </div>
  `;
  const c = document.getElementById('skC'), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = Math.max(300, r.width) * dpr;
  c.height = 390 * dpr;
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3.2;
  let dr = false;
  const p = e => { const b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  c.onpointerdown = e => { dr = true; c.setPointerCapture(e.pointerId); const pt = p(e); ctx.strokeStyle = skCol; ctx.beginPath(); ctx.moveTo(pt.x, pt.y); };
  c.onpointermove = e => { if (!dr) return; const pt = p(e); ctx.lineTo(pt.x, pt.y); ctx.stroke(); };
  c.onpointerup = () => { dr = false; };
}
function clrSk() { const c = document.getElementById('skC'); if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height); }
function savSk() {
  const c = document.getElementById('skC'); if (!c) return;
  const l = JSON.parse(localStorage.getItem('sky26-sk') || '[]');
  l.unshift({ id: Date.now(), img: c.toDataURL('image/png') });
  localStorage.setItem('sky26-sk', JSON.stringify(l.slice(0, 8)));
  showToast('Saved');
}

let dial = '', callMuted = false, callSec = 0, callTimer = null;
const DTMF = { '1':697,'2':730,'3':770,'4':800,'5':852,'6':890,'7':941,'8':980,'9':1020,'*':580,'0':640,'#':710 };

function rPhone(body) {
  endCall();
  const pad = [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
  body.innerHTML = `

      <div class="dial-grid">
        ${pad.map(k => `<button class="dial-btn" onclick="dPress('${k[0]}')"><b>${k[0]}</b><span>${k[1]}</span></button>`).join('')}
      </div>
      <div style="display:flex; justify-content:center; align-items:center; gap:22px; margin-top:20px;">
        <div style="width:44px;"></div>

        <button class="glass-circle" style="width:44px; height:44px; background:transparent;" onclick="dBack()">${SVG.backsp}</button>
      </div>
    </div>
  `;
}
function dPress(k) { tone(DTMF[k] || 600, 0.06); if (dial.length < 14) dial += k; document.getElementById('dTxt').textContent = dial; }
function dBack() { dial = dial.slice(0, -1); document.getElementById('dTxt').textContent = dial || ' '; }
function doCall() {
  if (!dial) return;
  inCall = true; callMuted = false; callSec = 0;
  const isl = document.getElementById('island');
  isl.classList.add('calling', 'expanded');
  clearInterval(callTimer);
  callTimer = setInterval(() => {
    callSec++;
    const ct = document.getElementById('callTimer');
    if (ct) ct.textContent = `${String(Math.floor(callSec / 60)).padStart(2, '0')}:${String(callSec % 60).padStart(2, '0')}`;
  }, 1000);
  rCallScreen();
}
function rCallScreen() {
  document.getElementById('appBody').innerHTML = `
    <div style="text-align:center; padding:54px 0;">
      <div style="font-size:28px; font-weight:500;">${dial}</div>
      <div id="callTimer" style="font-size:13px; color:var(--accent); margin-top:6px; font-variant-numeric:tabular-nums;">00:00</div>
      <div style="display:flex; justify-content:center; gap:22px; margin-top:140px;">
        <button class="glass-circle lg" style="width:60px; height:60px; ${callMuted ? 'background:#fff; color:#000;' : ''}" onclick="callMuted=!callMuted; rCallScreen();">${SVG.volOff}</button>
        <button class="glass-circle btn-red" style="width:60px; height:60px;" onclick="rPhone(document.getElementById('appBody'))">${SVG.close}</button>
      </div>
    </div>
  `;
}
function endCall() {
  inCall = false;
  clearInterval(callTimer);
  const isl = document.getElementById('island');
  isl.classList.remove('calling');
  isl.classList.toggle('expanded', music.playing);
}

    <div class="floating-bar lg lg-dark">
      <input id="mIn" placeholder="iMessage" style="flex:1; background:transparent; border:0; color:#fff; padding:8px 14px; font-family:inherit; font-size:13.5px; outline:none;" onkeydown="if(event.key==='Enter') sendM()">
      <button class="glass-circle btn-acc" onclick="sendM()">${SVG.send}</button>
    </div>
  `;
}
function sendM() {
  const v = document.getElementById('mIn').value.trim();
  if (!v) return;
  const ms = getMsgs();
  ms.push({ f: 'me', t: v });
  const rp = ['Noted.', 'Looks clean.', 'Done.', 'Copy that.'];
  ms.push({ f: 'them', t: rp[ms.length % rp.length] });
  localStorage.setItem('sky26-msgs', JSON.stringify(ms));
  rMsg(document.getElementById('appBody'));
}

/* --- 13. Settings & About --- */
function rSettings(body) {
  const cols = ['#7dd3fc', '#b7f36b', '#f472b6', '#fb923c', '#a78bfa', '#f8fafc'];
  body.innerHTML = `
    <div class="list-group">
      <div class="list-row">
        <span style="font-size:13.5px; font-weight:500;">Icons</span>
        <div style="display:flex; gap:6px;">
          ${['clear', 'tinted', 'color'].map(m => `<button class="btn ${iconMode === m ? 'btn-acc' : 'btn-soft'}" style="padding:6px 11px; font-size:11.5px; text-transform:capitalize;" onclick="setIconMode('${m}'); rSettings(document.getElementById('appBody'))">${m}</button>`).join('')}
        </div>
      </div>
      <div class="list-row">
        <span style="font-size:13.5px; font-weight:500;">Tint</span>
        <div style="display:flex; gap:7px;">
          ${cols.map(c => `<button class="swatch" style="width:24px; height:24px; background:${c}" onclick="setAccent('${c}')"></button>`).join('')}
        </div>
      </div>
    </div>

    <div class="list-group">
      <div class="list-row" style="flex-direction:column; align-items:stretch; gap:10px;">
        <span style="font-size:13.5px; font-weight:500;">Wallpaper</span>
        <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;">
          ${WALLS.map((w, i) => `
            <div onclick="setWallpaper(${i}); rSettings(document.getElementById('appBody'))" style="height:58px; border-radius:12px; overflow:hidden; cursor:pointer; border:2px solid ${wallIdx === i ? 'var(--accent)' : 'rgba(255,255,255,0.15)'}">
              ${w.svg}
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="list-group">
      <div class="list-row">
        <span style="font-size:13.5px; font-weight:500;">System</span>
        <button class="btn btn-red" style="padding:7px 14px; font-size:12px;" onclick="localStorage.clear(); location.reload();">Reset</button>
      </div>
    </div>
  `;
}

function setAccent(c) {
  document.documentElement.style.setProperty('--accent', c);
  localStorage.setItem('sky26-acc', c);
  showToast('Tint updated');
}

function rAbout(body) {
  body.innerHTML = `
    <div style="text-align:center; padding:24px 0;">
      <div class="lg" style="width:72px; height:72px; border-radius:22px; margin:0 auto 14px; display:grid; place-items:center;">${SVG.appAbout}</div>
      <div style="font-size:22px; font-weight:600;">SkyOS 26</div>
      <div style="font-size:12.5px; color:var(--muted);">Liquid Glass Build</div>
    </div>
    <div class="list-group">
      <div class="list-row"><span style="color:var(--muted); font-size:13px;">Material</span><strong>Liquid Glass</strong></div>
      <div class="list-row"><span style="color:var(--muted); font-size:13px;">Typeface</span><strong>Google Sans</strong></div>
      <div class="list-row"><span style="color:var(--muted); font-size:13px;">Display</span><strong>${window.innerWidth} × ${window.innerHeight}</strong></div>
    </div>
  `;
}

document.addEventListener('keydown', e => {
  if (activeApp !== 'calculator') return;
  const m = { '/': '÷', '*': '×', '-': '−', '+': '+', 'Enter': '=', 'Backspace': '⌫', 'Escape': 'AC' };
  if ('0123456789.()'.includes(e.key)) cKey(e.key);
  else if (m[e.key]) { e.preventDefault(); cKey(m[e.key]); }
});

init();
</script>
</body>
</html>
