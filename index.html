<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SkyOS 26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,200..800&family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#7dd3fc;--text:#f8fafc;--muted:rgba(241,245,249,0.62);--spring:cubic-bezier(0.32,0.72,0,1);--brightness:1;--glass-blur:26px;--glass-a1:0.22;--glass-a2:0.06;--font-ui:"Google Sans","Google Sans Flex",system-ui,-apple-system,sans-serif;--font-display:"Google Sans Flex","Google Sans",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 0%,#151b26 0%,#05070b 72%);font-family:var(--font-ui);color:var(--text);-webkit-font-smoothing:antialiased}
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{transition-duration:0.01ms !important;animation-duration:0.01ms !important}
.phone-wrap{position:relative}
.side-btn{position:absolute;background:linear-gradient(180deg,#5f6775,#2b303a);pointer-events:none}
.vol-up{left:-4px;top:148px;width:3px;height:42px;border-radius:3px 0 0 3px}
.vol-dn{left:-4px;top:200px;width:3px;height:42px;border-radius:3px 0 0 3px}
.pwr-btn{position:absolute;right:-5px;top:172px;width:4px;height:68px;border-radius:0 4px 4px 0;border:0;background:linear-gradient(180deg,#677080,#303642);cursor:pointer}
.phone{width:min(390px,95vw);height:min(830px,94vh);min-height:630px;border-radius:52px;padding:7px;background:#0a0c10;border:2.5px solid #424956;box-shadow:0 40px 100px rgba(0,0,0,0.82),0 0 0 1px rgba(255,255,255,0.14),inset 0 0 0 2px #020305;overflow:hidden}
.screen{height:100%;border-radius:44px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#0b1220;filter:brightness(var(--brightness));user-select:none}
@media(max-width:480px){body{padding:0;background:#070a10}.phone-wrap{width:100%;height:100dvh}.side-btn,.pwr-btn{display:none}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}}
.wallpaper-layer{position:absolute;inset:0;z-index:0}
.wallpaper-layer svg{width:100%;height:100%;display:block}
.lg{position:relative;background:linear-gradient(145deg,rgba(255,255,255,var(--glass-a1)) 0%,rgba(255,255,255,var(--glass-a2)) 52%,rgba(255,255,255,0.14) 100%);backdrop-filter:blur(var(--glass-blur)) saturate(195%) brightness(1.06);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(195%) brightness(1.06);box-shadow:0 12px 32px rgba(0,0,0,0.22),inset 0 1px 0 rgba(255,255,255,0.44),inset 0 -1px 0 rgba(255,255,255,0.1)}
.lg::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,0.72) 0%,rgba(255,255,255,0.1) 36%,rgba(255,255,255,0.04) 64%,rgba(255,255,255,0.4) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.lg-dark{background:linear-gradient(145deg,rgba(22,28,40,0.62) 0%,rgba(10,14,22,0.48) 55%,rgba(26,32,46,0.52) 100%)}
.status{position:relative;z-index:35;height:44px;padding:14px 26px 0;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:98px;height:26px;background:#030406;border-radius:20px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;z-index:36;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,0.55),inset 0 0 0 0.5px rgba(255,255,255,0.12);transition:width 0.34s var(--spring)}
.island.expanded{width:146px}
.island-wave{display:none;align-items:center;gap:2px;height:12px}
.island.playing .island-wave{display:flex}
.island-wave span{width:2px;height:4px;border-radius:2px;background:var(--accent);animation:eq 0.85s ease-in-out infinite alternate}
.island-wave span:nth-child(2){animation-delay:0.2s}.island-wave span:nth-child(3){animation-delay:0.45s}
@keyframes eq{from{height:3px;opacity:0.6}to{height:11px;opacity:1}}
.island-dot{display:none;width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
.island.calling .island-dot{display:block}.island.calling .island-wave{display:none}
.island-timer{display:none;font-size:11px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.island.timer-on .island-timer{display:block}
.island-lens{width:9px;height:9px;border-radius:50%;margin-left:auto;background:radial-gradient(circle at 35% 35%,#3b82f6 0%,#0f172a 55%,#030712 100%)}
.status-icons{display:flex;align-items:center;gap:7px}
.low-power #battIco{color:#fbbf24}
.home-layer{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:scale(1.06);pointer-events:none;will-change:transform,opacity;transition:transform 0.42s var(--spring),opacity 0.28s ease}
.screen.unlocked .home-layer{opacity:1;transform:scale(1);pointer-events:auto}
.screen.unlocked.app-open .home-layer,.screen.unlocked.recents-open .home-layer{transform:scale(0.92);opacity:0;pointer-events:none}
.pages{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;padding:12px 18px 4px;display:flex;flex-direction:column;gap:15px;overflow-y:auto;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.widgets-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hide-widgets .widgets-row{display:none}
.widget-sq{border-radius:24px;padding:14px;height:122px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform 0.2s var(--spring)}
.widget-sq:active{transform:scale(0.96)}
.w-temp{font-family:var(--font-display);font-size:36px;font-weight:300;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.w-city{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-sub{font-size:11px;color:rgba(255,255,255,0.74);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px 10px}
.app{border:0;background:none;color:var(--text);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:500;cursor:pointer;padding:0;text-shadow:0 1px 4px rgba(0,0,0,0.35);transition:transform 0.18s var(--spring)}
.app:active{transform:scale(0.86)}.app:hover .icon{transform:translateY(-2px)}
.hide-labels .app>span:last-child{display:none}
.icon{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;position:relative;overflow:hidden;transition:transform 0.2s var(--spring)}
.mode-clear .icon{background:linear-gradient(145deg,rgba(255,255,255,0.28) 0%,rgba(255,255,255,0.08) 52%,rgba(255,255,255,0.18) 100%);backdrop-filter:blur(22px) saturate(185%);-webkit-backdrop-filter:blur(22px) saturate(185%);box-shadow:0 10px 22px rgba(0,0,0,0.22),inset 0 1px 0 rgba(255,255,255,0.48);color:#fff}
.mode-clear .icon::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,0.72) 0%,rgba(255,255,255,0.1) 40%,rgba(255,255,255,0.4) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.mode-tinted .icon{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 34%,rgba(255,255,255,0.18)),rgba(15,23,42,0.28));backdrop-filter:blur(22px) saturate(185%);-webkit-backdrop-filter:blur(22px) saturate(185%);box-shadow:0 10px 22px rgba(0,0,0,0.24),inset 0 1px 0 rgba(255,255,255,0.45);color:var(--accent)}
.mode-tinted .icon::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,0.65),rgba(255,255,255,0.08) 45%,var(--accent));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.mode-color .icon{box-shadow:0 10px 22px rgba(0,0,0,0.28),inset 0 1px 0 rgba(255,255,255,0.34);color:#fff}
.mode-color .ico-notes{background:linear-gradient(145deg,#fbbf24,#d97706)}.mode-color .ico-tasks{background:linear-gradient(145deg,#4ade80,#16a34a)}.mode-color .ico-calc{background:linear-gradient(145deg,#475569,#1e293b)}.mode-color .ico-clock{background:linear-gradient(145deg,#818cf8,#4f46e5)}.mode-color .ico-weather{background:linear-gradient(145deg,#38bdf8,#2563eb)}.mode-color .ico-music{background:linear-gradient(145deg,#fb7185,#e11d48)}.mode-color .ico-focus{background:linear-gradient(145deg,#2dd4bf,#0d9488)}.mode-color .ico-sketch{background:linear-gradient(145deg,#c084fc,#9333ea)}.mode-color .ico-gallery{background:linear-gradient(145deg,#60a5fa,#6366f1)}.mode-color .ico-calendar{background:linear-gradient(145deg,#f87171,#dc2626)}.mode-color .ico-files{background:linear-gradient(145deg,#38bdf8,#0369a1)}.mode-color .ico-camera{background:linear-gradient(145deg,#64748b,#0f172a)}.mode-color .ico-voice{background:linear-gradient(145deg,#f43f5e,#9f1239)}.mode-color .ico-g2048{background:linear-gradient(145deg,#eab308,#a16207)}.mode-color .ico-synth{background:linear-gradient(145deg,#ec4899,#831843)}.mode-color .ico-compass{background:linear-gradient(145deg,#fb923c,#c2410c)}.mode-color .ico-convert{background:linear-gradient(145deg,#f59e0b,#b45309)}.mode-color .ico-maps{background:linear-gradient(145deg,#34d399,#0284c7)}.mode-color .ico-palette{background:linear-gradient(145deg,#a855f7,#4c1d95)}.mode-color .ico-monitor{background:linear-gradient(145deg,#10b981,#065f46)}.mode-color .ico-browser{background:linear-gradient(145deg,#22d3ee,#0284c7)}.mode-color .ico-terminal{background:linear-gradient(145deg,#334155,#090d16)}.mode-color .ico-settings{background:linear-gradient(145deg,#64748b,#334155)}.mode-color .ico-about{background:linear-gradient(145deg,#38bdf8,#0369a1)}.mode-color .ico-phone{background:linear-gradient(145deg,#34d399,#059669)}.mode-color .ico-messages{background:linear-gradient(145deg,#38bdf8,#0284c7)}
.home-footer-controls{display:flex;flex-direction:column;align-items:center;gap:7px;padding-bottom:7px}
.page-dots{display:flex;gap:6px}
.page-dot{width:6px;height:6px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,0.34);cursor:pointer;transition:width 0.22s var(--spring),background 0.2s}
.page-dot.active{width:16px;border-radius:4px;background:#fff}
.search-pill{padding:5px 13px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:rgba(255,255,255,0.92);border:0;cursor:pointer;transition:transform 0.16s var(--spring)}
.search-pill:active{transform:scale(0.94)}
.dock{margin:0 14px 6px;padding:10px 14px;border-radius:28px;display:flex;justify-content:space-around}
.dock .icon{width:50px;height:50px;border-radius:15px}
.nav{position:relative;z-index:32;height:20px;display:grid;place-items:center;cursor:pointer}
.nav span{width:118px;height:4.5px;border-radius:9px;background:rgba(255,255,255,0.86);transition:width 0.2s var(--spring)}
.nav:active span{width:92px}
.lockscreen{position:absolute;inset:0;z-index:30;background:linear-gradient(180deg,rgba(6,10,18,0.12) 0%,rgba(6,10,18,0.38) 100%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:64px 24px 30px;cursor:pointer;will-change:transform,opacity;transition:transform 0.44s var(--spring),opacity 0.28s ease}
.lockscreen.unlocked{transform:translateY(-100%);opacity:0;pointer-events:none}
.lock-top{text-align:center}
.lock-badge{width:30px;height:30px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,0.9)}
.lock-date{font-size:15px;font-weight:600;color:rgba(255,255,255,0.88);text-shadow:0 2px 12px rgba(0,0,0,0.25)}
.lock-clock{font-family:var(--font-display);font-size:86px;font-weight:260;letter-spacing:-3.5px;line-height:0.96;margin-top:6px;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,rgba(255,255,255,0.96) 0%,rgba(255,255,255,0.56) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 22px rgba(0,0,0,0.22))}
.lock-cue{font-size:11.5px;font-weight:500;color:rgba(255,255,255,0.76);margin-top:14px}
.lock-media{width:100%;max-width:300px;border-radius:22px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;gap:10px}
.lock-media.show{display:flex}
.lock-bottom{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 10px 6px}
.lock-btn{width:48px;height:48px;border-radius:50%;border:0;color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform 0.16s var(--spring)}
.lock-btn:active{transform:scale(0.9)}
.torch-overlay{position:absolute;inset:0;z-index:45;background:radial-gradient(circle at 50% 40%,#fff 0%,#fef3c7 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:44px;opacity:0;pointer-events:none;transition:opacity 0.2s ease;cursor:pointer}
.torch-overlay.on{opacity:1;pointer-events:auto}
.cc{position:absolute;inset:0;z-index:28;padding:58px 20px 26px;background:rgba(8,12,20,0.48);backdrop-filter:blur(36px) saturate(180%);-webkit-backdrop-filter:blur(36px) saturate(180%);display:flex;flex-direction:column;gap:12px;will-change:transform,opacity;transform:translateY(-100%);opacity:0;pointer-events:none;transition:transform 0.36s var(--spring),opacity 0.24s ease}
.cc.open{transform:translateY(0);opacity:1;pointer-events:auto}
.cc-top{display:flex;justify-content:space-between;align-items:center}
.cc-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc-pebbles{border-radius:26px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pebble{height:50px;width:50px;border-radius:50%;margin:auto;border:0;color:#fff;background:rgba(255,255,255,0.14);display:grid;place-items:center;cursor:pointer;transition:all 0.2s var(--spring)}
.pebble:active{transform:scale(0.9)}.pebble.active{background:var(--accent);color:#06121f;box-shadow:0 0 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.cc-media{border-radius:26px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.cc-actions-bar{border-radius:24px;padding:10px 14px;display:flex;justify-content:space-around}
.cc-sliders{border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.bright-track{position:relative;height:38px;border-radius:14px;background:rgba(255,255,255,0.12);overflow:hidden;margin-top:6px}
.bright-fill{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,0.88);border-radius:14px;pointer-events:none}
.bright-input{position:relative;z-index:2;width:100%;height:100%;margin:0;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
.bright-input::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:24px;background:transparent}
.recents{position:absolute;inset:0;z-index:27;background:rgba(6,10,17,0.56);backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%);padding:62px 20px 32px;display:flex;flex-direction:column;gap:14px;opacity:0;pointer-events:none;transform:scale(1.06);transition:opacity 0.24s ease,transform 0.3s var(--spring)}
.recents.open{opacity:1;pointer-events:auto;transform:scale(1)}
.recents-deck{flex:1;display:flex;gap:14px;overflow-x:auto;align-items:center;scroll-snap-type:x mandatory;scrollbar-width:none}
.recents-deck::-webkit-scrollbar{display:none}
.recent-card{flex:0 0 210px;height:330px;border-radius:28px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:center;cursor:pointer}
.search-overlay{position:absolute;inset:0;z-index:26;background:rgba(8,12,20,0.52);backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);padding:64px 20px 24px;display:flex;flex-direction:column;gap:16px;opacity:0;pointer-events:none;transform:scale(1.04);transition:opacity 0.22s ease,transform 0.28s var(--spring)}
.search-overlay.open{opacity:1;pointer-events:auto;transform:scale(1)}
.panel{position:absolute;inset:0;z-index:20;background:rgba(7,10,17,0.8);backdrop-filter:blur(38px) saturate(160%);-webkit-backdrop-filter:blur(38px) saturate(160%);display:flex;flex-direction:column;opacity:0;pointer-events:none;will-change:transform,opacity;transform:translateY(28px) scale(0.93);transition:opacity 0.2s ease,transform 0.34s var(--spring);user-select:text}
.panel.show{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.app-header{position:absolute;top:46px;left:16px;right:16px;z-index:5;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.app-header>*{pointer-events:auto}
.glass-pill{border:0;border-radius:999px;padding:7px 15px;color:#fff;font-family:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.glass-circle{width:36px;height:36px;border-radius:50%;border:0;color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform 0.16s var(--spring)}
.glass-circle:active{transform:scale(0.9)}
.app-scroll{flex:1;overflow-y:auto;padding:96px 18px 88px;scrollbar-width:none}
.app-scroll::-webkit-scrollbar{display:none}
.floating-bar{position:absolute;left:18px;right:18px;bottom:26px;z-index:5;border-radius:999px;padding:5px;display:flex;align-items:center;gap:5px}
.spotify-mount{position:fixed;left:-9999px;top:0;width:336px;height:410px;opacity:0;pointer-events:none}
.spotify-mount.visible{position:absolute;left:18px;right:18px;top:96px;bottom:90px;width:auto;height:auto;z-index:22;opacity:1;pointer-events:auto;display:flex;flex-direction:column;gap:10px}
.toast{position:absolute;top:48px;left:50%;transform:translateX(-50%) translateY(-12px);padding:7px 15px;border-radius:999px;font-size:12px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:all 0.24s var(--spring)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.field{width:100%;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);border-radius:16px;padding:11px 14px;color:#fff;font-family:inherit;font-size:14px;outline:none}
.field:focus{border-color:var(--accent)}
.btn{border:0;border-radius:999px;padding:10px 16px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform 0.15s var(--spring),background 0.2s}
.btn:active{transform:scale(0.94)}
.btn-acc{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 44%,rgba(255,255,255,0.18)),color-mix(in srgb,var(--accent) 26%,rgba(15,23,42,0.45)));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,0.42),0 8px 20px rgba(0,0,0,0.25);border:1px solid color-mix(in srgb,var(--accent) 55%,rgba(255,255,255,0.2))}
.btn-soft{background:rgba(255,255,255,0.1);color:#fff}
.btn-red{background:rgba(239,68,68,0.85);color:#fff}
.list-group{background:rgba(255,255,255,0.055);border:1px solid rgba(255,255,255,0.08);border-radius:22px;overflow:hidden;margin-bottom:14px}
.list-row{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.06)}
.list-row:last-child{border-bottom:0}
.sec-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin:6px 0 8px 6px}
.toggle{width:46px;height:27px;border-radius:999px;border:0;padding:3px;background:rgba(255,255,255,0.16);cursor:pointer;display:flex;align-items:center;transition:background 0.2s;flex-shrink:0}
.toggle span{width:21px;height:21px;border-radius:50%;background:#fff;transition:transform 0.22s var(--spring)}
.toggle.on{background:color-mix(in srgb,var(--accent) 70%,#22c55e)}.toggle.on span{transform:translateX(19px)}
.seek-bar{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:999px;background:rgba(255,255,255,0.16);outline:none;cursor:pointer}
.seek-bar::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(0,0,0,0.4)}
.calc-wrap{height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:10px}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.calc-btn{height:62px;border-radius:50%;border:0;font-family:inherit;font-size:22px;font-weight:500;color:#fff;background:rgba(255,255,255,0.11);display:grid;place-items:center;cursor:pointer;transition:transform 0.14s var(--spring),filter 0.12s}
.calc-btn:active{transform:scale(0.9);filter:brightness(1.25)}.calc-btn.fn{background:rgba(255,255,255,0.22)}.calc-btn.op{background:color-mix(in srgb,var(--accent) 40%,rgba(255,255,255,0.12));color:#fff;font-weight:600;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.dial-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:260px;margin:0 auto}
.dial-btn{height:64px;border-radius:50%;border:0;color:#fff;background:rgba(255,255,255,0.1);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.14s var(--spring)}
.dial-btn:active{transform:scale(0.9);background:rgba(255,255,255,0.2)}.dial-btn b{font-size:23px;font-weight:400;line-height:1}.dial-btn span{font-size:9px;letter-spacing:1.4px;color:var(--muted);margin-top:2px}
.bubble{max-width:80%;padding:10px 14px;border-radius:20px;font-size:13.5px;line-height:1.4;margin-bottom:7px}
.bubble.me{margin-left:auto;background:color-mix(in srgb,var(--accent) 36%,rgba(255,255,255,0.14));border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);color:#fff;font-weight:500;border-bottom-right-radius:6px}
.bubble.them{margin-right:auto;background:rgba(255,255,255,0.12);border-bottom-left-radius:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-day{aspect-ratio:1;border-radius:50%;border:0;background:transparent;color:#fff;font-family:inherit;font-size:13px;cursor:pointer;position:relative;display:grid;place-items:center}
.cal-day.today{background:color-mix(in srgb,var(--accent) 45%,rgba(255,255,255,0.12));font-weight:700}.cal-day.sel{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.g2048-board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;border-radius:22px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);touch-action:none}
.g2048-cell{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-family:var(--font-display);font-size:22px;font-weight:700;background:rgba(255,255,255,0.05);transition:transform 0.12s var(--spring)}
.synth-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.synth-pad{aspect-ratio:1;border-radius:22px;border:0;color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform 0.1s,filter 0.1s}
.synth-pad:active,.synth-pad.hit{transform:scale(0.92);filter:brightness(1.4)}
.compass-dial{width:210px;height:210px;border-radius:50%;margin:12px auto 18px;position:relative;display:grid;place-items:center}
.compass-rose{position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(255,255,255,0.25);transition:transform 0.15s ease-out}
.level-bubble{width:24px;height:24px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);transition:transform 0.12s ease-out}
.term-box{background:rgba(5,7,11,0.85);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55;min-height:360px;white-space:pre-wrap;color:#d1d5db}
.breath-orb{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;border:2px solid var(--accent);box-shadow:0 0 40px color-mix(in srgb,var(--accent) 32%,transparent);transition:transform 4s ease-in-out}
.breath-orb.inhale,.breath-orb.hold{transform:scale(1.45)}.breath-orb.exhale{transform:scale(0.92)}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);cursor:pointer}
</style>
</head>

<body>
<div class="phone-wrap">
  <div class="side-btn vol-up"></div>
  <div class="side-btn vol-dn"></div>
  <button class="pwr-btn" title="Lock / Wake" onclick="toggleLock()"></button>

  <div class="phone">
    <main class="screen mode-clear" id="screen">
      <div class="wallpaper-layer" id="wallLayer"></div>

      <div class="island" id="island" onclick="handleIslandTap()">
        <span class="island-dot"></span>
        <span class="island-wave"><span></span><span></span><span></span></span>
        <span class="island-timer" id="islTimer">05:00</span>
        <span class="island-lens"></span>
      </div>
      <div class="toast lg lg-dark" id="toast"></div>

      <div class="status" onclick="toggleCC()">
        <span id="statusTime">09:46</span>
        <span class="status-icons">
          <span id="sigIco"></span>
          <span id="wifiIco"></span>
          <span id="battIco"></span>
        </span>
      </div>

      <div class="torch-overlay" id="torchOverlay" onclick="toggleTorch(false)">
        <div class="glass-pill lg lg-dark" style="color:#fff;">Tap to turn off</div>
      </div>

      <div class="lockscreen" id="lockscreen" onclick="unlockPhone()">
        <div class="lock-top">
          <div class="lock-badge lg" id="lockGlyph"></div>
          <div class="lock-date" id="lockDate">Sat, Nov 21</div>
          <div class="lock-clock" id="lockClock">09:46</div>
          <div class="lock-cue">Swipe up or tap to unlock</div>
        </div>

        <div class="lock-media lg lg-dark" id="lockMedia" onclick="event.stopPropagation()">
          <div style="min-width:0;flex:1;">
            <div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="lmTitle">Fever (Slowed)</div>
            <div style="font-size:11px;color:var(--muted);" id="lmSub">sweetiele</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            <button class="glass-circle" style="width:30px;height:30px;background:rgba(255,255,255,0.1);" onclick="prevTrack()" id="lmPrev"></button>
            <button class="glass-circle btn-acc" style="width:34px;height:34px;" onclick="toggleMusicPlay()" id="lmPlay"></button>
            <button class="glass-circle" style="width:30px;height:30px;background:rgba(255,255,255,0.1);" onclick="nextTrack()" id="lmNext"></button>
          </div>
        </div>

        <div class="lock-bottom">
          <button class="lock-btn lg" id="lockFlash" onclick="event.stopPropagation();toggleTorch(true)"></button>
          <button class="lock-btn lg" id="lockCam" onclick="event.stopPropagation();unlockAndOpen('camera')"></button>
        </div>
      </div>

      <div class="cc" id="cc">
        <div class="cc-top">
          <span style="font-size:17px;font-weight:600;">Control Center</span>
          <button class="glass-circle lg" id="ccClose" onclick="toggleCC()"></button>
        </div>
        <div class="cc-row">
          <div class="cc-pebbles lg lg-dark">
            <button class="pebble active" id="ccWifi" onclick="toggleNet(this,'Wi-Fi')"></button>
            <button class="pebble active" id="ccBt" onclick="toggleNet(this,'Bluetooth')"></button>
            <button class="pebble" id="ccPlane" onclick="toggleNet(this,'Airplane')"></button>
            <button class="pebble" id="ccDnd" onclick="toggleDnd(this)"></button>
          </div>
          <div class="cc-media lg lg-dark">
            <div>
              <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="ccTrackName">Fever (Slowed)</div>
              <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="ccTrackSub">sweetiele</div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
              <button class="glass-circle" style="width:30px;height:30px;background:rgba(255,255,255,0.1);" id="ccPrevBtn" onclick="prevTrack()"></button>
              <button class="glass-circle btn-acc" style="width:34px;height:34px;" id="ccPlayIco" onclick="toggleMusicPlay()"></button>
              <button class="glass-circle" style="width:30px;height:30px;background:rgba(255,255,255,0.1);" id="ccNextBtn" onclick="nextTrack()"></button>
            </div>
          </div>
        </div>
        <div class="cc-actions-bar lg lg-dark">
          <button class="pebble" style="width:44px;height:44px;" id="ccTorch" onclick="toggleCC();toggleTorch(true)"></button>
          <button class="pebble" style="width:44px;height:44px;" id="ccMute" onclick="toggleMute(this)"></button>
          <button class="pebble" style="width:44px;height:44px;" id="ccLowPwr" onclick="toggleLowPower(this)"></button>
          <button class="pebble" style="width:44px;height:44px;" id="ccRecents" onclick="toggleCC();openRecents()"></button>
          <button class="pebble" style="width:44px;height:44px;" id="ccLockIco" onclick="toggleCC();lockPhone()"></button>
        </div>
        <div class="cc-sliders lg lg-dark">
          <div>
            <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;">
              <span id="ccSunLbl" style="display:inline-flex;align-items:center;gap:6px;"></span>
              <span id="brightPct">100%</span>
            </div>
            <div class="bright-track">
              <div class="bright-fill" id="brightFill" style="width:78%"></div>
              <input type="range" min="45" max="115" value="100" id="brightRange" class="bright-input" oninput="setBrightness(this.value)">
            </div>
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;">
              <span id="ccVolLbl" style="display:inline-flex;align-items:center;gap:6px;"></span>
              <span id="volPct">80%</span>
            </div>
            <div class="bright-track">
              <div class="bright-fill" id="volFill" style="width:80%"></div>
              <input type="range" min="0" max="100" value="80" id="volRange" class="bright-input" oninput="setVolume(this.value)">
            </div>
          </div>
        </div>
      </div>

      <div class="recents" id="recents" onclick="if(event.target===this)closeRecents()">
        <div class="cc-top">
          <span style="font-size:17px;font-weight:600;">Recents</span>
          <button class="btn btn-soft" style="padding:6px 12px;font-size:12px;" onclick="recentApps=[];closeRecents()">Clear</button>
        </div>
        <div class="recents-deck" id="recentsDeck"></div>
      </div>

      <div class="search-overlay" id="searchOverlay" onclick="if(event.target===this)toggleSearch()">
        <input class="field" id="searchInp" placeholder="Search apps..." oninput="filterSearch(this.value)">
        <div class="grid" id="searchResults"></div>
      </div>

      <div class="home-layer">
        <div class="pages" id="homePages" onscroll="onPageScroll()">
          <section class="page" id="homePage1">
            <div class="widgets-row">
              <div class="widget-sq lg" onclick="openApp('weather')">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                  <div><div class="w-city" id="hwCity">Berlin</div><div class="w-temp" id="hwTemp">18°</div></div>
                  <span id="hwIcon"></span>
                </div>
                <div><div class="w-sub" id="hwCond">Clear</div><div class="w-sub" id="hwRange">H:20° L:12°</div></div>
              </div>
              <div class="widget-sq lg" onclick="openApp('music')">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <span style="font-size:11px;font-weight:600;color:var(--accent);">MUSIC</span>
                  <span id="mwIcon" onclick="event.stopPropagation();toggleMusicPlay()" style="display:inline-flex;"></span>
                </div>
                <div><div class="w-city" id="mwTitle">Fever (Slowed)</div><div class="w-sub" id="mwSub">sweetiele</div></div>
              </div>
            </div>
            <div class="grid" id="gridP1"></div>
          </section>
          <section class="page" id="homePage2"><div class="grid" id="gridP2"></div></section>
        </div>

        <div class="home-footer-controls">
          <div class="page-dots">
            <button class="page-dot active" id="dot0" onclick="goToPage(0)"></button>
            <button class="page-dot" id="dot1" onclick="goToPage(1)"></button>
          </div>
          <button class="search-pill lg" id="searchPill" onclick="toggleSearch()"></button>
        </div>
        <div class="dock lg" id="dockGrid"></div>
      </div>

      <div class="nav" id="homeNav" onclick="onNavTap()" ondblclick="openRecents()"><span></span></div>

      <audio id="skyAudio" preload="metadata"></audio>
      <input id="audioPicker" type="file" accept="audio/*" multiple style="display:none" onchange="importLocalAudio(this.files)">
      <div class="spotify-mount" id="spotifyMount"></div>

      <section class="panel" id="panel">
        <div class="app-header">
          <button class="glass-circle lg" id="panelBack" onclick="closeApp()"></button>
          <div class="glass-pill lg" id="appTitle">App</div>
          <div style="width:36px;" id="appRightSlot"></div>
        </div>
        <div class="app-scroll" id="appBody"></div>
        <div id="appBottomSlot"></div>
      </section>
    </main>
  </div>
</div>

function parseAudioMeta(file,customUrl=null){
  const base=file.replace(AUDIO_EXT,''),idx=base.lastIndexOf(' - ');
  let title=idx>0?base.slice(0,idx):base,artist=idx>0?base.slice(idx+3).trim():'Local Audio';
  title=title.replace(/\s+,/g,',').replace(/\s+\./g,'').trim();
  let h=0;for(let i=0;i<file.length;i++)h=(h*31+file.charCodeAt(i))>>>0;
  return{file,url:customUrl||('music/'+encodeURIComponent(file)),title,artist,glow:GLOWS[h%GLOWS.length]};
}
let LIBRARY=SEED_FILES.map(f=>parseAudioMeta(f));

function detectRepo(){

}

let cExp='',cPrev='';
function evalMath(s){
  const tk=s.replace(/\s+/g,'').match(/(\d*\.?\d+|[+\-*/()])/g);if(!tk)throw 0;let i=0;const pk=()=>tk[i],nx=()=>tk[i++];
  function ex(){let v=tm();while(pk()==='+'||pk()==='-')v=nx()==='+'?v+tm():v-tm();return v;}
  function tm(){let v=fc();while(pk()==='*'||pk()==='/'){const o=nx(),r=fc();if(o==='/'&&r===0)throw 0;v=o==='*'?v*r:v/r;}return v;}
  function fc(){if(pk()==='-'){nx();return-fc();}if(pk()==='+'){nx();return fc();}if(pk()==='('){nx();const v=ex();if(nx()!==')')throw 0;return v;}const n=parseFloat(nx());if(!Number.isFinite(n))throw 0;return n;}
  const res=ex();if(i!==tk.length||!Number.isFinite(res))throw 0;return res;
}
function rCalc(body){
  const K=[['AC','fn'],['(','fn'],[')','fn'],['÷','op'],['7',''],['8',''],['9',''],['×','op'],['4',''],['5',''],['6',''],['−','op'],['1',''],['2',''],['3',''],['+','op'],['⌫',''],['0',''],['.',''],['=','op']];
  body.innerHTML=`<div class="calc-wrap"><div id="cPrev" style="text-align:right;font-size:14px;color:var(--muted);min-height:20px;padding:0 8px;font-variant-numeric:tabular-nums;">${cPrev}</div><div id="cDisp" style="font-family:var(--font-display);font-size:52px;font-weight:280;text-align:right;padding:4px 8px 18px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;">${cExp||'0'}</div><div class="calc-grid">${K.map(k=>`<button class="calc-btn ${k[1]}" onclick="cKey('${k[0]}')">${k[0]==='⌫'?SVG.backsp:k[0]}</button>`).join('')}</div></div>`;
}
function cKey(k){
  tone(620,0.03);const d=document.getElementById('cDisp'),p=document.getElementById('cPrev');if(!d)return;
  if(k==='AC'){cExp='';cPrev='';p.textContent='';d.textContent='0';return;}
  if(k==='⌫'){cExp=cExp.slice(0,-1);d.textContent=cExp||'0';return;}
  if(k==='='){if(!cExp)return;try{const r=evalMath(cExp.replaceAll('÷','/').replaceAll('×','*').replaceAll('−','-'));cPrev=cExp;cExp=String(Number(r.toFixed(8)));p.textContent=cPrev;d.textContent=cExp;}catch{cExp='';p.textContent='';d.textContent='Error';}return;}
  const ops=['÷','×','−','+'];if(ops.includes(k)&&ops.includes(cExp.slice(-1)))cExp=cExp.slice(0,-1)+k;else cExp+=k;d.textContent=cExp;
}

  }else{
    const now=new Date();
    body.innerHTML=`<div class="list-group">${ZONES.map(z=>`<div class="list-row"><span style="font-size:14px;font-weight:500;">${z.city}</span><strong style="font-family:var(--font-display);font-size:20px;font-weight:300;font-variant-numeric:tabular-nums;">${now.toLocaleTimeString([],{timeZone:z.tz,hour:'2-digit',minute:'2-digit',hour12:!prefs.hour24})}</strong></div>`).join('')}</div>`;
  }
}
function toggleSw(){if(swInt){clearInterval(swInt);swInt=null;}else{const st=Date.now()-swMs;swInt=setInterval(()=>{swMs=Date.now()-st;const e=document.getElementById('swTxt');if(e)e.textContent=fSw(swMs);},100);}if(activeApp==='clock'&&clkTab==='sw')rClock(EL.appBody);}

function setTm(s){clearInterval(tmInt);tmInt=null;tmTot=s;tmLeft=s;EL.island.classList.remove('timer-on');EL.island.classList.toggle('expanded',music.playing||inCall);rClock(EL.appBody);}
function toggleTm(){
  if(tmInt){clearInterval(tmInt);tmInt=null;EL.island.classList.remove('timer-on');}

      tmLeft--;const fmt=`${String(Math.floor(tmLeft/60)).padStart(2,'0')}:${String(tmLeft%60).padStart(2,'0')}`;EL.islTimer.textContent=fmt;
      const e=document.getElementById('tmTxt'),rg=document.getElementById('tmRing');if(e)e.textContent=fmt;if(rg)rg.style.strokeDashoffset=(2*Math.PI*72)*(1-tmLeft/tmTot);
      if(tmLeft<=0){clearInterval(tmInt);tmInt=null;EL.island.classList.remove('timer-on');EL.island.classList.toggle('expanded',music.playing||inCall);tone(880,0.24);showToast('Timer done');if(activeApp==='clock'&&clkTab==='tm')rClock(EL.appBody);}
    },1000);
  }
  EL.island.classList.toggle('expanded',music.playing||inCall||Boolean(tmInt));if(activeApp==='clock'&&clkTab==='tm')rClock(EL.appBody);
}
