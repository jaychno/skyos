<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SkyOS 26</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,200..800&family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --accent: #7dd3fc;
  --text: #f8fafc;
  --muted: rgba(241, 245, 249, 0.62);
  --spring: cubic-bezier(0.32, 0.72, 0, 1);
  --brightness: 1;
  --glass-blur: 26px;
  --glass-a1: 0.22;
  --glass-a2: 0.06;
  --font-ui: "Google Sans", "Google Sans Flex", system-ui, -apple-system, sans-serif;
  --font-display: "Google Sans Flex", "Google Sans", system-ui, -apple-system, sans-serif;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
  background: radial-gradient(circle at 50% 0%, #151b26 0%, #05070b 72%);
  font-family: var(--font-ui);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after {
  transition-duration: 0.01ms !important;
  animation-duration: 0.01ms !important;
}

/* Hardware Frame */
.phone-wrap { position: relative; }

.side-btn {
  position: absolute;
  background: linear-gradient(180deg, #5f6775, #2b303a);
  pointer-events: none;
}
.vol-up { left: -4px; top: 148px; width: 3px; height: 42px; border-radius: 3px 0 0 3px; }
.vol-dn { left: -4px; top: 200px; width: 3px; height: 42px; border-radius: 3px 0 0 3px; }

.pwr-btn {
  position: absolute;
  right: -5px;
  top: 172px;
  width: 4px;
  height: 68px;
  border-radius: 0 4px 4px 0;
  border: 0;
  background: linear-gradient(180deg, #677080, #303642);
  cursor: pointer;
}

.phone {
  width: min(388px, 95vw);
  height: min(822px, 93vh);
  min-height: 630px;
  border-radius: 52px;
  padding: 7px;
  background: #0a0c10;
  border: 2.5px solid #424956;
  box-shadow:
    0 40px 100px rgba(0, 0, 0, 0.82),
    0 0 0 1px rgba(255, 255, 255, 0.14),
    inset 0 0 0 2px #020305;
  overflow: hidden;
}

.screen {
  height: 100%;
  border-radius: 44px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: #0b1220;
  filter: brightness(var(--brightness));
  user-select: none;
  contain: layout style paint;
}

@media (max-width: 480px) {
  body { padding: 0; background: #070a10; }
  .phone-wrap { width: 100%; height: 100dvh; }
  .side-btn, .pwr-btn { display: none; }
  .phone { width: 100%; height: 100dvh; min-height: 0; border: 0; border-radius: 0; padding: 0; box-shadow: none; }
  .screen { border-radius: 0; }
}

.wallpaper-layer {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.wallpaper-layer svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* iOS 26 Liquid Glass Material */
.lg {
  position: relative;
  background: linear-gradient(145deg, rgba(255, 255, 255, var(--glass-a1)) 0%, rgba(255, 255, 255, var(--glass-a2)) 52%, rgba(255, 255, 255, 0.14) 100%);
  backdrop-filter: blur(var(--glass-blur)) saturate(195%) brightness(1.06);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(195%) brightness(1.06);
  box-shadow:
    0 12px 32px rgba(0, 0, 0, 0.22),
    inset 0 1px 0 rgba(255, 255, 255, 0.42),
    inset 0 -1px 0 rgba(255, 255, 255, 0.1);
}
.lg::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.68) 0%,
    rgba(255, 255, 255, 0.1) 36%,
    rgba(255, 255, 255, 0.04) 64%,
    rgba(255, 255, 255, 0.38) 100%
  );
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.lg-dark {
  background: linear-gradient(145deg, rgba(24, 30, 42, 0.58) 0%, rgba(12, 16, 24, 0.45) 55%, rgba(28, 34, 48, 0.48) 100%);
}

/* Status Bar & Dynamic Island */
.status {
  position: relative;
  z-index: 35;
  height: 44px;
  padding: 14px 26px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}

.island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 98px;
  height: 26px;
  background: #030406;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 9px;
  z-index: 36;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.55), inset 0 0 0 0.5px rgba(255, 255, 255, 0.1);
  transition: width 0.34s var(--spring);
}
.island.expanded { width: 142px; }

.island-wave {
  display: none;
  align-items: center;
  gap: 2px;
  height: 12px;
}
.island.playing .island-wave { display: flex; }
.island-wave span {
  width: 2px;
  height: 4px;
  border-radius: 2px;
  background: var(--accent);
  animation: eq 0.85s ease-in-out infinite alternate;
}
.island-wave span:nth-child(2) { animation-delay: 0.2s; }
.island-wave span:nth-child(3) { animation-delay: 0.45s; }
@keyframes eq {
  from { height: 3px; opacity: 0.6; }
  to { height: 11px; opacity: 1; }
}

.island-dot {
  display: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #34d399;
  box-shadow: 0 0 8px #34d399;
}
.island.calling .island-dot { display: block; }
.island.calling .island-wave { display: none; }

.island-lens {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-left: auto;
  background: radial-gradient(circle at 35% 35%, #3b82f6 0%, #0f172a 55%, #030712 100%);
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 7px;
}

/* Home Layer */
.home-layer {
  position: relative;
  z-index: 5;
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  transform: scale(1.06);
  pointer-events: none;
  will-change: transform, opacity;
  transition: transform 0.42s var(--spring), opacity 0.28s ease;
}
.screen.unlocked .home-layer {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}
.screen.unlocked.app-open .home-layer {
  transform: scale(0.92);
  opacity: 0;
  pointer-events: none;
}

.home-main {
  flex: 1;
  padding: 12px 18px 4px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  overflow-y: auto;
  scrollbar-width: none;
}
.home-main::-webkit-scrollbar { display: none; }

.widgets-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.widget-sq {
  border-radius: 24px;
  padding: 13px 14px;
  height: 116px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  transition: transform 0.2s var(--spring);
}
.widget-sq:active { transform: scale(0.96); }

.w-temp {
  font-family: var(--font-display);
  font-size: 34px;
  font-weight: 300;
  letter-spacing: -1.5px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.w-city {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.w-sub {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.74);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 13px 10px;
}

.app {
  border: 0;
  background: none;
  color: var(--text);
  font-family: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  padding: 0;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
  transition: transform 0.18s var(--spring);
}
.app:active { transform: scale(0.86); }
.app:hover .icon { transform: translateY(-2px); }

.icon {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s var(--spring);
}

/* iOS 26 Icon Modes: Clear / Tinted / Color */
.mode-clear .icon {
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.08) 52%, rgba(255, 255, 255, 0.18) 100%);
  backdrop-filter: blur(22px) saturate(185%);
  -webkit-backdrop-filter: blur(22px) saturate(185%);
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.48);
  color: #ffffff;
}
.mode-clear .icon::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.1) 40%, rgba(255, 255, 255, 0.4) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.mode-tinted .icon {
  background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 34%, rgba(255, 255, 255, 0.18)), rgba(15, 23, 42, 0.28));
  backdrop-filter: blur(22px) saturate(185%);
  -webkit-backdrop-filter: blur(22px) saturate(185%);
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  color: var(--accent);
}
.mode-tinted .icon::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0.08) 45%, var(--accent));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.mode-color .icon {
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.34);
  color: #ffffff;
}
.mode-color .ico-notes    { background: linear-gradient(145deg, #fbbf24, #d97706); }
.mode-color .ico-tasks    { background: linear-gradient(145deg, #4ade80, #16a34a); }
.mode-color .ico-calc     { background: linear-gradient(145deg, #475569, #1e293b); }
.mode-color .ico-clock    { background: linear-gradient(145deg, #818cf8, #4f46e5); }
.mode-color .ico-weather  { background: linear-gradient(145deg, #38bdf8, #2563eb); }
.mode-color .ico-music    { background: linear-gradient(145deg, #fb7185, #e11d48); }
.mode-color .ico-focus    { background: linear-gradient(145deg, #2dd4bf, #0d9488); }
.mode-color .ico-sketch   { background: linear-gradient(145deg, #c084fc, #9333ea); }
.mode-color .ico-gallery  { background: linear-gradient(145deg, #60a5fa, #6366f1); }
.mode-color .ico-calendar { background: linear-gradient(145deg, #f87171, #dc2626); }
.mode-color .ico-files    { background: linear-gradient(145deg, #38bdf8, #0369a1); }
.mode-color .ico-convert  { background: linear-gradient(145deg, #f59e0b, #b45309); }
.mode-color .ico-browser  { background: linear-gradient(145deg, #22d3ee, #0284c7); }
.mode-color .ico-terminal { background: linear-gradient(145deg, #334155, #090d16); }
.mode-color .ico-settings { background: linear-gradient(145deg, #64748b, #334155); }
.mode-color .ico-about    { background: linear-gradient(145deg, #38bdf8, #0369a1); }
.mode-color .ico-phone    { background: linear-gradient(145deg, #34d399, #059669); }
.mode-color .ico-messages { background: linear-gradient(145deg, #38bdf8, #0284c7); }

.search-pill {
  align-self: center;
  margin: 2px 0 6px;
  padding: 5px 13px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.92);
  border: 0;
  cursor: pointer;
  transition: transform 0.16s var(--spring);
}
.search-pill:active { transform: scale(0.94); }

.dock {
  margin: 0 14px 6px;
  padding: 10px 14px;
  border-radius: 28px;
  display: flex;
  justify-content: space-around;
}
.dock .icon {
  width: 50px;
  height: 50px;
  border-radius: 15px;
}

.nav {
  position: relative;
  z-index: 32;
  height: 18px;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.nav span {
  width: 118px;
  height: 4.5px;
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.86);
  transition: width 0.2s var(--spring);
}
.nav:active span { width: 92px; }

/* Lock Screen */
.lockscreen {
  position: absolute;
  inset: 0;
  z-index: 30;
  touch-action: none;
  background: linear-gradient(180deg, rgba(6, 10, 18, 0.12) 0%, rgba(6, 10, 18, 0.34) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 68px 24px 32px;
  cursor: pointer;
  will-change: transform, opacity;
  transition: transform 0.44s var(--spring), opacity 0.28s ease;
}
.lockscreen.unlocked {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}
.lock-top { text-align: center; }
.lock-badge {
  width: 30px;
  height: 30px;
  margin: 0 auto 10px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: rgba(255, 255, 255, 0.9);
}
.lock-date {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: rgba(255, 255, 255, 0.88);
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
}
.lock-clock {
  font-family: var(--font-display);
  font-size: 84px;
  font-weight: 260;
  letter-spacing: -3.5px;
  line-height: 0.96;
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(255, 255, 255, 0.56) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.22));
}
.lock-bottom {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 10px 6px;
}
.lock-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 0;
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform 0.16s var(--spring);
}
.lock-btn:active { transform: scale(0.9); }

/* Control Center */
.cc {
  position: absolute;
  inset: 0;
  z-index: 28;
  padding: 60px 20px 28px;
  background: rgba(8, 12, 20, 0.46);
  backdrop-filter: blur(36px) saturate(180%);
  -webkit-backdrop-filter: blur(36px) saturate(180%);
  display: flex;
  flex-direction: column;
  gap: 14px;
  will-change: transform, opacity;
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.36s var(--spring), opacity 0.24s ease;
}
.cc.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
.cc-top { display: flex; justify-content: space-between; align-items: center; }
.cc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cc-pebbles {
  border-radius: 26px;
  padding: 12px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.pebble {
  height: 52px;
  width: 52px;
  border-radius: 50%;
  margin: auto;
  border: 0;
  color: #fff;
  background: rgba(255, 255, 255, 0.14);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.2s var(--spring);
}
.pebble:active { transform: scale(0.9); }
.pebble.active {
  background: var(--accent);
  color: #06121f;
  box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 45%, transparent);
}
.cc-media {
  border-radius: 26px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
}
.cc-slider-card { border-radius: 24px; padding: 14px 16px; }
.bright-track {
  position: relative;
  height: 44px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
  margin-top: 10px;
}
.bright-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: rgba(255, 255, 255, 0.88);
  border-radius: 16px;
  pointer-events: none;
}
.bright-input {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  margin: 0;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  cursor: pointer;
}
.bright-input::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 4px;
  height: 24px;
  background: transparent;
}

/* Search Overlay */
.search-overlay {
  position: absolute;
  inset: 0;
  z-index: 26;
  background: rgba(8, 12, 20, 0.52);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  padding: 64px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  opacity: 0;
  pointer-events: none;
  transform: scale(1.04);
  transition: opacity 0.22s ease, transform 0.28s var(--spring);
}
.search-overlay.open {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
}

/* App Window */
.panel {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: rgba(7, 10, 17, 0.76);
  backdrop-filter: blur(38px) saturate(160%);
  -webkit-backdrop-filter: blur(38px) saturate(160%);
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  will-change: transform, opacity;
  transform: translateY(28px) scale(0.93);
  transition: opacity 0.2s ease, transform 0.34s var(--spring);
  user-select: text;
}
.panel.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

.app-header {
  position: absolute;
  top: 46px;
  left: 16px;
  right: 16px;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}
.app-header > * { pointer-events: auto; }

.glass-pill {
  border: 0;
  border-radius: 999px;
  padding: 7px 15px;
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.glass-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 0;
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform 0.16s var(--spring);
}
.glass-circle:active { transform: scale(0.9); }

.app-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 96px 18px 88px;
  scrollbar-width: none;
}
.app-scroll::-webkit-scrollbar { display: none; }

.floating-bar {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 26px;
  z-index: 5;
  border-radius: 999px;
  padding: 5px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.spotify-mount {
  position: fixed;
  left: -9999px;
  top: 0;
  width: 336px;
  height: 410px;
  opacity: 0;
  pointer-events: none;
}
.spotify-mount.visible {
  position: absolute;
  left: 18px;
  right: 18px;
  top: 96px;
  bottom: 90px;
  width: auto;
  height: auto;
  z-index: 22;
  opacity: 1;
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Toast */
.toast {
  position: absolute;
  top: 48px;
  left: 50%;
  transform: translateX(-50%) translateY(-12px);
  padding: 7px 15px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: all 0.24s var(--spring);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Shared App Controls */
.field {
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  padding: 11px 14px;
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}
.field:focus { border-color: var(--accent); }

.btn {
  border: 0;
  border-radius: 999px;
  padding: 10px 16px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.15s var(--spring), background 0.2s;
}
.btn:active { transform: scale(0.94); }
.btn-acc {
  background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 44%, rgba(255, 255, 255, 0.18)), color-mix(in srgb, var(--accent) 26%, rgba(15, 23, 42, 0.45)));
  color: #ffffff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42), 0 8px 20px rgba(0, 0, 0, 0.25);
  border: 1px solid color-mix(in srgb, var(--accent) 55%, rgba(255, 255, 255, 0.2));
}
.btn-soft { background: rgba(255, 255, 255, 0.1); color: #fff; }
.btn-red { background: rgba(239, 68, 68, 0.85); color: #fff; }

.list-group {
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 22px;
  overflow: hidden;
  margin-bottom: 14px;
}
.list-row {
  padding: 13px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.list-row:last-child { border-bottom: 0; }

.sec-lbl {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin: 6px 0 8px 6px;
}

/* Toggle Switch */
.toggle {
  width: 46px;
  height: 27px;
  border-radius: 999px;
  border: 0;
  padding: 3px;
  background: rgba(255, 255, 255, 0.16);
  cursor: pointer;
  display: flex;
  align-items: center;
  transition: background 0.2s;
  flex-shrink: 0;
}
.toggle span {
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.22s var(--spring);
}
.toggle.on { background: color-mix(in srgb, var(--accent) 70%, #22c55e); }
.toggle.on span { transform: translateX(19px); }

/* Seek Bar */
.seek-bar {
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
  height: 5px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
  outline: none;
  cursor: pointer;
}
.seek-bar::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px rgba(0, 0, 0, 0.4);
}

/* Calculator */
.calc-wrap { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 10px; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.calc-btn {
  height: 64px; border-radius: 50%; border: 0; font-family: inherit; font-size: 22px; font-weight: 500;
  color: #fff; background: rgba(255, 255, 255, 0.11); display: grid; place-items: center; cursor: pointer;
  transition: transform 0.14s var(--spring), filter 0.12s;
}
.calc-btn:active { transform: scale(0.9); filter: brightness(1.25); }
.calc-btn.fn { background: rgba(255, 255, 255, 0.22); }
.calc-btn.op { background: color-mix(in srgb, var(--accent) 40%, rgba(255, 255, 255, 0.12)); color: #fff; font-weight: 600; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }

/* Phone */
.dial-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 270px; margin: 0 auto; }
.dial-btn {
  height: 68px; border-radius: 50%; border: 0; color: #fff; background: rgba(255, 255, 255, 0.1);
  display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
  transition: transform 0.14s var(--spring);
}
.dial-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.2); }
.dial-btn b { font-size: 24px; font-weight: 400; line-height: 1; }
.dial-btn span { font-size: 9px; letter-spacing: 1.4px; color: var(--muted); margin-top: 2px; }

/* Messages */
.bubble { max-width: 80%; padding: 10px 14px; border-radius: 20px; font-size: 13.5px; line-height: 1.4; margin-bottom: 7px; }
.bubble.me {
  margin-left: auto;
  background: color-mix(in srgb, var(--accent) 36%, rgba(255, 255, 255, 0.14));
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  color: #fff; font-weight: 500; border-bottom-right-radius: 6px;
}
.bubble.them { margin-right: auto; background: rgba(255, 255, 255, 0.12); border-bottom-left-radius: 6px; }

/* Calendar */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-day {
  aspect-ratio: 1; border-radius: 50%; border: 0; background: transparent; color: #fff;
  font-family: inherit; font-size: 13px; cursor: pointer; position: relative; display: grid; place-items: center;
}
.cal-day.today { background: color-mix(in srgb, var(--accent) 45%, rgba(255, 255, 255, 0.12)); font-weight: 700; }
.cal-day.sel { box-shadow: inset 0 0 0 1.5px var(--accent); }
.cal-dot { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

/* Terminal */
.term-box {
  background: rgba(5, 7, 11, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px; padding: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px; line-height: 1.55; min-height: 360px; white-space: pre-wrap; color: #d1d5db;
}

/* Focus Orb */
.breath-orb {
  width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center;
  font-size: 15px; font-weight: 600; border: 2px solid var(--accent);
  box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 32%, transparent);
  transition: transform 4s ease-in-out;
}
.breath-orb.inhale, .breath-orb.hold { transform: scale(1.45); }
.breath-orb.exhale { transform: scale(0.92); }

.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3); cursor: pointer; }
</style>
</head>

function parseAudioMeta(file, customUrl = null) {
  const base = file.replace(AUDIO_EXT, '');
  const idx = base.lastIndexOf(' - ');
  let title = idx > 0 ? base.slice(0, idx) : base;
  const artist = idx > 0 ? base.slice(idx + 3).trim() : 'Local Audio';
  title = title.replace(/\s+,/g, ',').replace(/\s+\./g, '').trim();
  let hash = 0;
  for (let i = 0; i < file.length; i++) hash = (hash * 31 + file.charCodeAt(i)) >>> 0;
  return {
    file,
    url: customUrl || ('music/' + encodeURIComponent(file)),
    title,
    artist,
    glow: GLOW_PALETTE[hash % GLOW_PALETTE.length]
  };
}

let LIBRARY = SEED_FILES.map(f => parseAudioMeta(f));

function detectRepo() {
  if (location.hostname.endsWith('.github.io')) {
    const owner = location.hostname.split('.')[0];
    const repo = location.pathname.split('/').filter(Boolean)[0];
    if (owner && repo) return `${owner}/${repo}`;
  }
  return null;
}

  setupAudioEngine();
  syncMusicLibrary(true);
  tickClock();

}

function tickClock() {
  const d = new Date();
  const opts = { hour: '2-digit', minute: '2-digit', hour12: !prefs.hour24 };
  if (prefs.seconds) opts.second = '2-digit';
  const tFull = d.toLocaleTimeString([], opts);
  const tShort = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: !prefs.hour24 });
  const dt = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  EL.statusTime.textContent = tShort;
  EL.lockClock.textContent = tFull;
  EL.lockDate.textContent = dt;
}

let toastTimer;
function showToast(msg) {
  EL.toast.textContent = msg;
  EL.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => EL.toast.classList.remove('show'), 1800);
}

let actx = null;
function getAudio() {

function tone(freq = 540, dur = 0.04) {
  if (!prefs.sound) return;
  try {
    const c = getAudio(), o = c.createOscillator(), g = c.createGain();
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.035, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  } catch {}
}

/* --- Auto-Scan Music Folder --- */
function mergeMusicFiles(files) {
  const existing = new Set(LIBRARY.map(t => t.file));
  let added = 0;
  files.forEach(f => {
    const clean = decodeURIComponent(String(f)).split('/').pop();
    if (AUDIO_EXT.test(clean) && !existing.has(clean)) {
      existing.add(clean);
      LIBRARY.push(parseAudioMeta(clean));
      added++;
    }
  });
  return added;
}

async function syncMusicLibrary(silent = false) {
  let found = [];
  if (prefs.repo && prefs.repo.includes('/')) {
    try {
      const res = await fetch(`https://api.github.com/repos/${prefs.repo}/contents/music`, { headers: { Accept: 'application/vnd.github+json' } });
      if (res.ok) {
        const items = await res.json();
        if (Array.isArray(items)) {
          items.forEach(it => { if (it.type === 'file' && AUDIO_EXT.test(it.name)) found.push(it.name); });
        }
      }
    } catch {}
  }
  if (!found.length) {
    try {
      const m = await fetch('music/manifest.json');
      if (m.ok) {
        const arr = await m.json();
        if (Array.isArray(arr)) found = arr.filter(x => AUDIO_EXT.test(x));
      }
    } catch {}
  }
  if (!found.length) {
    try {
      const idx = await fetch('music/');
      if (idx.ok) {
        const html = await idx.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        doc.querySelectorAll('a[href]').forEach(a => {
          const href = a.getAttribute('href') || '';
          if (AUDIO_EXT.test(href)) found.push(href);
        });
      }
    } catch {}
  }

  if (found.length) {
    LS.set('sky26-music-cache', JSON.stringify(found));
    const added = mergeMusicFiles(found);
    if (!silent) showToast(added ? `Added ${added} new track${added > 1 ? 's' : ''}` : `Synced (${LIBRARY.length} tracks)`);
    if (activeApp === 'music' && musicTab === 'library') rMusic(EL.appBody);
    if (activeApp === 'files') rFiles(EL.appBody);
  } else if (!silent) {
    showToast(`${LIBRARY.length} tracks ready`);
  }
}

function importLocalAudio(fileList) {
  if (!fileList || !fileList.length) return;
  let count = 0;
  Array.from(fileList).forEach(f => {
    if (!AUDIO_EXT.test(f.name) && !f.type.startsWith('audio/')) return;
    const url = URL.createObjectURL(f);
    LIBRARY.unshift(parseAudioMeta(f.name, url));
    count++;
  });
  if (count) {
    loadTrack(0, true);
    showToast(`Imported ${count} track${count > 1 ? 's' : ''}`);
    if (activeApp === 'files') rFiles(EL.appBody);
  }
}

let music = { i: 0, playing: false, shuffle: false };
let musicTab = 'library';

function fmtSec(s) {
  if (!Number.isFinite(s) || s < 0) return '0:00';
  return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
}

function setupAudioEngine() {
  const audio = EL.skyAudio;
  audio.src = LIBRARY[0].url;

  audio.addEventListener('timeupdate', () => {
    const seek = document.getElementById('seekBar');
    const cur = document.getElementById('curTime');
    const dur = document.getElementById('durTime');
    if (seek && audio.duration) seek.value = (audio.currentTime / audio.duration) * 100;
    if (cur) cur.textContent = fmtSec(audio.currentTime);
    if (dur && audio.duration) dur.textContent = fmtSec(audio.duration);
  });

  audio.addEventListener('loadedmetadata', () => {
    const dur = document.getElementById('durTime');
    if (dur && audio.duration) dur.textContent = fmtSec(audio.duration);
  });

  audio.addEventListener('ended', () => nextTrack());
  audio.addEventListener('error', () => {
    music.playing = false;
    syncMusicChrome();
  });

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', () => toggleMusicPlay());
      navigator.mediaSession.setActionHandler('pause', () => toggleMusicPlay());
      navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
      navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
    } catch {}
  }
}

function syncMusicChrome() {
  const t = LIBRARY[music.i];
  EL.mwTitle.textContent = t.title;
  EL.mwSub.textContent = t.artist;
  EL.mwIcon.innerHTML = music.playing ? SVG.pause : SVG.play;
  EL.ccTrackName.textContent = t.title;
  EL.ccTrackSub.textContent = t.artist;
  EL.ccPlayIco.innerHTML = music.playing ? SVG.pause : SVG.play;
  EL.island.classList.toggle('playing', music.playing);
  EL.island.classList.toggle('expanded', music.playing || inCall);

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: 'SkyOS Music' });
    } catch {}
  }
}

function loadTrack(idx, autoPlay = true) {
  const audio = EL.skyAudio;
  music.i = (idx + LIBRARY.length) % LIBRARY.length;
  audio.src = LIBRARY[music.i].url;
  if (autoPlay) {
    audio.play().then(() => {
      music.playing = true;
      syncMusicChrome();
      if (activeApp === 'music' && musicTab === 'library') rMusic(EL.appBody);
    }).catch(() => {
      music.playing = false;
      syncMusicChrome();
      showToast('Audio file not found locally');
    });
  } else syncMusicChrome();
  if (activeApp === 'music' && musicTab === 'library') rMusic(EL.appBody);
}

function toggleMusicPlay(fi = null) {
  const audio = EL.skyAudio;
  if (fi !== null && fi !== music.i) { loadTrack(fi, true); return; }
  if (music.playing) {
    audio.pause();
    music.playing = false;
    syncMusicChrome();
    if (activeApp === 'music' && musicTab === 'library') rMusic(EL.appBody);
  } else {
    if (!audio.src) audio.src = LIBRARY[music.i].url;
    audio.play().then(() => {
      music.playing = true;
      syncMusicChrome();
      if (activeApp === 'music' && musicTab === 'library') rMusic(EL.appBody);
    }).catch(() => showToast('Place music/ folder next to index.html or import audio'));
  }
}

function nextTrack() {
  if (music.shuffle && LIBRARY.length > 1) {
    let r = music.i;
    while (r === music.i) r = Math.floor(Math.random() * LIBRARY.length);
    loadTrack(r, true);
  } else loadTrack(music.i + 1, true);
}

function prevTrack() {
  if (EL.skyAudio.currentTime > 3) EL.skyAudio.currentTime = 0;
  else loadTrack(music.i - 1, true);
}

function seekTrack(val) {

/* --- Calculator (Safe Recursive-Descent Evaluator) --- */
let cExp = '', cPrev = '';
function evalMath(str) {
  const tokens = str.replace(/\s+/g, '').match(/(\d*\.?\d+|[+\-*/()])/g);
  if (!tokens) throw 0;
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];
  function parseExpr() {
    let val = parseTerm();
    while (peek() === '+' || peek() === '-') val = next() === '+' ? val + parseTerm() : val - parseTerm();
    return val;
  }
  function parseTerm() {
    let val = parseFactor();
    while (peek() === '*' || peek() === '/') {
      const op = next(), rhs = parseFactor();
      if (op === '/' && rhs === 0) throw 0;
      val = op === '*' ? val * rhs : val / rhs;
    }
    return val;
  }
  function parseFactor() {
    if (peek() === '-') { next(); return -parseFactor(); }
    if (peek() === '+') { next(); return parseFactor(); }
    if (peek() === '(') {
      next();
      const val = parseExpr();
      if (next() !== ')') throw 0;
      return val;
    }
    const num = parseFloat(next());
    if (!Number.isFinite(num)) throw 0;
    return num;
  }
  const res = parseExpr();
  if (pos !== tokens.length || !Number.isFinite(res)) throw 0;
  return res;
}

function rCalc(body) {
  const keys = [['AC','fn'],['(','fn'],[')','fn'],['÷','op'],['7',''],['8',''],['9',''],['×','op'],['4',''],['5',''],['6',''],['−','op'],['1',''],['2',''],['3',''],['+','op'],['⌫',''],['0',''],['.',''],['=','op']];
  body.innerHTML = `
    <div class="calc-wrap">
      <div id="cPrev" style="text-align:right; font-size:14px; color:var(--muted); min-height:20px; padding:0 8px; font-variant-numeric:tabular-nums;">${cPrev}</div>
      <div id="cDisp" style="font-family:var(--font-display); font-size:52px; font-weight:280; text-align:right; padding:4px 8px 18px; overflow-wrap:anywhere; font-variant-numeric:tabular-nums;">${cExp || '0'}</div>
      <div class="calc-grid">${keys.map(k => `<button class="calc-btn ${k[1]}" onclick="cKey('${k[0]}')">${k[0] === '⌫' ? SVG.backsp : k[0]}</button>`).join('')}</div>
    </div>`;
}
function cKey(k) {
  tone(620, 0.03);
  const d = document.getElementById('cDisp'), p = document.getElementById('cPrev');
  if (!d) return;
  if (k === 'AC') { cExp = ''; cPrev = ''; p.textContent = ''; d.textContent = '0'; return; }
  if (k === '⌫') { cExp = cExp.slice(0, -1); d.textContent = cExp || '0'; return; }
  if (k === '=') {
    if (!cExp) return;
    try {
      const s = cExp.replaceAll('÷', '/').replaceAll('×', '*').replaceAll('−', '-');
      const r = evalMath(s);
      cPrev = cExp; cExp = String(Number(r.toFixed(8)));
      p.textContent = cPrev; d.textContent = cExp;
    } catch { cExp = ''; p.textContent = ''; d.textContent = 'Error'; }
    return;
  }
  const ops = ['÷', '×', '−', '+'];
  if (ops.includes(k) && ops.includes(cExp.slice(-1))) cExp = cExp.slice(0, -1) + k;
  else cExp += k;
  d.textContent = cExp;
}

/* --- Clock --- */
let clkTab = 'sw', swMs = 0, swInt = null, swLaps = [], tmTot = 300, tmLeft = 300, tmInt = null;
const fSw = ms => { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}.${Math.floor((ms % 1000) / 100)}`; };
function rClock(body) {

    <div class="floating-bar lg lg-dark" style="justify-content:space-around;">
      <button class="btn ${clkTab === 'sw' ? 'btn-acc' : ''}" style="flex:1; background:${clkTab === 'sw' ? '' : 'transparent'}; color:#fff;" onclick="clkTab='sw'; rClock(EL.appBody)">Stopwatch</button>
      <button class="btn ${clkTab === 'tm' ? 'btn-acc' : ''}" style="flex:1; background:${clkTab === 'tm' ? '' : 'transparent'}; color:#fff;" onclick="clkTab='tm'; rClock(EL.appBody)">Timer</button>
    </div>`;
  if (clkTab === 'sw') {
    body.innerHTML = `
      <div style="text-align:center; padding:34px 0 24px;">
        <div id="swTxt" style="font-family:var(--font-display); font-size:56px; font-weight:260; font-variant-numeric:tabular-nums;">${fSw(swMs)}</div>
        <div style="display:flex; justify-content:center; gap:12px; margin-top:22px;">
          <button class="btn btn-acc" onclick="toggleSw()">${swInt ? 'Pause' : 'Start'}</button>

        </div>
      </div>
      <div class="list-group" style="${swLaps.length ? '' : 'display:none'}">
        ${swLaps.map((l, i) => `<div class="list-row"><span style="color:var(--muted); font-size:13px;">Lap ${swLaps.length - i}</span><strong style="font-variant-numeric:tabular-nums;">${l}</strong></div>`).join('')}
      </div>`;
  } else {
    const r = 72, c = 2 * Math.PI * r, off = c * (1 - tmLeft / Math.max(1, tmTot));
    const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    body.innerHTML = `
      <div style="text-align:center; padding:24px 0;">
        <div style="position:relative; width:168px; height:168px; margin:0 auto 20px; display:grid; place-items:center;">
          <svg width="168" height="168" style="position:absolute; transform:rotate(-90deg);">
            <circle cx="84" cy="84" r="${r}" stroke="rgba(255,255,255,0.1)" stroke-width="6" fill="none"/>
            <circle id="tmRing" cx="84" cy="84" r="${r}" stroke="var(--accent)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
          </svg>
          <div id="tmTxt" style="font-family:var(--font-display); font-size:38px; font-weight:300; font-variant-numeric:tabular-nums;">${fmt(tmLeft)}</div>
        </div>
        <div style="display:flex; justify-content:center; gap:8px; margin-bottom:18px;">
          ${[60, 180, 300, 600].map(s => `<button class="btn ${tmTot === s ? 'btn-acc' : 'btn-soft'}" style="padding:7px 13px; font-size:12px;" onclick="setTm(${s})">${s / 60}m</button>`).join('')}
        </div>
        <div style="display:flex; justify-content:center; gap:12px;">
          <button class="btn btn-acc" onclick="toggleTm()">${tmInt ? 'Pause' : 'Start'}</button>
          <button class="btn btn-soft" onclick="setTm(${tmTot})">Reset</button>
        </div>
      </div>`;
  }
}
function toggleSw() {
  if (swInt) { clearInterval(swInt); swInt = null; }
  else { const st = Date.now() - swMs; swInt = setInterval(() => { swMs = Date.now() - st; const e = document.getElementById('swTxt'); if (e) e.textContent = fSw(swMs); }, 100); }
  if (activeApp === 'clock') rClock(EL.appBody);
}
function lapSw() { if (!swMs) return; swLaps.unshift(fSw(swMs)); rClock(EL.appBody); }
function resetSw() { clearInterval(swInt); swInt = null; swMs = 0; swLaps = []; rClock(EL.appBody); }
function setTm(s) { clearInterval(tmInt); tmInt = null; tmTot = s; tmLeft = s; rClock(EL.appBody); }
function toggleTm() {
  if (tmInt) { clearInterval(tmInt); tmInt = null; }
  else {
    if (tmLeft <= 0) tmLeft = tmTot;
    tmInt = setInterval(() => {
      tmLeft--;
      const e = document.getElementById('tmTxt'), rg = document.getElementById('tmRing');
      if (e) e.textContent = `${String(Math.floor(tmLeft / 60)).padStart(2, '0')}:${String(tmLeft % 60).padStart(2, '0')}`;
      if (rg) rg.style.strokeDashoffset = (2 * Math.PI * 72) * (1 - tmLeft / tmTot);
      if (tmLeft <= 0) { clearInterval(tmInt); tmInt = null; tone(880, 0.22); showToast('Timer done'); if (activeApp === 'clock') rClock(EL.appBody); }
    }, 1000);
  }
  if (activeApp === 'clock') rClock(EL.appBody);
}

/* --- Unit Converter --- */
let cvCat = 'temp', cvVal = '20', cvSwap = false;
const CONV = {
  temp:   { l: 'Temp',   u: ['°C', '°F'], fn: (v, r) => r ? (v - 32) * 5 / 9 : v * 9 / 5 + 32 },
  length: { l: 'Length', u: ['km', 'mi'], fn: (v, r) => r ? v / 0.621371 : v * 0.621371 },
  weight: { l: 'Weight', u: ['kg', 'lb'], fn: (v, r) => r ? v / 2.20462 : v * 2.20462 },
  data:   { l: 'Data',   u: ['GB', 'MB'], fn: (v, r) => r ? v / 1024 : v * 1024 }
};
function rConvert(body) {
  const c = CONV[cvCat];
  const fromU = cvSwap ? c.u[1] : c.u[0], toU = cvSwap ? c.u[0] : c.u[1];

let termLogs = ['SkySH 26 — type "help"'];
function rTerminal(body) {

  document.getElementById('termOut').textContent = termLogs.join('\n');
  EL.appBottomSlot.innerHTML = `

function runTerm() {
  const inp = document.getElementById('termIn');
  const raw = inp.value.trim();
  if (!raw) return;
  termLogs.push('$ ' + raw);
  const [cmd, ...rest] = raw.split(/\s+/);
  const arg = rest.join(' ');
  const c = cmd.toLowerCase();
  if (c === 'help') termLogs.push('cmds: help, ls, play <q>, open <app>, sync, time, theme <hex>, clear');
  else if (c === 'clear') termLogs = [];
  else if (c === 'time') termLogs.push(new Date().toLocaleString());
  else if (c === 'ls') termLogs.push(LIBRARY.map((t, i) => `[${i}] ${t.file}`).join('\n'));
  else if (c === 'sync') { syncMusicLibrary(false); termLogs.push('syncing music/...'); }
  else if (c === 'theme' && arg) { setAccent(arg); termLogs.push(`accent -> ${arg}`); }
  else if (c === 'open' && arg) { openApp(arg.toLowerCase()); return; }
  else if (c === 'play') {
    const idx = LIBRARY.findIndex(t => t.title.toLowerCase().includes(arg.toLowerCase()));
    if (idx >= 0) { loadTrack(idx, true); termLogs.push(`playing: ${LIBRARY[idx].title}`); }
    else termLogs.push('not found');
  } else termLogs.push(`unknown: ${cmd}`);
  rTerminal(EL.appBody);
  const box = document.getElementById('termOut');
  if (box) box.scrollTop = box.scrollHeight;
}

/* --- Safari --- */
function rBrowser(body) {
  body.innerHTML = `<div style="border-radius:22px; overflow:hidden; height:100%; min-height:460px; border:1px solid rgba(255,255,255,0.1);"><iframe id="wFrm" title="Browser" src="https://example.com" style="border:0; width:100%; height:100%; min-height:460px; background:#fff;"></iframe></div>`;
  EL.appBottomSlot.innerHTML = `
    <div class="floating-bar lg lg-dark">
      <input id="wUrl" placeholder="example.com" style="flex:1; background:transparent; border:0; color:#fff; padding:8px 12px; font-family:inherit; font-size:13.5px; outline:none;" onkeydown="if(event.key==='Enter') goUrl(true)">
      <button class="btn btn-soft" style="padding:7px 11px; font-size:12px;" onclick="goUrl(false)">${SVG.ext}</button>
      <button class="btn btn-acc" style="padding:7px 13px; font-size:12px;" onclick="goUrl(true)">Go</button>
    </div>`;
}
function goUrl(inF) {
  let u = document.getElementById('wUrl').value.trim();
  if (!u) return;
  if (!u.startsWith('http')) u = 'https://' + u;
  if (inF) document.getElementById('wFrm').src = u; else window.open(u, '_blank', 'noopener');
}

/* --- Phone --- */
let dial = '', callMuted = false, callSec = 0, callTimer = null;
const DTMF = { '1':697,'2':730,'3':770,'4':800,'5':852,'6':890,'7':941,'8':980,'9':1020,'*':580,'0':640,'#':710 };
function rPhone(body) {
  endCall();
  const pad = [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
  body.innerHTML = `
    <div style="padding-top:16px;">
      <div id="dTxt" style="font-family:var(--font-display); font-size:32px; font-weight:300; text-align:center; min-height:44px; margin-bottom:22px; font-variant-numeric:tabular-nums;">${dial || ' '}</div>
      <div class="dial-grid">${pad.map(k => `<button class="dial-btn" onclick="dPress('${k[0]}')"><b>${k[0]}</b><span>${k[1]}</span></button>`).join('')}</div>
      <div style="display:flex; justify-content:center; align-items:center; gap:22px; margin-top:20px;">
        <div style="width:44px;"></div>
        <button class="glass-circle" style="width:66px; height:66px; background:#22c55e; color:#fff;" onclick="doCall()">${SVG.call}</button>
        <button class="glass-circle" style="width:44px; height:44px; background:transparent;" onclick="dBack()">${SVG.backsp}</button>
      </div>
    </div>`;
}
function dPress(k) { tone(DTMF[k] || 600, 0.06); if (dial.length < 14) dial += k; document.getElementById('dTxt').textContent = dial; }
function dBack() { dial = dial.slice(0, -1); document.getElementById('dTxt').textContent = dial || ' '; }
function doCall() {
  if (!dial) return;
  inCall = true; callMuted = false; callSec = 0;
  EL.island.classList.add('calling', 'expanded');
  clearInterval(callTimer);
  callTimer = setInterval(() => {
    callSec++;
    const ct = document.getElementById('callTimer');
    if (ct) ct.textContent = `${String(Math.floor(callSec / 60)).padStart(2, '0')}:${String(callSec % 60).padStart(2, '0')}`;
  }, 1000);
  rCallScreen();
}
function rCallScreen() {
  EL.appBody.innerHTML = `
    <div style="text-align:center; padding:54px 0;">
      <div id="callDialTxt" style="font-size:28px; font-weight:500;"></div>
      <div id="callTimer" style="font-size:13px; color:var(--accent); margin-top:6px; font-variant-numeric:tabular-nums;">00:00</div>
      <div style="display:flex; justify-content:center; gap:22px; margin-top:140px;">
        <button class="glass-circle lg" style="width:60px; height:60px; ${callMuted ? 'background:#fff; color:#000;' : ''}" onclick="callMuted=!callMuted; rCallScreen();">${SVG.volOff}</button>
        <button class="glass-circle btn-red" style="width:60px; height:60px;" onclick="rPhone(EL.appBody)">${SVG.close}</button>
      </div>
    </div>`;
  document.getElementById('callDialTxt').textContent = dial;
}
function endCall() {
  inCall = false; clearInterval(callTimer);
  EL.island.classList.remove('calling');
  EL.island.classList.toggle('expanded', music.playing);
}

/* --- Messages --- */
function getMsgs() {
  try {
    const raw = LS.get('sky26-msgs');
    return raw ? JSON.parse(raw) : [{ f: 'them', t: 'Liquid Glass ready.' }];
  } catch { return []; }
}
function rMsg(body) {
  const ms = getMsgs();
  body.innerHTML = `<div id="mBox" style="padding-top:8px;"></div>`;
  const b = document.getElementById('mBox');
  ms.forEach(m => { const d = document.createElement('div'); d.className = `bubble ${m.f === 'me' ? 'me' : 'them'}`; d.textContent = m.t; b.appendChild(d); });
  EL.appBottomSlot.innerHTML = `
    <div class="floating-bar lg lg-dark">
      <input id="mIn" placeholder="iMessage" style="flex:1; background:transparent; border:0; color:#fff; padding:8px 14px; font-family:inherit; font-size:13.5px; outline:none;" onkeydown="if(event.key==='Enter') sendM()">
      <button class="glass-circle btn-acc" onclick="sendM()">${SVG.send}</button>
    </div>`;
}
function sendM() {
  const v = document.getElementById('mIn').value.trim();
  if (!v) return;
  const ms = getMsgs();
  ms.push({ f: 'me', t: v });
  const rp = ['Noted.', 'Looks clean.', 'Done.', 'Copy that.'];
  ms.push({ f: 'them', t: rp[ms.length % rp.length] });
  LS.set('sky26-msgs', JSON.stringify(ms));
  rMsg(EL.appBody);
}

/* --- Expanded Settings & Download --- */
function downloadSkyOS() {
  const doc = document.documentElement.cloneNode(true);
  const sc = doc.querySelector('#screen');
  if (sc) {
    sc.classList.remove('unlocked', 'app-open', 'reduce-motion');
    sc.removeAttribute('style');
  }
  const ls = doc.querySelector('#lockscreen');
  if (ls) ls.classList.remove('unlocked');
  const pn = doc.querySelector('#panel');
  if (pn) pn.classList.remove('show');
  ['homeGrid','dockGrid','appBody','appBottomSlot','appRightSlot','wallLayer','spotifyMount'].forEach(id => {
    const el = doc.querySelector('#' + id);
    if (el) el.innerHTML = '';
  });
  const html = '<!DOCTYPE html>\n' + doc.outerHTML;
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  showToast('Downloaded index.html');
}

        </div>

          <input type="color" value="${curAcc.startsWith('#') ? curAcc : '#7dd3fc'}" onchange="setAccent(this.value)" style="width:24px; height:24px; border:0; background:none; padding:0; cursor:pointer;">
        </div>
      </div>
      <div class="list-row" style="flex-direction:column; align-items:stretch; gap:10px;">

          ${WALLS.map((w, i) => `<div onclick="setWallpaper(${i}); rSettings(EL.appBody)" style="height:54px; border-radius:12px; cursor:pointer; background:${w.thumb}; border:2px solid ${wallIdx === i ? 'var(--accent)' : 'rgba(255,255,255,0.15)'}"></div>`).join('')}

    <div class="sec-lbl">Display & Clock</div>

        <button class="toggle ${prefs.hour24 ? 'on' : ''}" onclick="prefs.hour24=!prefs.hour24; LS.set('sky26-24h', prefs.hour24?'1':'0'); tickClock(); rSettings(EL.appBody)"><span></span></button>

      </div>
      <div class="list-row">
        <span style="font-size:13.5px; font-weight:500;">Reduce Motion</span>
        <button class="toggle ${prefs.reduceMotion ? 'on' : ''}" onclick="applyReduceMotion(!prefs.reduceMotion); rSettings(EL.appBody)"><span></span></button>
      </div>
      <div class="list-row">
        <span style="font-size:13.5px; font-weight:500;">UI Sounds</span>
        <button class="toggle ${prefs.sound ? 'on' : ''}" onclick="toggleMute(EL.ccMute); rSettings(EL.appBody)"><span></span></button>
      </div>
    </div>

    <div class="sec-lbl">Music Folder Sync</div>
    <div class="list-group">
      <div class="list-row" style="flex-direction:column; align-items:stretch; gap:8px;">

      <div class="list-row"><span style="font-size:13.5px; font-weight:500;">Factory Reset</span><button class="btn btn-red" style="padding:7px 14px; font-size:12px;" onclick="LS.clear(); location.reload();">Reset</button></div>

function saveRepoSync() {
  const val = document.getElementById('repoIn').value.trim();
  if (val) { prefs.repo = val; LS.set('sky26-repo', val); }
  syncMusicLibrary(false);
}

function setAccent(c) {
  document.documentElement.style.setProperty('--accent', c);
  LS.set('sky26-acc', c);
  showToast('Tint updated');
}

function rAbout(body) {
  body.innerHTML = `
    <div style="text-align:center; padding:24px 0;">
      <div class="lg" style="width:72px; height:72px; border-radius:22px; margin:0 auto 14px; display:grid; place-items:center;">${SVG.appAbout}</div>
      <div style="font-size:22px; font-weight:600;">SkyOS 26</div>
      <div style="font-size:12.5px; color:var(--muted);">Liquid Glass Build</div>
    </div>
    <div class="list-group">
      <div class="list-row"><span style="color:var(--muted); font-size:13px;">Material</span><strong>Liquid Glass</strong></div>
      <div class="list-row"><span style="color:var(--muted); font-size:13px;">Apps</span><strong>${HOME_APPS.length + 2}</strong></div>
      <div class="list-row"><span style="color:var(--muted); font-size:13px;">Library</span><strong>${LIBRARY.length} tracks</strong></div>
      <div class="list-row"><span style="color:var(--muted); font-size:13px;">Display</span><strong>${window.innerWidth} × ${window.innerHeight}</strong></div>
    </div>
    <button class="btn btn-acc" style="width:100%;" onclick="downloadSkyOS()">Download index.html</button>`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { goHome(); return; }
  if (activeApp !== 'calculator') return;
  const m = { '/': '÷', '*': '×', '-': '−', '+': '+', 'Enter': '=', 'Backspace': '⌫', 'Escape': 'AC' };
  if ('0123456789.()'.includes(e.key)) cKey(e.key);
  else if (m[e.key]) { e.preventDefault(); cKey(m[e.key]); }
});

init();
</script>
